schemaVersion: 2.3.0
metadata:
  name: weebo-notify-v2
# Eclipse Che workspace (design §12.4).
#
# Parity with dev/compose.yaml: the same services, on the same ports, with the same
# credentials. Every component shares this pod, so everything is reachable on
# `localhost` exactly as it is under compose — which is why one config/dev.toml
# serves both worlds with no `if env == che` anywhere in the code.
#
# Two services are deliberately absent, for opposite reasons:
#
#   * Authentik — too heavy (~1.5 GiB with worker and Redis). Fidelity is exercised
#     in local compose (`task dev:auth`) and in the `oidc-compat` CI matrix (§3.2);
#     that trade is the whole point of the three-tier auth strategy (§12.1).
#
#   * The identity provider — not a container at all any more. `task dev:oidc` runs
#     the `oidc-mock` binary from this workspace inside the `tools` container, next
#     to the server and the web dev server (ADR-0014). No image to pull, no sidecar
#     to schedule, and the inline-YAML generator this file used to carry is gone
#     with it.
parent:
  uri: https://raw.githubusercontent.com/batleforc/WeeboDevImage/refs/heads/main/che-min-mise/devfile.yaml
components:
  - name: postgres
    container:
      image: postgres:17-alpine
      memoryLimit: 512Mi
      env:
        - {name: POSTGRES_USER, value: weebo}
        - {name: POSTGRES_PASSWORD, value: weebo}
        - {name: POSTGRES_DB, value: weebo_notify}
        # The mounted volume root is not empty, so PGDATA points at a subdirectory.
        - {name: PGDATA, value: /data/pgdata}
      volumeMounts:
        - {name: pg-data, path: /data}
      endpoints:
        - {name: postgres, targetPort: 5432, exposure: internal}
  - name: rustfs
    container:
      image: rustfs/rustfs:latest
      memoryLimit: 512Mi
      env:
        - {name: RUSTFS_ACCESS_KEY, value: weebo-dev}
        - {name: RUSTFS_SECRET_KEY, value: weebo-dev-secret}
        - {name: RUSTFS_VOLUMES, value: /data}
        - {name: RUSTFS_CONSOLE_ENABLE, value: "true"}
      volumeMounts:
        - {name: rustfs-data, path: /data}
      endpoints:
        - {name: s3, targetPort: 9000, exposure: internal}
        - {name: rustfs-console, targetPort: 9001, exposure: public, protocol: https}
  - name: redis
    container:
      image: valkey/valkey:8-alpine
      memoryLimit: 128Mi
      endpoints:
        - {name: redis, targetPort: 6379, exposure: internal}
  - name: pg-data
    volume: {size: 2Gi}
  - name: rustfs-data
    volume: {size: 2Gi}
commands:
  - id: dev-seed
    exec:
      component: tools
      commandLine: "task dev:seed"
      workingDir: "${PROJECT_SOURCE}"
      group: {kind: build}
  - id: run-oidc
    exec:
      component: tools
      # Che routes ports it sees a process listening on, exactly as it does for the
      # server (:8080) and Vite (:5173). OIDC redirects travel through the
      # developer's browser, which cannot reach this pod's localhost — so export
      # the route Che offers before running the server (§12.1):
      #   WNK_OIDC_MOCK_ISSUER=https://<route>  (what the provider calls itself)
      #   WNK_OIDC__ISSUER=https://<route>      (what the server expects; beats dev.toml)
      commandLine: "task dev:oidc"
      workingDir: "${PROJECT_SOURCE}"
      group: {kind: run}
  - id: run-server
    exec:
      component: tools
      commandLine: "task dev:run"
      workingDir: "${PROJECT_SOURCE}"
      group: {kind: run, isDefault: true}
  - id: run-web
    exec:
      component: tools
      commandLine: "task dev:web"
      workingDir: "${PROJECT_SOURCE}"
      group: {kind: run}
  - id: run-docs
    exec:
      component: tools
      commandLine: "task dev:docs"
      workingDir: "${PROJECT_SOURCE}"
      group: {kind: run}
