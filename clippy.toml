# `clippy::doc_markdown` (from the pedantic group) flags any CamelCase word in docs
# as a missing code span. Most of our vocabulary is product and protocol names that
# read as prose, not as code — list them here rather than backtick-quoting English.
#
# ".." keeps clippy's own default list and appends to it.
doc-valid-idents = [
    "..",
    "APNs",
    "AppImage",
    "ArgoCD",
    "Authentik",
    "CloudNativePG",
    "Fumadocs",
    "GitOps",
    "Forgejo",
    "IdP",
    "JWKS",
    "Keychain",
    "Keystore",
    "MinIO",
    "OpenAPI",
    "OpenTelemetry",
    "PostgreSQL",
    "PKCE",
    "RustFS",
    "SQLite",
    "StrongBox",
    "Tauri",
    "TestFlight",
    "UnifiedPush",
    "Valkey",
    "WebPush",
    "X25519",
    "XChaCha20",
]

# weebo-good-practice: a failing test should fail loudly, so tests may index directly;
# `indexing_slicing` (denied workspace-wide) applies to everything else.
allow-indexing-slicing-in-tests = true
