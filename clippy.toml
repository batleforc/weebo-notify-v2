# `clippy::doc_markdown` (from the pedantic group) flags any CamelCase word in docs
# as a missing code span. Most of our vocabulary is product and protocol names that
# read as prose, not as code — list them here rather than backtick-quoting English.
#
# ".." keeps clippy's own default list and appends to it.
doc-valid-idents = [
    "..",
    "APNs",
    "AppImage",
    "ArgoCD",
    "Authentik",
    "CloudNativePG",
    "Fumadocs",
    "GitOps",
    "Forgejo",
    "IdP",
    "JWKS",
    "Keychain",
    "Keystore",
    "MinIO",
    "OpenAPI",
    "OpenTelemetry",
    "PostgreSQL",
    "PKCE",
    "RustFS",
    "SQLite",
    "StrongBox",
    "Tauri",
    "TestFlight",
    "UnifiedPush",
    "Valkey",
    "WebPush",
    "X25519",
    "XChaCha20",
]

# weebo-good-practice: a failing test should fail loudly, so tests may panic, unwrap
# and index directly; the denies in Cargo.toml's [workspace.lints] apply to everything else.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true

# The gap between two instants always fits in a duration (time's ±9999-year range,
# chrono's `signed_duration_since`):
# subtracting them cannot overflow, so `arithmetic_side_effects` has nothing to guard.
arithmetic-side-effects-allowed-binary = [
    ["time::OffsetDateTime", "time::OffsetDateTime"],
    ["chrono::DateTime", "chrono::DateTime"],
]
