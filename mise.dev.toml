# Tools a developer wants and a CI runner has no use for (advisory SEC-P2-08).
#
# Loaded only when `MISE_ENV=dev` is set, which `task init` arranges. `mise.toml`
# holds what building, testing and releasing this project needs; everything here is
# for the person doing it.
#
# Why the split is a security item rather than tidiness: every workflow runs
# `mise install --yes`, including the release job that holds the registry token and
# the keyless signing identity. Each tool installed in that job is another
# publisher's infrastructure inside the blast radius of a release, for no benefit —
# none of these three is invoked by any gate.
#
# Adding a tool here costs CI nothing. Adding one to `mise.toml` puts it in the
# release path, so that is the decision worth pausing over.

[tools]
# The assistant this repository is developed with.
claude = "latest"
# Token-optimised command wrappers (see CLAUDE.md).
rtk = "latest"
herdr = "latest"
# JSON plumbing for the shell steps of the tasks (weebo-base).
jq = "latest"
# Python tool installer for the pipx tool below.
uv = "latest"
# Knowledge graph behind the `/graphify` skill and the .claude/settings.json hooks.
"pipx:graphifyy" = "latest"
# Code-quality scanner from weebo-base.
"pipx:desloppify[full]" = "latest"
# `wska`, which links the weebo-skillsagent skills (`task skills:install`). Pinned
# like weebo-base pins it: the CLI and the skill layout it expects move together.
"github:batleforc/weebo-skillsagent" = "0.5.0"
