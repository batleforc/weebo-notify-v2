version: "3"

includes:
  mise: ./.tasks/mise.yaml
  dev: ./.tasks/dev.yaml
  gen: ./.tasks/gen.yaml
  lint: ./.tasks/lint.yaml
  test: ./.tasks/test.yaml
  audit: ./.tasks/audit.yaml
  adr: ./.tasks/adr.yaml
  release: ./.tasks/release.yaml
  tauri: ./.tasks/tauri.yaml

tasks:
  init:
    desc: "Install the toolchain and the git hooks, then create the local secrets — run once after cloning"
    cmds:
      - mise install
      - cog install-hook -a -o
      - cmd: '[ -f docs/package.json ] && pnpm -C docs install || true'
        silent: true
      - cmd: '[ -f web/package.json ] && pnpm -C web install || true'
        silent: true
      # Last, and part of `init` rather than a step to remember: everything above
      # is what the repository needs, this is what running it needs, and a setup
      # split in two is a setup somebody does half of.
      - task: dev:setup

  recu:
    desc: "Recurring job: export the OpenAPI spec, regenerate the derived clients and the sqlx offline data"
    cmds:
      - task: gen

  cover:
    desc: "Run the whole test suite with coverage and merge the Rust + web LCOV reports"
    cmds:
      - task: test:cover
