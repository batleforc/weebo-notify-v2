version: "3"

includes:
  mise: ./.tasks/mise.yaml
  skills: ./.tasks/skills.yaml
  template: ./.tasks/template.yaml
  build: ./.tasks/build.yaml
  dev: ./.tasks/dev.yaml
  gen: ./.tasks/gen.yaml
  lint: ./.tasks/lint.yaml
  test: ./.tasks/test.yaml
  audit: ./.tasks/audit.yaml
  adr: ./.tasks/adr.yaml
  release: ./.tasks/release.yaml
  tauri: ./.tasks/tauri.yaml
  browser: ./.tasks/browser.yaml
  desktop: ./.tasks/desktop.yaml
  helm: ./.tasks/helm.yaml
  android: ./.tasks/android.yaml
  ops: ./.tasks/ops.yaml
  perf: ./.tasks/perf.yaml
  deps: { taskfile: ./.tasks/deps.yaml, flatten: true }

tasks:
  init:
    desc: "Install the toolchain and the git hooks, then create the local secrets — run once after cloning"
    cmds:
      # `MISE_ENV=dev` pulls in `mise.dev.toml` as well — the tools a developer
      # wants and CI has no use for (SEC-P2-08). Export it in your shell profile
      # to keep them on your PATH afterwards; without it you get exactly what CI
      # gets, which is a supported and slightly emptier setup.
      - MISE_ENV=dev mise install
      # Hooks first: they carry gitleaks, and nothing below may stand between a
      # clone and them.
      - cog install-hook -a -o
      # Skills linked by wska from weebo-skillsagent (weebo-base), as recorded in
      # .claude/wska.toml: `frontend` for web/ and its Playwright suite, `weebo` for
      # the house practices, weebo-helm for charts/weebo-notify.
      # Optional tooling — a network hiccup or a missing clone must not stop init.
      - cmd: MISE_ENV=dev mise exec -- task skills:install
        ignore_error: true
      - cmd: '[ -f docs/package.json ] && pnpm -C docs install || true'
        silent: true
      - cmd: '[ -f web/package.json ] && pnpm -C web install || true'
        silent: true
      # Last, and part of `init` rather than a step to remember: everything above
      # is what the repository needs, this is what running it needs, and a setup
      # split in two is a setup somebody does half of.
      - task: dev:setup

  update:
    desc: "Bump every mise tool to its latest version (mise.toml ranges included) and regenerate mise.lock"
    cmds:
      - mise upgrade --bump
      - task mise:lock:gen

  recu:
    desc: "Recurring job: export the OpenAPI spec, regenerate the derived clients and the sqlx offline data"
    cmds:
      - task: gen

  cover:
    desc: "Run the whole test suite with coverage and merge the Rust + web LCOV reports"
    cmds:
      - task: test:cover
