# pnpm blocks dependency build scripts unless they are explicitly approved — a
# supply-chain guard, since a postinstall script runs arbitrary code from a
# transitive dependency. Both entries below are needed by the Fumadocs toolchain
# and are approved deliberately:
#
#   esbuild — downloads and links its platform binary; the MDX pipeline needs it.
#   sharp   — native image codecs, used by Next.js for the OG image route.
#
# Anything new appearing here should be a conscious decision, not a reflex.
allowBuilds:
  esbuild: true
  sharp: true

# Transitive versions forced up because `task audit` flagged them. Both are pinned
# by Next.js rather than by us, so an override is the only way to reach the fix
# without waiting for an upstream release.
#
# Each entry is a liability: it makes us responsible for a compatibility we did not
# test upstream. Re-run `task audit` after removing one to check whether it is still
# needed — they should not outlive the advisory.
overrides:
  # GHSA-r28c-9q8g-f849 — path traversal via sourceMappingURL auto-loading;
  # CVE-2026-45623 — information disclosure and denial of service on crafted CSS.
  postcss: ^8.5.18
  # GHSA-f88m-g3jw-g9cj — inherited libvips vulnerabilities;
  # GHSA-rgj7-g3m4-5g8c — inherited libheif vulnerabilities, fixed in 0.35.4;
  # a later libvips advisory is fixed in 0.35.5.
  sharp: ^0.35.5
  # GHSA-2v37-7h3g-55p8 — nanoid's custom alphabet generator can loop forever
  # when size is 0, fixed in 3.3.17. Reaches us through postcss above, same as
  # web/pnpm-workspace.yaml's identical override.
  nanoid: ^3.3.17
  # GHSA fast-uri 3.x < 3.1.6 (four advisories, high). Reaches us only through
  # `serve` > ajv, the static preview server; fixed upstream in 3.1.6.
  fast-uri: ^3.1.6
  # compression <1.8.2 (high). Reaches us only through `serve`, the static preview
  # server; fixed upstream in 1.8.2.
  compression: ^1.8.2
  # brace-expansion 1.x <1.1.21 (high/moderate, ReDoS). Through `serve` > minimatch 3,
  # the static preview server; the 1.x line has the fix, so no major jump.
  "brace-expansion@1": ^1.1.21
  # source-map-js <1.2.2 (high). Through @tailwindcss/postcss at build time.
  source-map-js: ^1.2.2

# Same supply-chain gate CI's pnpm enforces: never resolve a version published less
# than a day ago, so a local install cannot produce a lockfile CI then refuses.
minimumReleaseAge: 1440
