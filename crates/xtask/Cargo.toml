[package]
name = "xtask"
description = "Build-time chores that need real code: OpenAPI client generation (design §3.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
# The VAPID key generator: `pkcs8` on top of the workspace's features, because the
# key is written in the PKCS#8 PEM form `[push.webpush]` reads.
getrandom = "0.3"
openapiv3 = "2.2"
p256 = { workspace = true, features = ["pkcs8"] }
prettyplease = "0.2"
progenitor.workspace = true
serde_json.workspace = true
syn = "2"
