[package]
name = "xtask"
description = "Build-time chores that need real code: OpenAPI client generation (design §3.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64 = { workspace = true }
# Dex development password: lets `dev/dex/render.sh` run without caddy or htpasswd.
bcrypt = { version = "0.19", default-features = false, features = ["std", "zeroize", "getrandom"] }
clap.workspace = true
# Stub notification daemon (`task desktop:notifyd`); `vendored` avoids needing libdbus-1-dev.
dbus = { version = "0.9", features = ["vendored"] }
getrandom = "0.4"
# Federation signing key (§5.3), in the PKCS#8 PEM form `jsonwebtoken` loads.
ed25519-dalek = { version = "3", features = ["pem"] }
jsonwebtoken.workspace = true
openapiv3 = "2.2"
# VAPID key generator: PKCS#8 PEM is the form `[push.webpush]` reads.
p256 = { workspace = true, features = ["pkcs8"] }
prettyplease = "0.3"
progenitor.workspace = true
serde.workspace = true
serde_json.workspace = true
syn = "3"
# Desktop icon rasteriser: pure Rust (no root for system packages, §12.4); no `text`, the marks are paths.
resvg = { version = "0.49", default-features = false }
