[package]
name = "notify-push-webpush"
description = "Web Push transport (RFC 8030/8291, VAPID) for PWA and desktop browsers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A valid VAPID key for tests, built from a fixed scalar. Off by default: nothing in
# production has any use for it, and the composition root turns it on in its
# `[dev-dependencies]` only.
test-utils = []

[dependencies]
notify-domain = { workspace = true }
notify-ports = { workspace = true }
# The retry loop and policy every push transport shares, and the public-only resolver.
notify-push-http = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
# Signs the VAPID assertion (RFC 8292). The same crate `notify-oidc` verifies with,
# rather than the second JWT library `web-push-native`'s own `vapid` feature pulls.
jsonwebtoken = { workspace = true }
# Key parsing and the public point only; the secret-key arithmetic is aws-lc's.
p256 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
# RFC 8291 content encryption (`src/encrypt.rs`). Deliberately NOT the `web-push`
# crate (it reaches OpenSSL through `ece`), nor `web-push-native` (p256 0.13).
aws-lc-rs = { workspace = true }

[dev-dependencies]
time = { workspace = true }
tokio = { workspace = true }
