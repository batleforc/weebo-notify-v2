[package]
name = "notify-push-unifiedpush"
description = "UnifiedPush transport for Android — keeps the push loop fully self-hosted."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
notify-domain = { workspace = true }
notify-ports = { workspace = true }
notify-sealed-box = { workspace = true }

async-trait = { workspace = true }
reqwest = { workspace = true }
# `lookup_host`, for the resolver that refuses non-public addresses.
tokio = { workspace = true, features = ["net"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
time = { workspace = true }
tokio = { workspace = true }
# Device keys for envelope tests only.
x25519-dalek = { version = "3", features = ["static_secrets"] }
