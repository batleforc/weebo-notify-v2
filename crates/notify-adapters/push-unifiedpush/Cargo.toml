[package]
name = "notify-push-unifiedpush"
description = "UnifiedPush transport for Android — keeps the push loop fully self-hosted."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
notify-domain = { workspace = true }
notify-ports = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The sealed box (design §6.2): ephemeral X25519 ECDH, HKDF-SHA256, then
# XChaCha20-Poly1305 — see `sealed_box.rs` for why each one.
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
chacha20poly1305 = { workspace = true }

[dev-dependencies]
time = { workspace = true }
tokio = { workspace = true }
# `static_secrets` only to stand in for the *device's* long-term keypair in tests
# proving a sealed box opens — production never holds one, only the public half
# (design §6.2). Added here rather than in `[dependencies]` so a plain build links
# what it actually uses: an `EphemeralSecret` per seal, never reused, never stored.
x25519-dalek = { version = "3", features = ["static_secrets"] }
