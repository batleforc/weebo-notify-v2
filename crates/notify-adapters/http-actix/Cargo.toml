[package]
name = "notify-http-actix"
description = "REST + SSE/WebSocket adapter (Actix Web, OpenAPI generated by utoipa)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `openapi`: the spec describes the types actually serialised (ADR-0013).
notify-app = { workspace = true, features = ["openapi"] }
notify-domain = { workspace = true, features = ["openapi"] }
notify-ports = { workspace = true, features = ["openapi"] }
# Direct, not via a port (ADR-0022): the fs routes need `FsAttachments::verify`.
notify-attachments-fs = { workspace = true }

actix-web = { workspace = true }
actix-web-lab = { workspace = true }
actix-ws = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
# Only for the SSE channel; actix brings the runtime.
tokio = { workspace = true, features = ["test-util"] }
# `ReaderStream`, to stream a filesystem attachment's download off its file handle.
# Already in the tree under actix and hyper.
tokio-util = { version = "0.7", features = ["io"] }
tracing = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-actix-web = { workspace = true }

[dev-dependencies]
# The real decoder, so avatar tests prove what reaches the bucket (design §15).
notify-avatars = { workspace = true }
notify-ports = { workspace = true, features = ["openapi", "test-utils"] }
# Builds the JPEG fixtures that prove the server re-encodes avatars.
image = { workspace = true, features = ["jpeg"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
