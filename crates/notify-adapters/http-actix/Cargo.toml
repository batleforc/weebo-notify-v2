[package]
name = "notify-http-actix"
description = "REST + SSE/WebSocket adapter (Actix Web, OpenAPI generated by utoipa)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The `openapi` feature is what lets the spec describe the types the server
# actually serialises, rather than a mirror of them (ADR-0013).
notify-app = { workspace = true, features = ["openapi"] }
notify-domain = { workspace = true, features = ["openapi"] }
notify-ports = { workspace = true, features = ["openapi"] }

actix-web = { workspace = true }
actix-web-lab = { workspace = true }
actix-ws = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
# Only for the bounded channel behind an SSE response: no runtime is started here,
# actix brings its own.
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-actix-web = { workspace = true }

[dev-dependencies]
# The real decoder in the HTTP suite: an avatar test that stubbed it would prove
# the route works and nothing about what reaches the bucket (design §15).
notify-avatars = { workspace = true }
notify-ports = { workspace = true, features = ["openapi", "test-utils"] }
# The suite builds its own fixtures — a 900x300 JPEG is the only way to prove the
# server resized and re-encoded rather than stored what it was given.
image = { workspace = true, features = ["jpeg"] }
tokio = { workspace = true }
url = { workspace = true }
