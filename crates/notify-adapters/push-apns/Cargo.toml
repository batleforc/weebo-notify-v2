[package]
name = "notify-push-apns"
description = "APNs transport for iOS (token-based .p8 authentication)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A derived ES256 test key (no PEM literal for scanners to flag).
test-utils = []

[dependencies]
notify-domain = { workspace = true }
notify-ports = { workspace = true }
# Shared retry loop and policy.
notify-push-http = { workspace = true }
notify-sealed-box = { workspace = true }

async-trait = { workspace = true }
# Signs the ES256 provider token.
jsonwebtoken = { workspace = true }
# Reads the `.p8` key; jsonwebtoken (aws-lc) does the signing.
p256 = { version = "0.14", features = ["pem", "pkcs8"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
x25519-dalek = { version = "3", features = ["static_secrets"] }
