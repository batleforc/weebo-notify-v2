[package]
name = "notify-push-apns"
description = "APNs transport for iOS (token-based .p8 authentication)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A deterministic ES256 test key, same reason and same construction as
# `notify-push-webpush`'s `test-utils`: a PEM literal in a source file is exactly
# what `task audit`/gitleaks exist to catch, so the key is derived rather than
# pasted. Off by default; the composition root turns it on in its
# `[dev-dependencies]` only.
test-utils = []

[dependencies]
notify-domain = { workspace = true }
notify-ports = { workspace = true }
# The sealed box (design §6.2): ephemeral X25519 ECDH, HKDF-SHA256, then
# XChaCha20-Poly1305 — shared with `notify-push-unifiedpush` since M7.
notify-sealed-box = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
# Signs the APNs provider token (ES256 JWT, `.p8` key) — the same crate
# `notify-push-webpush` signs VAPID with and `notify-oidc` verifies with.
jsonwebtoken = { workspace = true }
# The `.p8` key is a P-256 private key, same as VAPID's — pinned to 0.13 to match
# `notify-push-webpush`, which needs that version for `web-push-native`. Both
# already in the lockfile.
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
time = { workspace = true }
tokio = { workspace = true }
x25519-dalek = { version = "3", features = ["static_secrets"] }
