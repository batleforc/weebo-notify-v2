[package]
name = "notify-push-http"
description = "What every HTTP push transport shares: the retry policy and loop, and the resolver that refuses non-public addresses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
notify-domain = { workspace = true }

reqwest = { workspace = true }
# `lookup_host` for the resolver; `time` for the backoff and the overall cap.
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
