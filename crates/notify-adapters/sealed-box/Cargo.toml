[package]
name = "notify-sealed-box"
description = "The sealed box of design §6.2: ephemeral X25519 ECDH, HKDF-SHA256, XChaCha20-Poly1305 — shared by every relayed push transport (UnifiedPush, APNs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
notify-domain = { workspace = true }

base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
x25519-dalek = { workspace = true }

[dev-dependencies]
notify-ports = { workspace = true }
serde_json = { workspace = true }
# `static_secrets` stands in for a device keypair in tests; production only seals.
x25519-dalek = { version = "3", features = ["static_secrets"] }
