[package]
name = "notify-sealed-box"
description = "The sealed box of design §6.2: ephemeral X25519 ECDH, HKDF-SHA256, XChaCha20-Poly1305 — shared by every relayed push transport (UnifiedPush, APNs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
notify-domain = { workspace = true }

chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
x25519-dalek = { workspace = true }

[dev-dependencies]
# Only for the envelope-v2 round trip: what a relayed push seals is built by
# `PushMessage::sealed_plaintext`, and this is the one crate that can open a box.
notify-ports = { workspace = true }
serde_json = { workspace = true }
# `static_secrets` only to stand in for a *device's* long-term keypair in this
# crate's own tests, proving a sealed box opens — production never holds one, only
# the public half (design §6.2). A second entry with different features from
# `[dependencies]`, same as `notify-push-unifiedpush` did before this crate existed:
# a plain build links what `seal()` actually uses, an `EphemeralSecret` per call,
# never reused, never stored.
x25519-dalek = { version = "3", features = ["static_secrets"] }
