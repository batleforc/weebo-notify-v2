[package]
name = "notify-persistence-pg"
description = "PostgreSQL persistence adapter (sqlx) with versioned migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
notify-domain = { workspace = true }
notify-ports = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
notify-ports = { workspace = true, features = ["test-utils"] }
# For T24 alone (§3.4): creating a throwaway database and reading
# `_sqlx_migrations` are things the adapter has no business exposing as API.
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Building the webhook urls the sink-id migration test redacts.
url = { workspace = true }
