[package]
name = "notify-server"
description = "weebo-notify server: the composition root and its single binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base16ct = { workspace = true }
notify-attachments-fs.workspace = true
notify-attachments-s3.workspace = true
notify-avatars.workspace = true
notify-http-actix.workspace = true
notify-metrics-prometheus.workspace = true
notify-push-apns.workspace = true
notify-push-unifiedpush.workspace = true
notify-push-webpush.workspace = true
notify-sinks-email.workspace = true
notify-sinks-webhook.workspace = true

actix-web.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
utoipa.workspace = true
utoipa-actix-web.workspace = true
notify-app.workspace = true
notify-domain.workspace = true
notify-eventbus-pg.workspace = true
notify-oidc.workspace = true
notify-persistence-pg.workspace = true
notify-ports.workspace = true

async-trait.workspace = true
figment.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
utoipa-scalar.workspace = true
actix-cors.workspace = true
futures.workspace = true
url.workspace = true

[dev-dependencies]
# `test` brings figment's `Jail`, which is the only way to exercise the `WNK_*`
# environment layer here: the workspace forbids `unsafe`, and `std::env::set_var`
# has been unsafe since the 2024 edition.
figment = { workspace = true, features = ["test"] }
notify-ports = { workspace = true, features = ["test-utils"] }
notify-push-apns = { workspace = true, features = ["test-utils"] }
notify-push-webpush = { workspace = true, features = ["test-utils"] }
sqlx = { workspace = true }
