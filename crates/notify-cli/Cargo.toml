[package]
name = "notify-cli"
description = "The  binary: scriptable CLI commands and, from M2, the ratatui TUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "notify"
path = "src/main.rs"

[dependencies]
notify-client-core.workspace = true

anyhow.workspace = true
# For the "arrived late" badge (§7.2): the same date type the generated client and
# the local store already speak, rather than a third one to convert between.
chrono.workspace = true
chrono-tz.workspace = true
# The desktop relay of §9.2. Pure Rust on every platform this ships to: zbus on
# Linux, the OS APIs elsewhere — no C toolchain, the rule this workspace has kept
# since M1.
notify-rust = { version = "4", default-features = false, features = ["d"] }
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
