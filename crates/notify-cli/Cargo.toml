[package]
name = "notify-cli"
description = "The  binary: scriptable CLI commands and, from M2, the ratatui TUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "notify"
path = "src/main.rs"

[dependencies]
notify-client-core.workspace = true

# The "arrived late" badge (§7.2), in the date type the client and store already use.
chrono.workspace = true
# Desktop relay (§9.2). Feature `z` (pure-Rust zbus), not `d` (libdbus C bindings):
# nothing to link in the image or the published binary.
notify-rust = { version = "4", default-features = false, features = ["z"] }
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
# `unstable-rendered-line-info` for `Paragraph::line_count`: the Détail scroll bound
# needs the wrapped row count (unstable API shape only; pinned by Cargo.lock).
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
open = "5.4.4"
# Where `notify login` keeps the token (Secret Service, Keychain, Credential
# Manager), the same crate and version the desktop shell already uses
# (`web/src-tauri`). On Linux it is the zbus Secret Service backend — pure Rust,
# the same zbus `notify-rust` above already pulls in, so still nothing to link.
keyring = "4.2.0"
