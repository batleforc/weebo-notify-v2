[workspace]
resolver = "3"
members = [
    "crates/notify-domain",
    "crates/notify-ports",
    "crates/notify-app",
    "crates/notify-adapters/http-actix",
    "crates/notify-adapters/persistence-pg",
    "crates/notify-adapters/eventbus-pg",
    "crates/notify-adapters/oidc",
    "crates/notify-adapters/attachments-s3",
    "crates/notify-adapters/attachments-fs",
    "crates/notify-adapters/avatars",
    "crates/notify-adapters/push-webpush",
    "crates/notify-adapters/sealed-box",
    "crates/notify-adapters/sinks-webhook",
    "crates/notify-adapters/sinks-email",
    "crates/notify-adapters/metrics-prometheus",
    "crates/notify-adapters/push-unifiedpush",
    "crates/notify-adapters/push-apns",
    "crates/notify-adapters/push-http",
    "crates/notify-server",
    "crates/notify-client-api",
    "crates/notify-client-core",
    "crates/notify-cli",
    # Dev infrastructure: the local identity provider (ADR-0014) and repo chores.
    "crates/oidc-mock",
    "crates/xtask",
]

# The Tauri shell is its own workspace (GTK/WebKit, absent from Che), built by `task tauri:build` and CI.
exclude = ["web/src-tauri"]

[workspace.package]
# One product version (§3.2bis); `cog bump` syncs it to web/ and tauri.conf.json.
version = "0.1.0"
edition = "2024"
# 1.94 because sqlx 0.9 requires it (our own floor is 1.89, for `File::try_lock`,
# §9.3bis). Cargo resolves against this, so an understated value holds crates back.
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/batleforc/weebo-notify-v2"
authors = ["Maxime Leriche <maxleriche.60@gmail.com>"]
# Nothing goes to crates.io: the product ships as binaries and images (§3.2bis).
publish = false

[workspace.dependencies]
# --- Internal crates ---
notify-domain = { path = "crates/notify-domain" }
notify-ports = { path = "crates/notify-ports" }
notify-app = { path = "crates/notify-app" }
notify-http-actix = { path = "crates/notify-adapters/http-actix" }
notify-persistence-pg = { path = "crates/notify-adapters/persistence-pg" }
notify-eventbus-pg = { path = "crates/notify-adapters/eventbus-pg" }
notify-oidc = { path = "crates/notify-adapters/oidc" }
notify-attachments-s3 = { path = "crates/notify-adapters/attachments-s3" }
notify-attachments-fs = { path = "crates/notify-adapters/attachments-fs" }
notify-avatars = { path = "crates/notify-adapters/avatars" }
notify-push-webpush = { path = "crates/notify-adapters/push-webpush" }
notify-sealed-box = { path = "crates/notify-adapters/sealed-box" }
notify-sinks-webhook = { path = "crates/notify-adapters/sinks-webhook" }
notify-sinks-email = { path = "crates/notify-adapters/sinks-email" }
notify-metrics-prometheus = { path = "crates/notify-adapters/metrics-prometheus" }
notify-push-unifiedpush = { path = "crates/notify-adapters/push-unifiedpush" }
notify-push-apns = { path = "crates/notify-adapters/push-apns" }
notify-push-http = { path = "crates/notify-adapters/push-http" }
notify-client-api = { path = "crates/notify-client-api" }
notify-client-core = { path = "crates/notify-client-core" }

# --- Core (allowed in notify-domain) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Writes the client profile (`notify login`, §9.1); figment only reads.
toml = "1.1"
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
ulid = { version = "3", features = ["serde"] }
url = { version = "2", features = ["serde"] }

# --- Async plumbing (adapters and above only) ---
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"

# --- HTTP / API ---
# No `http2`: h2 0.3 (RUSTSEC-2026-0258) has no fix, and TLS terminates at the
# ingress, which speaks HTTP/1.1 to us. The rest is actix-web's default set.
actix-web = { version = "4.17", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
actix-cors = "0.7"
actix-web-lab = "0.29"
# WebSocket without actors, so SSE and WS share one async loop (§8.1).
actix-ws = "0.4"
utoipa = { version = "6.0", features = ["actix_extras", "time", "ulid", "url"] }
utoipa-actix-web = "0.2"
utoipa-scalar = { version = "0.4", features = ["actix-web"] }

# --- Persistence ---
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "time",
    "json",
    "uuid",
] }

# --- Auth ---
# `aws_lc_rs`, not `rust_crypto`: the RustCrypto backend signs ES256 (APNs, VAPID) on
# p256 0.13, whose crypto-bigint 0.5 is not constant-time (RUSTSEC-2026-0387), and
# pulls `rsa` (RUSTSEC-2023-0071). aws-lc is already built for rustls, so no new toolchain.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
# Constant-time ECDH/HKDF/AES-GCM for RFC 8291 (notify-push-webpush); already in the tree via rustls.
aws-lc-rs = "1"
# Default features: `getrandom` is what gives password-hash an OS-backed salt generator.
argon2 = "0.6"

# --- Config & observability ---
figment = { version = "0.10", features = ["toml", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OTLP over HTTP+protobuf on rustls only (no tonic, no OpenSSL, §13). Blocking client:
# the batch span processor runs off-runtime, where async reqwest panics "no reactor running".
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }
tracing-opentelemetry = { version = "0.34", default-features = false, features = ["tracing-log"] }

# --- CLI ---
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
# The TUI (§9.2), portable via the crossterm backend.
ratatui = "0.30"
crossterm = "0.29"

# --- Error handling (adapters, binaries — never notify-domain) ---
anyhow = "1"

# --- Client codegen (ADR-0009) ---
# Generator only (xtask): the `macro` default drags in the unmaintained serde_yaml/unsafe-libyaml.
progenitor = { version = "0.15", default-features = false }
progenitor-client = "0.15"
# Needed by progenitor's output: `chrono` for `date-time`, `regress` for `pattern`.
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
regress = "0.12"
# No default-tls: we link rustls only, so the binaries stay free of OpenSSL.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "charset",
    "stream",
] }

# --- Cryptography outside the auth adapter ---
# Real ES256 keys, so tests and the dev IdP exercise the production verification path.
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
sha2 = "0.11"
# Bounded verdict cache in front of the API-key KDF (notify-oidc::guard).
lru = "0.19"
# OS CSPRNG for API-key generation; reading random bytes is all that's needed.
getrandom = "0.4"
base64 = "0.23"
# Sealed box (§6.2): X25519 ECDH, HKDF-SHA256, XChaCha20-Poly1305.
x25519-dalek = { version = "3", features = ["getrandom"] }
hkdf = "0.13"
chacha20poly1305 = "0.11"

http = "1"
rust-s3 = { version = "0.38", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }

# --- Media (design §2.4, §15) ---
# Only the formats §2.4 accepts: every decoder is a parser reachable from an upload.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# --- Client-side storage (design §9.3bis) ---
# `bundled` builds SQLite from source. Pinned to 0.39: `libsqlite3-sys` is `links = "sqlite3"`
# and must match the one sqlx pulls in; bump both together.
rusqlite = { version = "0.39", features = ["bundled"] }

# --- Test-only ---
testcontainers = "0.28"
tempfile = "3"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A malformed payload must become a 4xx, never a downed replica; tests opt out per module.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Noise from the pedantic group that fights the domain vocabulary.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `#[async_trait]` expands every trait method into a `#[must_use]` fn returning a
# boxed future, which is `#[must_use]` already; clippy 1.99 flags the pair on code
# the macro wrote, not this repo.
double_must_use = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Keeps `target/` small: line tables suffice for backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
