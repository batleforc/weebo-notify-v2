# cargo-audit configuration for the desktop shell's own Cargo.lock, read by
# `task audit:cargo` (which runs `cargo audit` from this directory). Same rule as
# the root `.cargo/audit.toml`: an ignore claims the advisory cannot reach us, and
# says what takes it back out.

[advisories]
ignore = [
    # RUSTSEC-2026-0367, -0368, -0369 — `zip` < 9: extraction keeps SUID/SGID bits,
    # follows attacker-chosen symlinks, and applies permissions through them.
    #
    # `zip` 4.6.1 is pulled only by `tauri-plugin-updater` 2.14.0 (the latest), only
    # on Windows, to unpack the update it just downloaded. `download()` checks the
    # minisign signature against the key in tauri.conf.json before returning the
    # bytes, and `download_and_install` (lib.rs) extracts only those. A hostile
    # archive therefore needs our release key — whoever holds it can already ship
    # any binary, so the extraction bugs add nothing. SUID/SGID and the symlink
    # cases are also Unix semantics on an extraction that only runs on Windows.
    # Checked 2026-10-24.
    #
    # REVISIT when `tauri-plugin-updater` requires zip >= 9 (`task audit:suppressions`
    # reports it), or if this app ever extracts a zip it did not verify first.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
