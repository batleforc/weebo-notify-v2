# The desktop shell (design §10bis.3, milestone M5).
#
# `[workspace]` is empty **on purpose**: this crate is deliberately NOT a member of
# the repository's cargo workspace. On Linux Tauri links against GTK/WebKit, which
# `mise` cannot install and a Che workspace cannot `apt-get` (§12.4, D13) — so a
# member here would break `cargo build --workspace`, `task test` and every gate for
# everybody working on the server, on a machine that has no business building a
# desktop app.
#
# The cost of that choice, stated plainly: nothing in this directory is compiled by
# any gate in this repository today. It is written and unbuilt, exactly like the two
# Containerfiles of D17, and it stays that way until the dev image carries the stack
# — at which point this becomes a member and the gates pick it up.
[workspace]

[package]
name = "weebo-notify-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "weebo-notify desktop shell"
# Spelled out rather than inherited: this crate is deliberately not a workspace
# member (above), so `license.workspace = true` is not available to it and it
# declared nothing at all until `task audit:cargo` started reading this manifest
# and said so. Same licence as everything else in the repository.
license = "Apache-2.0"

# Required by Tauri's own tooling before `cargo tauri android/ios init` will do
# anything at all — mobile links this crate as a `staticlib`/`cdylib` and calls
# into `lib.rs::run` via `tauri::mobile_entry_point`, not `fn main` (M6, §10bis.4).
# `rlib` keeps the desktop binary (`main.rs`) linking against it exactly as before.
# Naming it explicitly rather than trusting the package-name default: the day a
# mobile build reads this manifest, the name should say it wasn't a guess.
[lib]
name = "weebo_notify_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri's production switch, and the one thing that decides what the shell shows.
# `WebviewUrl::default()` resolves to the embedded `frontendDist` (web/dist) when
# this is on, and to `build.devUrl` (http://localhost:5173) when it is not — so a
# release binary built without it opens a window reading « Could not connect to
# localhost: Connection refused » unless a Vite dev server happens to be running.
# `cargo tauri build` passes it by itself; `cargo build`, which `task tauri:build`
# uses, does not, and it cannot pass what the manifest never declared.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.2.0"
# The interesting half of this shell lives here and is tested by `task test` on any
# machine: the tray state machine (§10bis.3ter) and the deep-link parser
# (§10bis.3quater). What is left in `main.rs` is binding, which is the part that
# genuinely needs a webview to mean anything.
notify-client-core = { path = "../../crates/notify-client-core" }

# The deep-link payload the front end listens for — one small object, and the shell
# has no other reason to serialise anything.
serde_json = "1"
# "image-png" decodes the four committed tray PNGs (icons/tray-*.png) into the
# `tauri::image::Image` the tray icon wants — not implied by "tray-icon" or the
# default feature set.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
# The native "use this server?" confirmation of RFC 0001 (decision 5): called from Rust
# only, so no `dialog:` permission reaches the webview, which therefore cannot draw it.
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Opens the authorization URL in the system browser (RFC 8252 wants an external
# user-agent — see `oauth.rs`). The plugin rather than a `Command::new("xdg-open")`
# of our own: the Windows spelling is `cmd /C start`, whose argument parsing treats
# the `&` between every OAuth query parameter as a command separator, and getting
# that wrong produces a login that works on two platforms out of three.
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Direct rather than only transitive: Tauri already runs its own tokio runtime
# (`tauri::async_runtime`), but naming `tokio::time::interval` needs a manifest
# entry of our own. "rt" is for the *second*, private current-thread runtime
# `run_daemon` builds for itself — `Store` (rusqlite) is `Send` but not `Sync`, so
# its polling loop cannot share Tauri's multi-thread one (see `run_daemon`'s doc).
tokio = { version = "1", default-features = false, features = ["time", "rt"] }

# Self-update (desktop only — there is no updater on Android/iOS, the store is).
# Registered at runtime only when the build carries a `plugins.updater` config
# with a `pubkey` (see `lib.rs::run` and README.md « Updates and signing »): the
# plugin refuses to start without one, and an unsigned dev build must still run.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# shortcut: tauri-plugin-deep-link 2.6.2 builds `ini::ParseOption` without the fields
# rust-ini 0.21.2 added, so it fails to compile on Linux; drop this pin when a
# deep-link release sets them (or uses `..Default::default()`).
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"

[dev-dependencies]
tempfile = "3.27.0"

# Copied from the root [workspace.lints]: this crate is not a member (above), so
# `[lints] workspace = true` cannot reach it. Keep the two in step.
[lints.rust]
missing_debug_implementations = "warn"
# `deny`, not the workspace's `forbid`: Tauri's mobile entry point is FFI, and only
# `deny` lets that one item carry a reasoned `#[expect]`.
unsafe_code = "deny"
unreachable_pub = "warn"
# `let _ =` drops on the spot; with a guard that is a bug, with a `Result` an ignored error.
let_underscore_drop = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A malformed payload must become a 4xx, never a downed replica; tests opt out per module.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# An error is handled, logged with why it is safe to go on, or `#[expect]`ed with the reason.
let_underscore_must_use = "deny"
let_underscore_future = "deny"
# A malformed index is a panic too; tests are exempt (clippy.toml).
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
# Every escape hatch carries its justification and dies with the code it excused.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Overflow (LANG-ARITH): checked_ (an error), saturating_ (a clamp) or wrapping_ (a hash);
# instant − instant is allowed in clippy.toml, since it cannot overflow.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
# Noise from the pedantic group that fights the domain vocabulary.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `#[async_trait]` expands every trait method into a `#[must_use]` fn returning a
# boxed future, which is `#[must_use]` already; clippy 1.99 flags the pair on code
# the macro wrote, not this repo.
double_must_use = "allow"

