<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>weebo-notify</title>
    <!--
      Installability (§10.4, M3.6). The colour is repeated here and in the manifest
      because both are read before any stylesheet exists — the one place §10.6's
      "no raw colour outside the tokens" cannot hold. It is the dark theme's
      `--background` and has to be updated with it.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#030001" />
    <!--
      The theme is applied before the first paint rather than by the app, because
      a reload that flashes white on a dark theme is a bug you ship exactly once.
      `dark` is on the element above already: it is the default (design §10.2) and
      this script only ever removes it.
    -->
    <script>
      (() => {
        const saved = localStorage.getItem("weebo-notify:theme");
        const system = window.matchMedia("(prefers-color-scheme: light)").matches;
        if (saved === "light" || (saved !== "dark" && system)) {
          document.documentElement.classList.remove("dark");
        }
        if (localStorage.getItem("weebo-notify:density") === "comfortable") {
          document.documentElement.classList.add("density-comfortable");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
