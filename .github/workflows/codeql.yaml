name: codeql

# Unfiltered by `paths:` on purpose: a filtered workflow does not run, so made
# required it would leave a pull request pending for ever. `actions` analyses these
# workflows themselves (injection, untrusted checkout), which matters on a public repo.
# Report only: alerts land in the Security tab.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "50 23 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
