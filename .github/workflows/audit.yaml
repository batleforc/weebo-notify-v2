name: audit

# Dependency and image vulnerability scanning.
#
# Scheduled rather than only on push, because this is the one check whose result
# changes without the code changing: an advisory published tonight makes a
# dependency vulnerable that was clean at merge time. A job that only ran on pull
# requests would report the state of the world on the day of the merge and never
# again.
#
# Moved here from `.forgejo/workflows/` when GitHub became the primary forge — see
# `check.yaml`'s header for what the move changed.

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "deny.toml"
      - "**/pnpm-lock.yaml"
      - "Containerfile*"
      - "charts/**"
      - "**/.trivyignore.yaml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "deny.toml"
      - "**/pnpm-lock.yaml"
      - "Containerfile*"
      - "charts/**"
      - "**/.trivyignore.yaml"
  workflow_dispatch:
  # release.yaml calls this on the tagged commit: a tag must pass today's
  # advisories, not the ones that existed when its last pull request merged.
  workflow_call:

# Least privilege; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        # A pinned, checksum-verified binary rather than `curl https://mise.run | sh`.
        # That pipeline fetched an unpinned script over the network and ran it as
        # shell — in jobs that also hold the registry token and the signing identity,
        # which makes whoever controls that host a publisher of this project's
        # images. The version moves when Renovate proposes it, as a reviewable diff.
        env:
          MISE_VERSION: "v2026.10.12"
          MISE_SHA256: "72404716768b5b044cbd5170136d3d795cbd592658b6e932b66f0f8d67a54875"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64" \
            -o "$HOME/.local/bin/mise"
          echo "${MISE_SHA256}  $HOME/.local/bin/mise" | sha256sum -c -
          chmod +x "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install pinned tools
        # Not optional, and not a nicety: the `aqua:` backend resolves every version
        # through the GitHub API, which allows 60 requests an hour to an
        # UNAUTHENTICATED caller — counted per IP, and a GitHub-hosted runner shares
        # its egress with everyone else on that host. The first run of this pipeline
        # exhausted it and died on `cargo-tauri` with a 403 that reads like the
        # release was deleted. The token every workflow already has raises the limit
        # to 1000/hour for this repository and needs no scopes to read public
        # releases.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise install --yes

      - name: Rust dependencies
        # RustSec advisories, plus the licence and source policy in deny.toml.
        run: mise exec -- task audit:cargo

      - name: Suppressed advisories
        # Advisory only (it never fails): reports which ignores in
        # .cargo/audit.toml / .trivyignore.yaml have become removable, which is
        # exactly the news a nightly run exists to deliver.
        run: mise exec -- task audit:suppressions

      - name: JavaScript dependencies
        run: mise exec -- task audit:web

      - name: Repository and image scan
        run: mise exec -- task audit:container

      - name: Helm chart scan
        # `audit:container` skips charts/ on purpose (see .tasks/audit.yaml); this
        # is where the chart is scanned instead, so skipping it there must not
        # mean skipping it everywhere.
        run: mise exec -- task audit:helm
