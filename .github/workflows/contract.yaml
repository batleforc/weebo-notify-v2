name: contract

# The OpenAPI document and everything derived from it are committed. This job
# regenerates them and fails on any difference (design §3.2).
#
# What that buys: the Rust client, the TypeScript client, the sqlx offline data and
# the devfile's inlined OIDC configuration cannot drift from the code they come
# from. Forgetting to run `task recu` breaks the pull request instead of shipping a
# client that disagrees with the server.
#
# Moved here from `.forgejo/workflows/` when GitHub became the primary forge — see
# `check.yaml`'s header for what the move changed.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

# Least privilege; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libdbus headers
        # `task recu` builds `xtask`, which links libdbus. See `check.yaml`.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install the toolchain
        # A pinned, checksum-verified binary rather than `curl https://mise.run | sh`.
        # That pipeline fetched an unpinned script over the network and ran it as
        # shell — in jobs that also hold the registry token and the signing identity,
        # which makes whoever controls that host a publisher of this project's
        # images. The version moves when Renovate proposes it, as a reviewable diff.
        env:
          MISE_VERSION: "v2026.10.19"
          MISE_SHA256: "3162760f40b6b5f706c60641e4ef5ee7322bc6c54f72fc26a7111b337aa18d9d"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64" \
            -o "$HOME/.local/bin/mise"
          echo "${MISE_SHA256}  $HOME/.local/bin/mise" | sha256sum -c -
          chmod +x "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Restore caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # `~/.rustup` alongside `~/.local/share/mise` — see check.yaml: they are
          # the two halves of one rust installation.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            ~/.local/share/mise
            target
            web/node_modules
          key: contract-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.lock', 'web/pnpm-lock.yaml') }}
          restore-keys: contract-${{ runner.os }}-

      - name: Install pinned tools
        # Not optional, and not a nicety: the `aqua:` backend resolves every version
        # through the GitHub API, which allows 60 requests an hour to an
        # UNAUTHENTICATED caller — counted per IP, and a GitHub-hosted runner shares
        # its egress with everyone else on that host. The first run of this pipeline
        # exhausted it and died on `cargo-tauri` with a 403 that reads like the
        # release was deleted. The token every workflow already has raises the limit
        # to 1000/hour for this repository and needs no scopes to read public
        # releases.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise install --yes

      - name: Install the JavaScript dependencies
        # `task recu` regenerates the TypeScript client with HeyApi, which lives in
        # web/. Without this the step would skip silently and the job would prove
        # nothing about the client it is here to check.
        run: mise exec -- pnpm -C web install --frozen-lockfile

      - name: Regenerate everything derived from the code
        run: mise exec -- task recu

      - name: Fail on drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated artefacts are out of date. Run \`task recu\` and commit the result."
            exit 1
          fi
