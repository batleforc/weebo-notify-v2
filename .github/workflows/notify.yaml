name: notify

# Dogfooding: this project tells its own weebo-notify instance how its CI went
# (design §3.2, §3.2bis, §5.3).
#
# It is the smallest complete demonstration of the federation model, which is why
# it is worth having beyond the notification itself: **no secret is configured
# here**. There is no API key in the repository, none in the forge's secret store,
# and nothing to rotate. The runner already holds an ID token saying which
# repository and which ref it is, and `notify token exchange` turns that into
# fifteen minutes of publish rights on one channel.
#
# ── The receiving instance trusts an ISSUER, and the issuer just changed ────────
#
# This is the one part of the forge move that is not contained in this repository.
# The token is minted by whichever forge runs the job, and §5.3 matches it against a
# trust policy on the *server*. Moving the workflow here without updating that
# policy produces a 401, correctly and unhelpfully.
#
# Both are listed so the transition does not have a gap — Forgejo keeps working
# while it still runs anything, and GitHub starts working the moment this lands (§11):
#
#     # GitHub — the primary forge as of this change
#     [[trust_policy]]
#     issuer   = "https://token.actions.githubusercontent.com"
#     subject  = "repo:batleforc/weebo-notify-v2:ref:refs/heads/main"
#     channels = ["ci-infra"]
#     scopes   = ["publish"]
#
#     # Forgejo — kept during the transition, removable once the mirror stops
#     # running anything that publishes
#     [[trust_policy]]
#     issuer   = "https://forgejo.weebo.poc"
#     subject  = "repo:weebo/weebo-notify:ref:refs/heads/main"
#     channels = ["ci-infra"]
#     scopes   = ["publish"]
#
# The `subject` is worth reading rather than pasting: a `workflow_run` job always
# runs in the context of the default branch, so the ref in the claim is
# `refs/heads/main` whatever branch triggered `check`. That is what makes a single
# subject sufficient here, and it is also why this policy grants nothing to a pull
# request from a fork.
#
# ── What this workflow has NOT been run against ────────────────────────────────
#
# Any real forge. It was written against the design's contract and the CLI it calls
# was exercised end to end against a live server (M4.7), but the two lines only a
# forge can answer — that `id-token: write` yields a token, and that its `aud` names
# weebo-notify — have not been observed. Both fail loudly rather than quietly if
# they are wrong: no token means an empty variable and a failed step, and a wrong
# `aud` is exactly what §5.3 refuses with a 401. The first run here is the test.

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  # The whole mechanism. Without it the runner has no ID token to exchange, and
  # the step below fails rather than falling back to something longer-lived.
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # An instance that is not configured is the normal state of a fork, so the
    # whole job is skipped rather than failing somebody else's pipeline.
    # Fork PRs are skipped: their runs would otherwise publish under this
    # repository's OIDC identity.
    if: vars.WNK_URL != '' && github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No libdbus step here, unlike the workflows that build `--workspace`: this job
      # builds `notify-cli` and nothing else, and that crate reaches the session bus
      # through zbus — pure Rust, nothing to link. See `crates/notify-cli/Cargo.toml`.
      - name: Install the toolchain
        # A pinned, checksum-verified binary rather than `curl https://mise.run | sh`
        # — same reasoning as every other workflow in this directory.
        env:
          MISE_VERSION: "v2026.10.12"
          MISE_SHA256: "72404716768b5b044cbd5170136d3d795cbd592658b6e932b66f0f8d67a54875"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64" \
            -o "$HOME/.local/bin/mise"
          echo "${MISE_SHA256}  $HOME/.local/bin/mise" | sha256sum -c -
          chmod +x "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the client
        # `GITHUB_TOKEN` for the `mise install` below, not for anything this job
        # publishes: the `aqua:` backend resolves versions through the GitHub API,
        # and an unauthenticated runner gets 60 requests an hour shared by IP. See
        # `check.yaml` for the failure that put this line in every workflow.
        #
        # Note the two tokens in this file do entirely different jobs and neither can
        # stand in for the other: this one reads public releases, and the one the
        # next step mints is an OIDC identity assertion (§5.3).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise install
          mise exec -- cargo build --quiet --release -p notify-cli

      - name: Exchange the runner's identity for a short-lived token
        id: token
        env:
          WNK_URL: ${{ vars.WNK_URL }}
        run: |
          set -euo pipefail

          # The forge mints this on demand; `aud` has to name the receiving
          # instance, which is what stops a token minted for another service from
          # being replayed here (§5.3, scenario T11).
          id_token=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=weebo-notify" \
            | jq -r '.value')

          # Written to the step output rather than echoed: it is a credential for
          # the next fifteen minutes, and a `set -x` left on by somebody debugging
          # would otherwise put it in the log.
          echo "::add-mask::$id_token"
          minted=$(WNK_CI_TOKEN="$id_token" \
            ./target/release/notify token exchange)
          echo "::add-mask::$minted"
          echo "token=$minted" >> "$GITHUB_OUTPUT"

      - name: Say how it went
        # Under workflow_run, github.sha/ref_name/run_id describe *this* run on the
        # default branch; the checked run's own values live on the event. Passed
        # through env so a branch name can never be spliced into the script.
        env:
          WNK_URL: ${{ vars.WNK_URL }}
          WNK_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `update` and not `publish`, keyed on the run id: the same call creates
          # on the first invocation and revises on a re-run, so a retried pipeline
          # amends its own notification instead of opening a second one (§2.2).
          status=failure
          [ "$CONCLUSION" = success ] && status=success
          ./target/release/notify update \
            --channel ci-infra \
            --id "run-$RUN_ID" \
            --title "$REPO · $HEAD_BRANCH" \
            --body "check: $CONCLUSION — $HEAD_SHA" \
            --state closed \
            --status "$status" \
            --action "view:Voir le run:$RUN_URL"
