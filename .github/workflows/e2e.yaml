name: e2e

# Adapter conformance against real dependencies: every query, every LISTEN/NOTIFY
# poke and every cursor replayed against a real Postgres rather than against the
# in-memory doubles. The identity provider is in-process — it is a crate in this
# workspace (ADR-0014), so there is no image to pull and no registry that can be
# down when the suite runs.
#
# The database is a service container, not testcontainers: these are conformance
# suites, and giving each of them its own container would spend more time starting
# Postgres than testing it. Nothing here drives a container engine, which is why
# this job asks for no socket and no privileges.
#
# Includes the `critical` suite (design §3.4) — blocking, never skipped, and growing
# by one regression scenario with every bug fix.
#
# Heavier than `check`, so it runs on pull requests targeting main rather than on
# every push to a topic branch.
#
# ── The one thing that changed in the move from Forgejo ────────────────────────
#
# On Forgejo the job ran *inside* a container, so it shared a network with the
# service and reached it as `postgres:5432`. Here the job runs directly on the
# runner, where a service container is only reachable through a published port on
# localhost. Hence the `ports:` mapping below and `@localhost:5432` in the URL —
# keeping the old hostname would have failed to resolve, which is at least loud.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"
  # Named once rather than repeated per step: two steps used the same connection
  # string, and a hostname that has just changed is exactly the kind of thing that
  # gets updated in one place and not the other.
  WNK_TEST_DATABASE_URL: postgres://weebo:weebo@localhost:5432/weebo_notify

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      # The persistence and event-bus suites talk to a plain database rather than a
      # testcontainer: they are adapter conformance tests, and giving each of them
      # its own container would spend more time starting Postgres than testing it.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: weebo
          POSTGRES_PASSWORD: weebo
          POSTGRES_DB: weebo_notify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weebo -d weebo_notify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install libdbus headers
        # Workspace members link libdbus — see `check.yaml`.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install the toolchain
        # A pinned, checksum-verified binary rather than `curl https://mise.run | sh`.
        # That pipeline fetched an unpinned script over the network and ran it as
        # shell — in jobs that also hold the registry token and the signing identity,
        # which makes whoever controls that host a publisher of this project's
        # images. The version moves when Renovate proposes it, as a reviewable diff.
        env:
          MISE_VERSION: "v2026.8.3"
          MISE_SHA256: "66585ac496c10bf6fbf13272e3e550c1813aed0e1cb780b9bb73c1751de49289"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64" \
            -o "$HOME/.local/bin/mise"
          echo "${MISE_SHA256}  $HOME/.local/bin/mise" | sha256sum -c -
          chmod +x "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Restore caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # `~/.rustup` alongside `~/.local/share/mise` — see check.yaml: they are
          # the two halves of one rust installation.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            ~/.local/share/mise
            target
          key: e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.lock') }}
          restore-keys: e2e-${{ runner.os }}-

      - name: Install pinned tools
        # Not optional, and not a nicety: the `aqua:` backend resolves every version
        # through the GitHub API, which allows 60 requests an hour to an
        # UNAUTHENTICATED caller — counted per IP, and a GitHub-hosted runner shares
        # its egress with everyone else on that host. The first run of this pipeline
        # exhausted it and died on `cargo-tauri` with a 403 that reads like the
        # release was deleted. The token every workflow already has raises the limit
        # to 1000/hour for this repository and needs no scopes to read public
        # releases.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise install --yes

      - name: Critical suite
        # Runs first and separately: if a critical scenario is broken, that is the
        # headline, not something to find inside a long log.
        run: mise exec -- task test:critical

      - name: End-to-end suite
        run: mise exec -- task test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results
          path: target/nextest/**/junit*.xml
          retention-days: 14
