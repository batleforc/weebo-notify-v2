name: secret-scan

# gitleaks over the full history, daily as well as on every push: a secret committed
# and later removed is still a finding, and the repository is public since 2026-10-25.
# The pre-commit hook only sees staged files; this is the gate that sees everything.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Same version as mise.lock, so `gitleaks git .` locally reproduces this gate.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The upstream binary, checksum-verified: gitleaks-action needs a licence secret
      # for organisation-owned repositories, the scanner itself does not.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      # `--redact`: the log is public. Reads .gitleaks.toml (dev/ fixtures allowlisted).
      - name: gitleaks
        run: gitleaks git . --redact --verbose
