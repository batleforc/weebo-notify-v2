name: publish-main

# Continuous images from `main`, one per commit — not the tagged release.
#
# The tagged pipeline (.forgejo/workflows/release.yaml, self-hosted Forgejo) stays
# the one that matters: multi-arch, trivy-scanned, cosign-signed, and the source of
# `:latest`. This one is GitHub-hosted and amd64-only on purpose — its only job is
# giving `:main` something to pull between releases, not replacing the release.
#
# Gated the same way release.yaml gates a tag: lint and the critical suite have to
# pass before anything is pushed, so a broken `main` never produces an image.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-main-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/batleforc/weebo-notify

permissions:
  contents: read
  packages: write

jobs:
  gate:
    name: Lint and critical suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Lint
        run: task lint:check

      - name: Critical suite
        run: task test:critical

  publish:
    name: Build and push images
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}

      - name: Build and push the web image
        # No build args since ADR-0021: one image now serves every deployment, and
        # the API origin, the issuer and the client id are read at container boot
        # instead (web/nginx/docker-entrypoint.d/05-runtime-config.sh) — same image
        # this workflow pushes here works for any origin an operator starts it with.
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-web:main
            ${{ env.IMAGE_NAME }}-web:sha-${{ steps.sha.outputs.short }}
