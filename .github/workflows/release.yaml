name: release

# Pushing the tag is the only human action (design §3.2bis).
#
# `task release` runs `cog bump --auto`: the version comes from the conventional
# commits, the changelog is generated, and every version in the product is
# synchronised. Pushing the resulting tag triggers everything below with no further
# intervention.
#
# Two invariants:
#   * A tag NEVER moves. A failed release means a fix and a new tag, never a re-tag.
#   * Every job is idempotent. Re-running a failed run resumes without duplicating
#     or corrupting what was already published.
#
# GATES: a tag never exempts anything from what a pull request had to pass, so
# the publish job needs every gate below green ON THE TAGGED COMMIT — not on the
# pull request that merged it, whose base may since have moved. `gate` is the
# fast replay (lint, contract, critical suite against a real Postgres); `check`,
# `e2e`, `audit` and `oidc-compat` are the very workflows a pull request runs,
# called here through `workflow_call` so there is one definition of each.
# `check` carries `helm:check`.
#
# ORDER: nothing gets a public tag before it is scanned. Images are pushed BY
# DIGEST ONLY (untagged, reachable by nobody who was not handed the digest),
# scanned, signed, given an SBOM attestation, and only then tagged `vX.Y.Z` —
# and `latest`. A failed scan leaves an orphan digest in the registry and no tag.
#
# SCOPE: this file implements the gate, both images, the Helm chart (OCI, signed),
# their signatures and the release object. The full artefact matrix — desktop packages, CLI archives, the
# signed updater manifest, the Android APK — lands with milestone M5, when there is
# something to package. Until then a release carries the two images, their digests
# and their SBOMs, which is the set a deployment actually consumes.
#
# SIGNING: three systems, because three different verifiers exist and none of them
# reads the others' output. They are not alternatives and no key is shared between
# them (§3.2bis lists each as its own custody problem):
#
#   * cosign, keyless — images (`cosign sign`) and every published file
#     (`cosign sign-blob`). No key exists: the identity is this workflow, attested
#     by Fulcio and logged in Rekor. This is *provenance*, and it is the only one
#     of the three that covers everything.
#   * The Android keystore — `apksigner`, an X.509 key in a PKCS#12 store. Android
#     refuses to install an APK without it, and the key IS the app's identity, so it
#     effectively cannot be rotated. Not in this file yet; `task android:sign` is
#     where it is applied, and the release key belongs in a secret scoped here.
#   * minisign (Ed25519) — the Tauri updater (§837), whose verifier is in the app
#     and understands minisign and nothing else.
#
# The temptation to unify them is worth naming, since it will come up again: the
# closest possible is sharing one key between cosign and `apksigner`, which would
# bind the most rotatable secret in the project to the least rotatable one and
# replace a keyless setup that has no key to leak. Deliberately not done.
#
# FORGE: this moved from `.forgejo/workflows/` when GitHub became primary. Three
# things got simpler and are worth knowing when reading against the old file:
# the job runs on `ubuntu-latest` with a working Docker rather than inside
# `act-24.04` with the socket mounted; `gh` no longer needs `GH_HOST`/`GH_REPO`
# set, because it is now talking to the forge it was built for; and the keyless
# signing identity below is a github.com identity, which is what
# `--certificate-identity-regexp` already expected.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # Where the images go. A variable rather than a literal because the mirror
  # arrangement of §3.2 means this repository lives in two forges, and whoever
  # deploys it may publish to neither of them.
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/batleforc/weebo-notify-v2
  # The Helm chart, as an OCI artifact beside the images (`helm install
  # oci://ghcr.io/batleforc/weebo-notify-v2/charts/weebo-notify --version X.Y.Z`).
  CHART_REPO: oci://ghcr.io/batleforc/weebo-notify-v2/charts

# Least privilege; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  # The pull-request workflows, replayed on the tag (see GATES above).
  check:
    uses: ./.github/workflows/check.yaml
  e2e:
    uses: ./.github/workflows/e2e.yaml
  audit:
    uses: ./.github/workflows/audit.yaml
  oidc-compat:
    uses: ./.github/workflows/oidc-compat.yaml

  gate:
    # A tag never exempts anything from the gates a pull request had to pass.
    name: Replay the pull-request gates
    runs-on: ubuntu-latest

    # The critical suite includes Postgres-backed scenarios (T24 and the
    # conformance cases tagged `critical`). Without a database they used to SKIP
    # here, so this gate went green having run none of them. With the service and
    # WNK_TEST_REQUIRE_DB they run, and a missing database fails them.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: weebo
          POSTGRES_PASSWORD: weebo
          POSTGRES_DB: weebo_notify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weebo -d weebo_notify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WNK_TEST_DATABASE_URL: postgres://weebo:weebo@localhost:5432/weebo_notify
      WNK_TEST_REQUIRE_DB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libdbus headers
        # `task recu` builds `xtask`, which links libdbus for the D19 stub daemon,
        # and `task test:critical` builds the workspace that contains it. See
        # `check.yaml`. Not for `notify-cli` — that one is pure Rust (zbus), which is
        # what lets `Containerfile` build it on a base image with no pkg-config.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install the toolchain
        # A pinned, checksum-verified binary rather than `curl https://mise.run | sh`.
        # That pipeline fetched an unpinned script over the network and ran it as
        # shell — in jobs that also hold the registry token and the signing identity,
        # which makes whoever controls that host a publisher of this project's
        # images. The version moves when Renovate proposes it, as a reviewable diff.
        env:
          MISE_VERSION: "v2026.10.19"
          MISE_SHA256: "3162760f40b6b5f706c60641e4ef5ee7322bc6c54f72fc26a7111b337aa18d9d"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64" \
            -o "$HOME/.local/bin/mise"
          echo "${MISE_SHA256}  $HOME/.local/bin/mise" | sha256sum -c -
          chmod +x "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install pinned tools
        # Not optional, and not a nicety: the `aqua:` backend resolves every version
        # through the GitHub API, which allows 60 requests an hour to an
        # UNAUTHENTICATED caller — counted per IP, and a GitHub-hosted runner shares
        # its egress with everyone else on that host. The first run of this pipeline
        # exhausted it and died on `cargo-tauri` with a 403 that reads like the
        # release was deleted. The token every workflow already has raises the limit
        # to 1000/hour for this repository and needs no scopes to read public
        # releases.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise install --yes

      - name: Lint
        run: mise exec -- task lint:check

      - name: Contract
        run: |
          mise exec -- task recu
          git diff --exit-code

      - name: Critical suite
        run: mise exec -- task test:critical

  publish:
    name: Build and publish
    needs: [gate, check, e2e, audit, oidc-compat]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # What cosign keyless signs with (§3.2bis). Without it the signing step fails
      # with an OIDC error that reads like a registry problem — the same trap §5.3
      # documents for the other direction of this token.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine the release kind
        id: kind
        # A SemVer pre-release tag (v1.2.3-rc.1) gets the same pipeline, the same
        # artefacts and the same signatures — an RC is a complete product, which is
        # what makes promoting it possible without re-validating. It is marked as a
        # pre-release and `latest` does not move.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the toolchain
        # The `gate` job installs it too, and this is not duplication to factor out:
        # jobs do not share a filesystem, and the scan step below runs `task`.
        # A pinned, checksum-verified binary rather than `curl https://mise.run | sh`.
        # That pipeline fetched an unpinned script over the network and ran it as
        # shell — in jobs that also hold the registry token and the signing identity,
        # which makes whoever controls that host a publisher of this project's
        # images. The version moves when Renovate proposes it, as a reviewable diff.
        env:
          MISE_VERSION: "v2026.10.19"
          MISE_SHA256: "3162760f40b6b5f706c60641e4ef5ee7322bc6c54f72fc26a7111b337aa18d9d"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64" \
            -o "$HOME/.local/bin/mise"
          echo "${MISE_SHA256}  $HOME/.local/bin/mise" | sha256sum -c -
          chmod +x "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install pinned tools
        # Not optional, and not a nicety: the `aqua:` backend resolves every version
        # through the GitHub API, which allows 60 requests an hour to an
        # UNAUTHENTICATED caller — counted per IP, and a GitHub-hosted runner shares
        # its egress with everyone else on that host. The first run of this pipeline
        # exhausted it and died on `cargo-tauri` with a 403 that reads like the
        # release was deleted. The token every workflow already has raises the limit
        # to 1000/hour for this repository and needs no scopes to read public
        # releases.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise install --yes

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Set up buildx
        # Needed for the multi-arch build below: the stock builder emits one
        # architecture, and §3.2bis asks for amd64 and arm64 from the same tag.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up QEMU
        # Only for the web image's arm64 runtime stage (`RUN apk upgrade`): both
        # builders run on $BUILDPLATFORM and the server cross-compiles, so no code is
        # compiled under emulation. This goes once that shortcut leaves web/Containerfile.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Log in to the registry
        # The job's own short-lived GITHUB_TOKEN (`packages: write` above), as publish-main
        # uses: no long-lived secret to store or rotate. The cost is the separation §10 A3
        # wanted: this job can now push images and edit the release with one credential,
        # both scoped to this repository and gone when the job ends. Decided 2026-10-25.
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the server image
        # THIS HAS NEVER RUN. The Containerfile it builds was written in a workspace
        # with no container engine (§12.4), so the first execution of this step is
        # its first test — the same state D7 and D12 are open for, and named here
        # rather than discovered by whoever pushes the first tag.
        id: server_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          # Read-only: a cache written from a tag ref is never readable by a later
          # run, so releases reuse `publish-main`'s cache from the default branch.
          cache-from: type=gha,scope=server
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          # By digest only — no tag at all. Neither `vX.Y.Z` nor `:latest` exists
          # until the scan and the signature below pass ("Tag the images"), so a
          # vulnerable build never becomes something a tag pulls.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push the web image
        # No build args since ADR-0021 superseded ADR-0019: one image now serves
        # every deployment, and the API origin, the issuer and the client id are
        # read at container boot instead (`web/nginx/docker-entrypoint.d/`).
        id: web_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          file: ./web/Containerfile
          cache-from: type=gha,scope=web
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE_NAME }}-web,push-by-digest=true,name-canonical=true,push=true

      - name: Scan the pushed digests
        # The digest, not a tag: what is scanned is byte-for-byte what gets
        # signed and tagged below. Before any tag exists, so a finding here leaves
        # nothing pullable by name. trivy picks the runner's platform (amd64) out
        # of the index; arm64 shares every package list but the architecture.
        env:
          SERVER_DIGEST: ${{ steps.server_image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web_image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$SERVER_DIGEST" && test -n "$WEB_DIGEST"
          mise exec -- task audit:image \
            SERVER_REF="${{ env.IMAGE_NAME }}@${SERVER_DIGEST}" \
            WEB_REF="${{ env.IMAGE_NAME }}-web@${WEB_DIGEST}"

      - name: Sign the images
        # cosign keyless: the identity is the workflow itself, and the signature
        # lands in Rekor (§3.2bis). No private key to keep, which is the only key
        # custody story that cannot leak — §15 lists the ones that can.
        #
        # BY DIGEST, NOT BY TAG. `cosign sign repo:v1.2.3` re-resolves the tag at
        # signing time, which is a second lookup of a mutable reference: what gets
        # signed is whatever the tag points at *now*, not necessarily what the step
        # above pushed. It also signs the wrong object for a multi-arch build — the
        # consumer that matters is an admission controller, and it verifies the
        # digest it is about to run. `build-push-action` reports that digest as an
        # output; using it closes the window and makes the signature refer to the
        # exact bytes.
        env:
          COSIGN_EXPERIMENTAL: "1"
          SERVER_DIGEST: ${{ steps.server_image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web_image.outputs.digest }}
        run: |
          set -euo pipefail
          # A build that somehow reported no digest must stop the release rather
          # than sign `image@` and produce a signature nothing can verify.
          test -n "$SERVER_DIGEST" && test -n "$WEB_DIGEST"
          cosign sign --yes "${{ env.IMAGE_NAME }}@${SERVER_DIGEST}"
          cosign sign --yes "${{ env.IMAGE_NAME }}-web@${WEB_DIGEST}"

      - name: Extract and attest the SBOMs
        # buildx `sbom: true` stores the SBOM as an in-toto attestation inside the
        # image index — which `cosign download sbom` (the legacy `.sbom` tag) never
        # finds, so this step used to publish nothing behind a `|| warning`. Read
        # it back with buildx itself, one SPDX document per platform, and FAIL if
        # one is missing: a release whose notes promise an SBOM must carry one.
        #
        # Then `cosign attest` each: the buildx attestation is unsigned, this one
        # is bound to this workflow's identity like the image signature.
        env:
          COSIGN_EXPERIMENTAL: "1"
          TAG: ${{ steps.kind.outputs.tag }}
          SERVER_DIGEST: ${{ steps.server_image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web_image.outputs.digest }}
        run: |
          set -euo pipefail
          extract() { # <image@digest> <asset-prefix>
            docker buildx imagetools inspect "$1" --format '{{ json .SBOM }}' > "$2.sbom.json"
            for platform in linux/amd64 linux/arm64; do
              out="$2-${platform#linux/}.spdx.json"
              jq -e --arg p "$platform" '.[$p].SPDX' "$2.sbom.json" > "$out" \
                || { echo "::error::no SPDX SBOM for $platform in $1"; exit 1; }
              cosign attest --yes --type spdxjson --predicate "$out" "$1"
            done
          }
          extract "${{ env.IMAGE_NAME }}@${SERVER_DIGEST}" "weebo-notify-${TAG}-server"
          extract "${{ env.IMAGE_NAME }}-web@${WEB_DIGEST}" "weebo-notify-${TAG}-web"

      - name: Tag the images
        # Scanned, signed and attested by now; `imagetools create` points the
        # public tags at the exact digests above without rebuilding or re-pulling
        # anything. `latest` moves for a final release only.
        env:
          TAG: ${{ steps.kind.outputs.tag }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
          SERVER_DIGEST: ${{ steps.server_image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web_image.outputs.digest }}
        run: |
          set -euo pipefail
          for suffix in "$TAG" $([ "$PRERELEASE" = false ] && echo latest); do
            docker buildx imagetools create -t "${{ env.IMAGE_NAME }}:${suffix}" "${{ env.IMAGE_NAME }}@${SERVER_DIGEST}"
            docker buildx imagetools create -t "${{ env.IMAGE_NAME }}-web:${suffix}" "${{ env.IMAGE_NAME }}-web@${WEB_DIGEST}"
          done

      - name: Package, push and sign the Helm chart
        # Same version as everything else (sync-version.sh writes Chart.yaml at
        # bump time) — checked rather than assumed, because a chart whose version
        # disagrees with the tag would deploy images of another release.
        # Signed by digest for the same reason the images are.
        id: chart
        env:
          COSIGN_EXPERIMENTAL: "1"
          TAG: ${{ steps.kind.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          chart_version="$(grep '^version:' charts/weebo-notify/Chart.yaml | awk '{print $2}')"
          [ "$chart_version" = "$version" ] || {
            echo "::error::Chart.yaml version $chart_version does not match tag $TAG"; exit 1; }
          mise exec -- helm package charts/weebo-notify --destination target/helm
          echo "$REGISTRY_TOKEN" | mise exec -- helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          mise exec -- helm push "target/helm/weebo-notify-${version}.tgz" "${{ env.CHART_REPO }}" 2>&1 | tee helm-push.log
          digest="$(grep -o 'sha256:[0-9a-f]\{64\}' helm-push.log | head -1)"
          test -n "$digest"
          cosign sign --yes "${CHART_REPO#oci://}/weebo-notify@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        # Created as a draft, filled with artefacts and the changelog notes, then
        # published in one move — never a half-empty release visible to anyone.
        #
        # The digests are the point of the body rather than decoration: they are what
        # `cosign verify` above signed, and the only way somebody pulling `:0.1.0`
        # six months from now can check that the tag still resolves to the artefact
        # this run produced. `--verify-tag` refuses to publish against a tag that is
        # not the one this workflow was triggered by.
        #
        # NOT VERIFIED: this step has never run. What the move to GitHub removed is
        # the part that was most likely to break — `gh` is talking to github.com now,
        # so the explicit `GH_HOST`/`GH_REPO` targeting the Forgejo version needed,
        # and the `curl` fallback its comment described, are both gone.
        env:
          # The token the runner already has for this repository.
          # The same job token as the registry login above (see the note there).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.kind.outputs.tag }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
          SERVER_DIGEST: ${{ steps.server_image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web_image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail

          # cog wrote the changelog at bump time; this extracts the section for the
          # tag being released rather than shipping the whole file.
          notes="$(mise exec -- cog changelog --at "$TAG" 2>/dev/null || true)"
          if [ -z "$notes" ]; then
            echo "::warning::no changelog section for $TAG — publishing with digests only"
          fi

          {
            printf '%s\n\n' "$notes"
            printf '## Images\n\n'
            printf 'Verify before you run them:\n\n'
            printf '```\n'
            printf 'cosign verify %s@%s \\\n' "${{ env.IMAGE_NAME }}" "$SERVER_DIGEST"
            printf '  --certificate-identity-regexp "^https://github.com/batleforc/weebo-notify-v2/\\.github/workflows/release\\.yaml@refs/tags/v" \\\n'
            printf '  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n'
            printf '```\n\n'
            printf '| Image | Digest |\n| --- | --- |\n'
            printf '| `%s:%s` | `%s` |\n' "${{ env.IMAGE_NAME }}" "$TAG" "$SERVER_DIGEST"
            printf '| `%s-web:%s` | `%s` |\n' "${{ env.IMAGE_NAME }}" "$TAG" "$WEB_DIGEST"
            printf '| `%s/weebo-notify:%s` (Helm chart) | `%s` |\n' "${{ env.CHART_REPO }}" "${TAG#v}" "$CHART_DIGEST"
            printf '\nPin them in the chart with `image.server.digest` / `image.web.digest`.\n'
            printf '\n## Files\n\n'
            printf 'Every file below is published with a `.sigstore.json` bundle beside it\n'
            printf '(signature, certificate and transparency-log proof in one file),\n'
            printf 'signed by this workflow with no key involved. To check one (cosign v3+):\n\n'
            printf '```\n'
            printf 'cosign verify-blob <file> \\\n'
            printf '  --bundle <file>.sigstore.json \\\n'
            printf '  --certificate-identity-regexp "^https://github.com/batleforc/weebo-notify-v2/\\.github/workflows/release\\.yaml@refs/tags/v" \\\n'
            printf '  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n'
            printf '```\n'
          } > release-notes.md

          # Idempotent, because every job in this file has to be: a re-run of a
          # failed release edits the draft it already made rather than failing on a
          # release that exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md --draft=false \
              --prerelease="$PRERELEASE" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md \
              --prerelease="$PRERELEASE" --verify-tag --draft
            gh release edit "$TAG" --draft=false
          fi

          # Every downloadable asset gets what the images already get: a keyless
          # cosign signature, the certificate that proves which workflow made it, and
          # a Rekor transparency entry — all three in one Sigstore bundle, because
          # cosign v3 refuses `sign-blob` without `--bundle` (the detached
          # `--output-signature`/`--output-certificate` pair is the legacy format). Same identity, same verification command, so
          # "is this really yours?" has one answer for an image, an SBOM, a CLI
          # archive and an APK rather than four.
          #
          # A loop over a list rather than three copied blocks, because this list is
          # what grows when the artefact matrix lands (see SCOPE): adding a file here
          # signs and publishes it, and forgetting to sign it is not one of the
          # available mistakes.
          #
          # This does NOT replace the signatures those artefacts need to *function* —
          # an APK still has to be signed with the Android keystore or no device will
          # install it, and the updater bundles still need their minisign key. Those
          # are different questions with different verifiers; this one is provenance.
          # The SBOMs were extracted (and required) by "Extract and attest the
          # SBOMs" above — a missing one fails here rather than being skipped.
          for asset in weebo-notify-"${TAG}"-*.spdx.json; do
            test -s "$asset"
            cosign sign-blob --yes \
              --bundle "${asset}.sigstore.json" \
              "$asset"
            gh release upload "$TAG" "$asset" "${asset}.sigstore.json" --clobber
          done
