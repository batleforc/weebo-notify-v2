name: update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5
      - run: task update
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update
          commit-message: "chore(deps): update tooling"
          title: "chore(deps): update tooling"
          body: "Automated `task update`: `mise upgrade --bump` + `mise lock`."
          sign-commits: true
          signoff: true
          delete-branch: true
