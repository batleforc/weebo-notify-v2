# Test identities for oidc-server-mock (design §12.5).
#
# These MUST mirror dev/authentik/blueprints/weebo-notify.yaml: the E2E suite and
# any manual click-through have to behave identically whichever IdP is running,
# and the `oidc-compat` CI matrix replays the same auth suite against both (T29).
#
# The password is fixed and committed on purpose — these are throwaway accounts
# with no IdP privileges, and typing a known password is the whole point of a local
# environment. Dex is the exception (CI-only, generated passwords, §3.2).

- SubjectId: alice
  Username: alice
  Password: weebo-dev
  Claims:
    - Type: name
      Value: Alice Martin
      ValueType: string
    - Type: email
      Value: alice@weebo.local
      ValueType: string
    - Type: email_verified
      Value: "true"
      ValueType: boolean
    # Mapped to channel access by [[channels.managed.access]] oidc_group (§11).
    - Type: groups
      Value: infra-admins
      ValueType: string
    - Type: groups
      Value: platform-admins
      ValueType: string

- SubjectId: bob
  Username: bob
  Password: weebo-dev
  Claims:
    - Type: name
      Value: Bob Dupont
      ValueType: string
    - Type: email
      Value: bob@weebo.local
      ValueType: string
    - Type: email_verified
      Value: "true"
      ValueType: boolean
    - Type: groups
      Value: dev-team
      ValueType: string

# Deliberately group-less: exercises the "IdP emits no groups" degradation path
# (T29, the Dex case) — this user must reach only its individual oidc_sub/email
# bindings, never a default grant.
- SubjectId: carol
  Username: carol
  Password: weebo-dev
  Claims:
    - Type: name
      Value: Carol Nguyen
      ValueType: string
    - Type: email
      Value: carol@weebo.local
      ValueType: string
    - Type: email_verified
      Value: "true"
      ValueType: boolean
