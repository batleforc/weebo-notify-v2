# OIDC client for oidc-server-mock (design §12.5).
#
# Public client + Authorization Code + PKCE, exactly like the Authentik blueprint
# and exactly like production: the SPA holds the tokens, the server validates them
# against JWKS and keeps no session at all (§5.1).

- ClientId: weebo-notify
  Description: weebo-notify web, desktop and mobile clients
  # Public client: no secret to leak into a SPA or a mobile bundle.
  RequireClientSecret: false
  RequirePkce: true
  AllowedGrantTypes:
    - authorization_code
    - refresh_token
  AllowedScopes:
    - openid
    - profile
    - email
    - groups
    - offline_access
  RedirectUris:
    # Vite dev server and the server's own callback.
    - http://localhost:5173/auth/callback
    - http://localhost:8080/auth/callback
    # Tauri desktop, from M5: loopback (RFC 8252) is the primary path — a custom
    # scheme can be registered by any application, a loopback port cannot be
    # hijacked the same way (§10bis.2). The custom scheme stays as fallback.
    - http://127.0.0.1:1420/auth/callback
    - weebo-notify://oauth/callback
  PostLogoutRedirectUris:
    - http://localhost:5173/
    - http://localhost:8080/
  AllowOfflineAccess: true
  # Groups must land in the ACCESS token, not just the id token: the API authorises
  # on the access token alone (§5.1).
  AlwaysIncludeUserClaimsInIdToken: true
  IdentityTokenLifetime: 300
  AccessTokenLifetime: 900
