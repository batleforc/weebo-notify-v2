{{/*
Alerts on the families notify-server publishes (observability.mdx lists them),
scoped to this release's server Service — the `namespace`/`service` labels the
ServiceMonitor's discovery attaches. Each alert names its runbook section
(docs/content/docs/ops/runbooks.mdx).

Several families are reported by the LEADER only (sink_dlq_depth,
retention_backlog_rows, the job timestamps): a follower's series is absent or
frozen at its last term, so every rule aggregates with max() across replicas
rather than reading any single one.

Two signals come from outside the server, because it publishes no equivalent:
- HTTP 5xx — ingress-nginx's request counter for the server Ingress (toggle
  prometheusRule.http5xxFromIngressNginx). notify-server has no request
  counter of its own.
- Readiness — kube-state-metrics' kube_pod_status_ready. /readyz checks
  Postgres, so a flapping readiness is the DB-pool/connectivity alert: there is
  no pool-saturation gauge to alert on directly.
*/}}
{{- if .Values.prometheusRule.enabled }}
{{- $server := include "weebo-notify.componentFullname" (dict "ctx" . "component" "server") }}
{{- $sel := printf "namespace=%q,service=%q" .Release.Namespace $server }}
{{- $rules := .Values.prometheusRule }}
{{- $runbook := "https://github.com/batleforc/weebo-notify-v2/blob/main/docs/content/docs/ops/runbooks.mdx" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $server }}
  {{- if $rules.namespace }}
  namespace: {{ $rules.namespace }}
  {{- end }}
  labels:
    {{- include "weebo-notify.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
    {{- with $rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: weebo-notify.leader
      rules:
        # sink-drain is the leader's 5-second loop: when it stops moving, nobody
        # holds the lock — every leader-only job has stopped with it. `absent`
        # covers a fresh deployment where no replica has ever led.
        - alert: WeeboNotifyNoLeader
          expr: |
            (time() - max(background_job_last_success_timestamp_seconds{ {{- $sel }},task="sink-drain"}) > 120)
            or absent(background_job_last_success_timestamp_seconds{ {{- $sel }},task="sink-drain"})
          for: 5m
          labels:
            severity: critical
            {{- with $rules.additionalLabels }}{{ toYaml . | nindent 12 }}{{ end }}
          annotations:
            summary: No replica is running the leader-only background jobs
            runbook_url: {{ $runbook }}#leader-lock-lost-or-stuck
        - alert: WeeboNotifyBackgroundJobStale
          expr: |
            time() - max by (task) (background_job_last_success_timestamp_seconds{ {{- $sel }}}) > {{ $rules.jobStaleSeconds }}
          for: 5m
          labels:
            severity: warning
            {{- with $rules.additionalLabels }}{{ toYaml . | nindent 12 }}{{ end }}
          annotations:
            summary: "Background job {{`{{ $labels.task }}`}} has not completed a pass in {{ $rules.jobStaleSeconds }}s"
            runbook_url: {{ $runbook }}#leader-lock-lost-or-stuck
        - alert: WeeboNotifyBackgroundJobFailing
          expr: |
            sum by (task) (increase(background_job_failures_total{ {{- $sel }}}[15m])) > 3
          labels:
            severity: warning
            {{- with $rules.additionalLabels }}{{ toYaml . | nindent 12 }}{{ end }}
          annotations:
            summary: "Background job {{`{{ $labels.task }}`}} is failing repeatedly"
            runbook_url: {{ $runbook }}#leader-lock-lost-or-stuck
    - name: weebo-notify.delivery
      rules:
        - alert: WeeboNotifySinkDeadLetters
          expr: |
            max by (channel) (sink_dlq_depth{ {{- $sel }}}) > {{ $rules.dlqDepth }}
          for: 15m
          labels:
            severity: warning
            {{- with $rules.additionalLabels }}{{ toYaml . | nindent 12 }}{{ end }}
          annotations:
            summary: "Sink deliveries dead-lettered on channel {{`{{ $labels.channel }}`}}"
            runbook_url: {{ $runbook }}#sink-dead-letter-triage
        - alert: WeeboNotifySinkDeadLettersGrowing
          expr: |
            max by (channel) (deriv(sink_dlq_depth{ {{- $sel }}}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            {{- with $rules.additionalLabels }}{{ toYaml . | nindent 12 }}{{ end }}
          annotations:
            summary: "Dead letters on channel {{`{{ $labels.channel }}`}} have grown for 30 minutes"
            runbook_url: {{ $runbook }}#sink-dead-letter-triage
        - alert: WeeboNotifyPushFailureRatio
          expr: |
            sum by (transport) (rate(push_failures_total{ {{- $sel }}}[15m]))
              / sum by (transport) (rate(push_delivery_duration_seconds_count{ {{- $sel }}}[15m]))
              > {{ $rules.pushFailureRatio }}
          for: 15m
          labels:
            severity: warning
            {{- with $rules.additionalLabels }}{{ toYaml . | nindent 12 }}{{ end }}
          annotations:
            summary: "Over {{ mulf $rules.pushFailureRatio 100 }}% of {{`{{ $labels.transport }}`}} pushes fail"
            runbook_url: {{ $runbook }}#key-rotation
    - name: weebo-notify.retention
      rules:
        - alert: WeeboNotifyRetentionBacklog
          expr: |
            max by (kind) (retention_backlog_rows{ {{- $sel }}}) > {{ $rules.retentionBacklogRows | int }}
          for: 1h
          labels:
            severity: warning
            {{- with $rules.additionalLabels }}{{ toYaml . | nindent 12 }}{{ end }}
          annotations:
            summary: "{{`{{ $value }}`}} {{`{{ $labels.kind }}`}} rows past retention are waiting for the purge"
            runbook_url: {{ $runbook }}#retention-backlog
    - name: weebo-notify.availability
      rules:
        - alert: WeeboNotifyDown
          expr: |
            absent(up{ {{- $sel }}} == 1)
          for: 5m
          labels:
            severity: critical
            {{- with $rules.additionalLabels }}{{ toYaml . | nindent 12 }}{{ end }}
          annotations:
            summary: No server replica is being scraped successfully
            runbook_url: {{ $runbook }}#postgres-failover-and-pooler-breakage
        - alert: WeeboNotifyReadinessFlapping
          expr: |
            sum(changes(kube_pod_status_ready{namespace={{ .Release.Namespace | quote }},pod=~{{ printf "%s-.*" $server | quote }},condition="true"}[15m])) > 4
          labels:
            severity: warning
            {{- with $rules.additionalLabels }}{{ toYaml . | nindent 12 }}{{ end }}
          annotations:
            summary: Server replicas keep leaving and re-entering the Service — /readyz checks Postgres
            runbook_url: {{ $runbook }}#postgres-failover-and-pooler-breakage
        {{- if and $rules.http5xxFromIngressNginx .Values.server.ingress.enabled }}
        - alert: WeeboNotifyHttp5xx
          expr: |
            sum(rate(nginx_ingress_controller_requests{ingress={{ $server | quote }},status=~"5.."}[5m]))
              / sum(rate(nginx_ingress_controller_requests{ingress={{ $server | quote }}}[5m]))
              > 0.05
          for: 10m
          labels:
            severity: warning
            {{- with $rules.additionalLabels }}{{ toYaml . | nindent 12 }}{{ end }}
          annotations:
            summary: Over 5% of API requests through the ingress answer 5xx
            runbook_url: {{ $runbook }}#postgres-failover-and-pooler-breakage
        {{- end }}
{{- end }}
