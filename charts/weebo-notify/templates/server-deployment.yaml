{{/*
Credentials the config schema takes as plain strings (database.url, the S3/token
keys) travel as WNK_-prefixed env instead of through the ConfigMap —
the same env-override layer design §11 already guarantees for every key, used
here for the one thing a ConfigMap should never carry.
*/}}
{{- $fsBackend := eq .Values.server.attachments.kind "filesystem" }}
{{- $replicas := .Values.server.replicaCount }}
{{- if $fsBackend }}
{{/* ADR-0022's accepted debt: no cross-replica story for a local directory. */}}
{{- $replicas = 1 }}
{{- end }}
{{- $chartVolume := and $fsBackend (or .Values.server.attachments.persistence.enabled .Values.server.attachments.persistence.existingClaim) }}
{{- if and $fsBackend (not $chartVolume) }}
{{- $own := false }}
{{- range .Values.server.extraVolumes }}{{ if eq .name "attachments" }}{{ $own = true }}{{ end }}{{ end }}
{{- if not $own }}
{{- fail "server.attachments.kind=filesystem needs a volume: set server.attachments.persistence.enabled, persistence.existingClaim, or add a server.extraVolumes entry named \"attachments\"" }}
{{- end }}
{{- end }}
{{- $hpa := and .Values.server.autoscaling.enabled (not $fsBackend) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weebo-notify.componentFullname" (dict "ctx" . "component" "server") }}
  labels:
    {{- include "weebo-notify.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  {{- if not $hpa }}
  {{/* The HPA owns the count; rendering it here would reset it on every upgrade. */}}
  replicas: {{ $replicas }}
  {{- end }}
  {{- if $fsBackend }}
  strategy:
    # Recreate, not RollingUpdate: a filesystem-backed deployment is already
    # single-replica (above), and a rolling update of a replicas:1 Deployment
    # would otherwise briefly run two pods mounting the same ReadWriteOnce PVC.
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "weebo-notify.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weebo-notify.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 8 }}
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server-configmap.yaml") . | sha256sum }}
        {{- with .Values.server.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "weebo-notify.componentFullname" (dict "ctx" . "component" "server") }}
      securityContext:
        {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      # Outlives .shutdown_timeout(15) in notify-server's own drain (main.rs),
      # with room for a slow client's in-flight request or SSE stream to close.
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      {{- if not (eq .Values.server.podAntiAffinity "none") }}
      affinity:
        {{- include "weebo-notify.podAntiAffinity" (dict "ctx" . "component" "server" "mode" .Values.server.podAntiAffinity) | nindent 8 }}
      {{- end }}
      {{- with .Values.server.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "weebo-notify.serverImage" . }}
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          args: ["--config", "/etc/weebo-notify/config.toml"]
          securityContext:
            {{- toYaml .Values.server.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "weebo-notify.serverEnv" . | trim | nindent 12 }}
            {{- if .Values.migrations.job.enabled }}
            # The pre-install/pre-upgrade Job (server-migrate-job.yaml) already
            # applied them; a replica racing it for the migration lock would only
            # add a boot-time wait, never a schema.
            - name: WNK_DATABASE__MIGRATE_ON_START
              value: "false"
            {{- end }}
          {{- with .Values.server.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # `/healthz` answers as long as the process is up; `/readyz` gates
          # entry into the Service and is the one that must not restart a
          # replica just because Postgres is briefly unreachable (health.rs's
          # own reasoning for keeping the two separate).
          # Migrations and the boot reconcile (up to 60 s waiting on the lock)
          # run before the listener binds: give them time before liveness counts.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.server.startupProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/weebo-notify
              readOnly: true
            {{- include "weebo-notify.serverSecretMounts" . | trim | nindent 12 }}
            {{- if $fsBackend }}
            - name: attachments
              mountPath: {{ .Values.server.attachments.persistence.path }}
            {{- end }}
            {{- with .Values.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "weebo-notify.componentFullname" (dict "ctx" . "component" "server") }}
        {{- include "weebo-notify.serverSecretVolumes" . | trim | nindent 8 }}
        {{- if $chartVolume }}
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ .Values.server.attachments.persistence.existingClaim | default (include "weebo-notify.componentFullname" (dict "ctx" . "component" "server-attachments")) }}
        {{- end }}
        {{- with .Values.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
