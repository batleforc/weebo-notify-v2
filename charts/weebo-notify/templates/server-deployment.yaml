{{/*
Credentials the config schema takes as plain strings (database.url, the S3/token
keys, redis_url) travel as WNK_-prefixed env instead of through the ConfigMap —
the same env-override layer design §11 already guarantees for every key, used
here for the one thing a ConfigMap should never carry.
*/}}
{{- $fsBackend := eq .Values.server.attachments.kind "filesystem" }}
{{- $replicas := .Values.server.replicaCount }}
{{- if $fsBackend }}
{{/* ADR-0022's accepted debt: no cross-replica story for a local directory. */}}
{{- $replicas = 1 }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weebo-notify.componentFullname" (dict "ctx" . "component" "server") }}
  labels:
    {{- include "weebo-notify.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  {{- if $fsBackend }}
  strategy:
    # Recreate, not RollingUpdate: a filesystem-backed deployment is already
    # single-replica (above), and a rolling update of a replicas:1 Deployment
    # would otherwise briefly run two pods mounting the same ReadWriteOnce PVC.
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "weebo-notify.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weebo-notify.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 8 }}
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server-configmap.yaml") . | sha256sum }}
        {{- with .Values.server.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "weebo-notify.componentFullname" (dict "ctx" . "component" "server") }}
      securityContext:
        {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      # Outlives .shutdown_timeout(15) in notify-server's own drain (main.rs),
      # with room for a slow client's in-flight request or SSE stream to close.
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      {{- if not (eq .Values.server.podAntiAffinity "none") }}
      affinity:
        {{- include "weebo-notify.podAntiAffinity" (dict "ctx" . "component" "server" "mode" .Values.server.podAntiAffinity) | nindent 8 }}
      {{- end }}
      {{- with .Values.server.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "weebo-notify.serverImage" . }}
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          args: ["--config", "/etc/weebo-notify/config.toml"]
          securityContext:
            {{- toYaml .Values.server.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if .Values.server.database.existingSecret }}
            - name: WNK_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.database.existingSecret }}
                  key: {{ .Values.server.database.secretKey }}
            {{- end }}
            {{- if and (eq .Values.server.attachments.kind "s3") .Values.server.attachments.existingSecret }}
            - name: WNK_ATTACHMENTS__ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.attachments.existingSecret }}
                  key: {{ .Values.server.attachments.accessKeyKey }}
            - name: WNK_ATTACHMENTS__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.attachments.existingSecret }}
                  key: {{ .Values.server.attachments.secretKeyKey }}
            {{- end }}
            {{- if and $fsBackend .Values.server.attachments.existingSecret }}
            - name: WNK_ATTACHMENTS__TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.attachments.existingSecret }}
                  key: {{ .Values.server.attachments.tokenSecretKey }}
            {{- end }}
            {{- if and (eq .Values.server.eventbus.backend "redis") .Values.server.eventbus.redis.existingSecret }}
            - name: WNK_EVENTBUS__REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.eventbus.redis.existingSecret }}
                  key: {{ .Values.server.eventbus.redis.urlKey }}
            {{- end }}
            {{- if and .Values.server.sinks.smtp.enabled .Values.server.sinks.smtp.existingSecret }}
            - name: {{ .Values.server.sinks.smtp.passwordEnvName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.sinks.smtp.existingSecret }}
                  key: {{ .Values.server.sinks.smtp.passwordKey }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.server.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # `/healthz` answers as long as the process is up; `/readyz` gates
          # entry into the Service and is the one that must not restart a
          # replica just because Postgres is briefly unreachable (health.rs's
          # own reasoning for keeping the two separate).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/weebo-notify
              readOnly: true
            {{- if .Values.server.push.webpush.enabled }}
            - name: webpush-secret
              mountPath: /etc/weebo-notify/secrets/webpush
              readOnly: true
            {{- end }}
            {{- if .Values.server.push.apns.enabled }}
            - name: apns-secret
              mountPath: /etc/weebo-notify/secrets/apns
              readOnly: true
            {{- end }}
            {{- if .Values.server.federation.enabled }}
            - name: federation-secret
              mountPath: /etc/weebo-notify/secrets/federation
              readOnly: true
            {{- end }}
            {{- if $fsBackend }}
            - name: attachments
              mountPath: {{ .Values.server.attachments.persistence.path }}
            {{- end }}
            {{- with .Values.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "weebo-notify.componentFullname" (dict "ctx" . "component" "server") }}
        {{- if .Values.server.push.webpush.enabled }}
        - name: webpush-secret
          secret:
            secretName: {{ required "server.push.webpush.existingSecret is required when server.push.webpush.enabled" .Values.server.push.webpush.existingSecret }}
        {{- end }}
        {{- if .Values.server.push.apns.enabled }}
        - name: apns-secret
          secret:
            secretName: {{ required "server.push.apns.existingSecret is required when server.push.apns.enabled" .Values.server.push.apns.existingSecret }}
        {{- end }}
        {{- if .Values.server.federation.enabled }}
        - name: federation-secret
          secret:
            secretName: {{ required "server.federation.existingSecret is required when server.federation.enabled" .Values.server.federation.existingSecret }}
        {{- end }}
        {{- if $fsBackend }}
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ .Values.server.attachments.persistence.existingClaim | default (include "weebo-notify.componentFullname" (dict "ctx" . "component" "server-attachments")) }}
        {{- end }}
        {{- with .Values.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
