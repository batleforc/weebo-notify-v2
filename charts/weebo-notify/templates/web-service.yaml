apiVersion: v1
kind: Service
metadata:
  name: {{ include "weebo-notify.componentFullname" (dict "ctx" . "component" "web") }}
  labels:
    {{- include "weebo-notify.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "weebo-notify.componentSelectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
