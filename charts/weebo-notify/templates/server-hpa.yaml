{{- /* Skipped for a filesystem-backed deployment for the same reason as the PDB
   above: replicas is pinned to 1 there, and an HPA fighting that pin would only
   flap. */}}
{{- if and .Values.server.autoscaling.enabled (ne .Values.server.attachments.kind "filesystem") }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "weebo-notify.componentFullname" (dict "ctx" . "component" "server") }}
  labels:
    {{- include "weebo-notify.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "weebo-notify.componentFullname" (dict "ctx" . "component" "server") }}
  minReplicas: {{ .Values.server.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.server.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.server.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.server.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.server.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.server.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- with .Values.server.autoscaling.customMetrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.server.autoscaling.behavior }}
  # Scaling *down* is the direction that costs something here: every replica
  # removed drops its SSE and WebSocket connections, and every one of those
  # clients reconnects and replays from its cursor. Correct, but not free — so
  # the default stabilisation window is deliberately long, and scale-up is left
  # responsive.
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
