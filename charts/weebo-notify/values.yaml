## weebo-notify default values: two Deployments (`server` API, `web` nginx bundle; ADR-0021).
## Credentials are `existingSecret` references only; Postgres, S3 and the OIDC issuer are external.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

image:
  server:
    repository: ghcr.io/batleforc/weebo-notify-v2
    # Defaults to "v" + .Chart.AppVersion when empty — release.yaml tags images
    # with the git tag, which carries cog's `v` prefix.
    tag: ""
    # `sha256:...` — pins the image by digest and overrides `tag`. The digests of
    # a release are in its GitHub release notes, next to the cosign command that
    # verifies them.
    digest: ""
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/batleforc/weebo-notify-v2-web
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

# ─────────────────────────────────────────────────────────────────────────────
# server — notify-server: API, SSE/WS, GitOps reconciler, leader-only jobs (§13).
# ─────────────────────────────────────────────────────────────────────────────
server:
  replicaCount: 2

  # Leader election is postgres-only today, so there is no Lease RBAC.

  service:
    type: ClusterIP
    port: 8080

  # Browser origins allowed to call the API (§5.1); empty means `https://<web.ingress.host>` when enabled.
  corsOrigins: []

  # Scrapes `/metrics` on the API port 8080 (no separate listener), never via the public Ingress.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    namespace: ""
    labels: {}

  ingress:
    enabled: false
    className: ""
    # Only `/api/v1` is routed. A separate host from the web one: the CSP names the API origin
    # (ADR-0021), and path splits trip ingress SSE/WebSocket buffering.
    host: api.notify.example.com
    annotations: {}
    tls: []

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    # targetMemoryUtilizationPercentage: 80
    # Extra HPA metrics, appended verbatim. Needs a custom-metrics adapter (Prometheus Adapter, KEDA);
    # `realtime_connections` is a better signal than CPU for idle long-lived streams:
    #
    #   customMetrics:
    #     - type: Pods
    #       pods:
    #         metric:
    #           name: realtime_connections
    #         target:
    #           type: AverageValue
    #           averageValue: "500"
    customMetrics: []

    # HPA behaviour, verbatim. Scale-down is slowed: removing a replica drops and replays its streams.
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 120

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Soft node anti-affinity by default, so single-node clusters still schedule two replicas.
  topologySpreadConstraints: []
  podAntiAffinity: soft # soft | hard | none

  # Must outlive the server's 15 s drain of in-flight requests and streams.
  terminationGracePeriodSeconds: 30

  # Merged under the startup probe's httpGet (server-deployment.yaml). Raise
  # failureThreshold if boot-time migrations (migrations.job.enabled: false)
  # can outlast 5 minutes on your data.
  startupProbe:
    periodSeconds: 5
    failureThreshold: 60

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  # distroless nonroot uid:gid, asserted rather than assumed.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

  # ── Secrets — every field an existingSecret reference, never a value ────────
  # DSN and S3 credentials go in as WNK_* env from a Secret; key files are mounted from Secret volumes.
  database:
    # Secret key holding the `postgres://…` DSN, exposed as WNK_DATABASE__URL.
    existingSecret: ""
    secretKey: database-url

  attachments:
    # `s3` (any S3-compatible bucket, ADR-0002) or `filesystem` (ADR-0022: single-node only, so the
    # chart forces one replica and no PDB).
    kind: s3

    # --- kind: s3 ---
    endpoint: ""
    bucket: ""
    region: us-east-1
    existingSecret: ""
    accessKeyKey: access-key
    secretKeyKey: secret-key

    # --- kind: filesystem ---
    # This server's external origin (filesystem presigns against itself); defaults to
    # `https://<server.ingress.host>` when enabled.
    publicBaseUrl: ""
    # Secret key signing the presigned URLs (WNK_ATTACHMENTS__TOKEN_SECRET); at least 32 bytes, or the server refuses to start.
    tokenSecretKey: token-secret
    persistence:
      # A chart-owned PVC (enabled), an existingClaim, or a `server.extraVolumes` entry named `attachments`.
      enabled: false
      path: /var/lib/weebo-notify/attachments
      storageClassName: ""
      size: 10Gi
      accessMode: ReadWriteOnce
      existingClaim: ""

  eventbus:
    # `postgres` (LISTEN/NOTIFY, ADR-0008); `redis` has no adapter yet and is refused.
    backend: postgres

  oidc:
    issuer: ""
    clientId: weebo-notify
    audiences: []
    groupsClaim: groups

  admin:
    # Platform-admin OIDC groups; GitOps-only, no API can grant it (§5.4).
    oidcGroups: []

  retention:
    defaultTtl: 7d
    maxTtl: 90d
    allowForever: false

  push:
    webpush:
      enabled: false
      existingSecret: ""
      # Key inside existingSecret holding the P-256 VAPID private key (PEM).
      keyName: vapid.pem
      contact: ""
    # Server-side only; the native apps that would use it don't exist yet.
    apns:
      enabled: false
      existingSecret: ""
      keyName: apns.p8
      keyId: ""
      teamId: ""
      topic: ""
      sandbox: false
    unifiedpush:
      enabled: false

  federation:
    # CI token exchange (§5.3); not yet exercised against a real forge.
    enabled: false
    existingSecret: ""
    keyName: federation.pem
    audience: ""

  sinks:
    # The HMAC key webhook sink ids are fingerprinted under ([sinks]
    # fingerprint_key, at least 32 bytes — `openssl rand -base64 48`). Required
    # as soon as `extraConfig` declares a webhook sink: the server and the
    # migrate Job both refuse to start without it. Injected as
    # WNK_SINKS__FINGERPRINT_KEY. Rotating it re-ids every webhook; see the
    # runbook (docs/ops/runbooks) before changing it.
    fingerprintKey:
      existingSecret: ""
      secretKey: sink-fingerprint-key
    smtp:
      enabled: false
      url: ""
      from: ""
      username: ""
      # Env var named by `password_ref`, injected from `existingSecret`/`passwordKey`.
      passwordEnvName: WNK_SMTP_PASSWORD
      existingSecret: ""
      passwordKey: smtp-password
      permalinkBase: ""

  cli:
    # Serve the bundled `notify` binary at `GET /api/v1/cli` (§9).
    enabled: false

  telemetry:
    enabled: false
    otlpEndpoint: ""
    serviceName: weebo-notify
    sampleRatio: 1.0

  # Extra config.toml (channels, service accounts, trust policies; §11), rendered with `tpl`.
  extraConfig: |
    # [[channels.managed]]
    # id = "cluster-ovh-1"
    # name = "Cluster OVH 1 — incidents"
    # default_ttl = "30d"
    # receipts = true
    #
    #   [[channels.managed.access]]
    #   oidc_group = "infra-admins"
    #   scopes = ["publish", "subscribe", "manage"]

  channels:
    onRemoved: archive # archive | delete
    reload: sighup

# ─────────────────────────────────────────────────────────────────────────────
# web — notify-web: the nginx bundle, config rendered at container boot (ADR-0021).
# ─────────────────────────────────────────────────────────────────────────────
web:
  replicaCount: 2

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: ""
    host: notify.example.com
    annotations: {}
    tls: []

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  podAntiAffinity: soft
  terminationGracePeriodSeconds: 15

  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi

  # nginx-unprivileged's uid (the Containerfile's `USER 101`).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  # Rendered into `/env.js` at boot (ADR-0021): bare origins, no path, no trailing slash.
  env:
    # The server Ingress origin, e.g. https://api.notify.example.com (not a same-host path).
    apiBaseUrl: ""
    oidcIssuer: ""
    oidcClientId: weebo-notify
    # Defaults to same-origin `/csp-report` when empty.
    cspReportUrl: ""
    # Only for attachments served from a third origin the CSP must name.
    attachmentOrigin: ""

# ─────────────────────────────────────────────────────────────────────────────
# migrations — a Helm pre-install/pre-upgrade hook Job running
# `notify-server migrate` (templates/server-migrate-job.yaml).
# ─────────────────────────────────────────────────────────────────────────────
# With it, the schema is migrated once, before any new pod starts, and a failed
# migration fails the `helm upgrade` instead of crash-looping the new replicas
# while the old ones keep serving — and the Deployment gets
# WNK_DATABASE__MIGRATE_ON_START=false. Turn it off only where hooks do not run
# (plain `helm template | kubectl apply`); the server then migrates on boot,
# under Postgres's advisory lock. Argo CD maps these hooks to PreSync.
migrations:
  job:
    enabled: true
    backoffLimit: 1
    # Kills a migration stuck on a lock rather than letting `helm upgrade` sit
    # until its own --timeout. Keep it below that timeout (default 5m).
    activeDeadlineSeconds: 280

# ─────────────────────────────────────────────────────────────────────────────
# Alerting and dashboards — need the Prometheus Operator CRDs / a Grafana with
# the dashboard sidecar. Off by default: neither is something this chart can
# assume exists. Rules and their thresholds are documented in
# docs/content/docs/ops/observability.mdx; runbooks in runbooks.mdx.
# ─────────────────────────────────────────────────────────────────────────────
prometheusRule:
  enabled: false
  namespace: ""
  # Whatever your Prometheus's ruleSelector matches (e.g. `release: kube-prometheus-stack`).
  labels: {}
  # Added to every alert, e.g. `severity` routing overrides or a team label.
  additionalLabels: {}
  # Thresholds, so tuning one is a values change rather than a fork.
  # The 60-second jobs alert after ten missed passes.
  jobStaleSeconds: 600
  pushFailureRatio: 0.2
  dlqDepth: 0
  # The gauge is capped at 100000 per kind (retention.mdx), so this must stay
  # below that or the alert can never fire.
  retentionBacklogRows: 50000
  # The 5xx alert reads ingress-nginx's `nginx_ingress_controller_requests` for
  # the server Ingress (notify-server has no request counter of its own). Turn
  # off on any other ingress controller rather than ship a rule that never fires.
  http5xxFromIngressNginx: true

grafanaDashboard:
  enabled: false
  namespace: ""
  # The default label kube-prometheus-stack's Grafana sidecar watches.
  labels:
    grafana_dashboard: "1"
  annotations: {}

networkPolicy:
  # Off by default: a correct policy needs the ingress-controller/Prometheus namespaces (`ingressFrom`,
  # required when enabled) and, for egress, where Postgres, the bucket, the issuer and SMTP live.
  # Ingress: web -> server, plus `ingressFrom` to both. examples/values-production.yaml fills both in.
  enabled: false
  ingressFrom: []

  # Egress — off unless `egress.enabled`. When on, the server may reach DNS,
  # every rule in `egress.to` and (optionally) public HTTPS, and nothing else;
  # the web pods (static nginx, no upstream) may reach nothing at all.
  egress:
    enabled: false
    # Peers for DNS (UDP+TCP 53). The default matches CoreDNS/kube-dns in any
    # namespace; NodeLocal DNSCache needs an ipBlock for its link-local address.
    dns:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    # NetworkPolicyEgressRule entries appended verbatim — Postgres, the S3
    # endpoint, an in-cluster OIDC issuer, the SMTP relay, the OTLP collector.
    # See examples/values-production.yaml for the shape.
    to: []
    # Web Push relays, APNs, FCM, UnifiedPush distributors and webhook sinks are
    # arbitrary public hosts by design — no allow-list of names can be written
    # for them. This admits TCP 443 to the public internet only: RFC 1918,
    # CGNAT, loopback and link-local (which covers the 169.254.169.254 cloud
    # metadata endpoint) are excepted, so a webhook URL cannot be pointed back
    # into the cluster or at the node's credentials.
    allowPublicHttps: false
