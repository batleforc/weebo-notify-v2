## weebo-notify default values: two Deployments (`server` API, `web` nginx bundle; ADR-0021).
## Credentials are `existingSecret` references only; Postgres, S3 and the OIDC issuer are external.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

image:
  server:
    repository: ghcr.io/batleforc/weebo-notify
    # Defaults to .Chart.AppVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/batleforc/weebo-notify-web
    tag: ""
    pullPolicy: IfNotPresent

# ─────────────────────────────────────────────────────────────────────────────
# server — notify-server: API, SSE/WS, GitOps reconciler, leader-only jobs (§13).
# ─────────────────────────────────────────────────────────────────────────────
server:
  replicaCount: 2

  # Leader election is postgres-only today, so there is no Lease RBAC.

  service:
    type: ClusterIP
    port: 8080

  # Browser origins allowed to call the API (§5.1); empty means `https://<web.ingress.host>` when enabled.
  corsOrigins: []

  # Scrapes `/metrics` on the API port (no separate listener yet), never via the public Ingress.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    namespace: ""
    labels: {}

  ingress:
    enabled: false
    className: ""
    # Only `/api/v1` is routed. A separate host from the web one: the CSP names the API origin
    # (ADR-0021), and path splits trip ingress SSE/WebSocket buffering.
    host: api.notify.example.com
    annotations: {}
    tls: []

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    # targetMemoryUtilizationPercentage: 80
    # Extra HPA metrics, appended verbatim (e.g. `sse_connections` via a custom-metrics adapter,
    # a better signal than CPU for idle long-lived streams):
    #
    #   customMetrics:
    #     - type: Pods
    #       pods:
    #         metric:
    #           name: sse_connections
    #         target:
    #           type: AverageValue
    #           averageValue: "500"
    customMetrics: []

    # HPA behaviour, verbatim. Scale-down is slowed: removing a replica drops and replays its streams.
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 120

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Soft node anti-affinity by default, so single-node clusters still schedule two replicas.
  topologySpreadConstraints: []
  podAntiAffinity: soft # soft | hard | none

  # Must outlive the server's 15 s drain of in-flight requests and streams.
  terminationGracePeriodSeconds: 30

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  # distroless nonroot uid:gid, asserted rather than assumed.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

  # ── Secrets — every field an existingSecret reference, never a value ────────
  # DSN and S3 credentials go in as WNK_* env from a Secret; key files are mounted from Secret volumes.
  database:
    # Secret key holding the `postgres://…` DSN, exposed as WNK_DATABASE__URL.
    existingSecret: ""
    secretKey: database-url

  attachments:
    # `s3` (any S3-compatible bucket, ADR-0002) or `filesystem` (ADR-0022: single-node only, so the
    # chart forces one replica and no PDB).
    kind: s3

    # --- kind: s3 ---
    endpoint: ""
    bucket: ""
    region: us-east-1
    existingSecret: ""
    accessKeyKey: access-key
    secretKeyKey: secret-key

    # --- kind: filesystem ---
    # This server's external origin (filesystem presigns against itself); defaults to
    # `https://<server.ingress.host>` when enabled.
    publicBaseUrl: ""
    # Secret key signing the presigned URLs (WNK_ATTACHMENTS__TOKEN_SECRET); empty means open.
    tokenSecretKey: token-secret
    persistence:
      # A chart-owned PVC (enabled), an existingClaim, or a `server.extraVolumes` entry named `attachments`.
      enabled: false
      path: /var/lib/weebo-notify/attachments
      storageClassName: ""
      size: 10Gi
      accessMode: ReadWriteOnce
      existingClaim: ""

  eventbus:
    # `postgres` (LISTEN/NOTIFY, ADR-0008); `redis` has no adapter yet and is refused.
    backend: postgres

  oidc:
    issuer: ""
    clientId: weebo-notify
    audiences: []
    groupsClaim: groups

  admin:
    # Platform-admin OIDC groups; GitOps-only, no API can grant it (§5.4).
    oidcGroups: []

  retention:
    defaultTtl: 7d
    maxTtl: 90d
    allowForever: false

  push:
    webpush:
      enabled: false
      existingSecret: ""
      # Key inside existingSecret holding the P-256 VAPID private key (PEM).
      keyName: vapid.pem
      contact: ""
    # Server-side only; the native apps that would use it don't exist yet.
    apns:
      enabled: false
      existingSecret: ""
      keyName: apns.p8
      keyId: ""
      teamId: ""
      topic: ""
      sandbox: false
    unifiedpush:
      enabled: false

  federation:
    # CI token exchange (§5.3); not yet exercised against a real forge.
    enabled: false
    existingSecret: ""
    keyName: federation.pem
    audience: ""

  sinks:
    smtp:
      enabled: false
      url: ""
      from: ""
      username: ""
      # Env var named by `password_ref`, injected from `existingSecret`/`passwordKey`.
      passwordEnvName: WNK_SMTP_PASSWORD
      existingSecret: ""
      passwordKey: smtp-password
      permalinkBase: ""

  cli:
    # Serve the bundled `notify` binary at `GET /api/v1/cli` (§9).
    enabled: false

  telemetry:
    enabled: false
    otlpEndpoint: ""
    serviceName: weebo-notify
    sampleRatio: 1.0

  # Extra config.toml (channels, service accounts, trust policies; §11), rendered with `tpl`.
  extraConfig: |
    # [[channels.managed]]
    # id = "cluster-ovh-1"
    # name = "Cluster OVH 1 — incidents"
    # default_ttl = "30d"
    # receipts = true
    #
    #   [[channels.managed.access]]
    #   oidc_group = "infra-admins"
    #   scopes = ["publish", "subscribe", "manage"]

  channels:
    onRemoved: archive # archive | delete
    reload: sighup

# ─────────────────────────────────────────────────────────────────────────────
# web — notify-web: the nginx bundle, config rendered at container boot (ADR-0021).
# ─────────────────────────────────────────────────────────────────────────────
web:
  replicaCount: 2

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: ""
    host: notify.example.com
    annotations: {}
    tls: []

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  podAntiAffinity: soft
  terminationGracePeriodSeconds: 15

  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi

  # nginx-unprivileged's uid (the Containerfile's `USER 101`).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  # Rendered into `/env.js` at boot (ADR-0021): bare origins, no path, no trailing slash.
  env:
    # The server Ingress origin, e.g. https://api.notify.example.com (not a same-host path).
    apiBaseUrl: ""
    oidcIssuer: ""
    oidcClientId: weebo-notify
    # Defaults to same-origin `/csp-report` when empty.
    cspReportUrl: ""
    # Only for attachments served from a third origin the CSP must name.
    attachmentOrigin: ""

networkPolicy:
  # Ingress-only default-deny (web -> server, plus `ingressFrom` to both); no egress policy.
  # `ingressFrom` (ingress controller and Prometheus namespaces) is required when enabled.
  enabled: false
  ingressFrom: []
