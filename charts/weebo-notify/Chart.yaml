apiVersion: v2
name: weebo-notify
description: Self-hosted, multi-channel notification platform — a notification is a lifecycle, not a message.
type: application
# Both track the workspace version (Cargo.toml [workspace.package]): one version
# for the whole product, chart included. `.hooks/sync-version.sh` rewrites them
# during `cog bump` (cog.toml pre_bump_hooks), so never edit them by hand.
# appVersion has no `v`; the image tag does (_helpers.tpl adds it).
version: 0.1.0-rc.1
appVersion: "0.1.0-rc.1"
kubeVersion: ">=1.27.0-0"
home: https://github.com/batleforc/weebo-notify-v2
sources:
  - https://github.com/batleforc/weebo-notify-v2
keywords:
  - notifications
  - gotify
  - ntfy
  - self-hosted
maintainers:
  - name: Max Batleforc
    url: https://github.com/batleforc
annotations:
  artifacthub.io/license: Apache-2.0
