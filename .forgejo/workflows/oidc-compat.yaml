name: oidc-compat

# Identity-provider compatibility is a tested contract, not a promise (design §3.2).
#
# This is a self-hosted product: people will arrive with Keycloak, Authelia, Dex,
# Authentik. Day-to-day development runs against a provider we wrote ourselves
# (ADR-0014), which makes this job *more* load-bearing, not less: our own mock
# cannot surprise us, and a provider that never surprises you is a provider that
# never tells you what real ones do.
#
# The suite is one body of tests parameterised by `WNK_TEST_OIDC_PROVIDER`
# (crates/notify-adapters/oidc/tests/oidc_compat.rs). It takes a token from a LIVE
# provider and puts it through the production verifier — discovery, JWKS, `kid`,
# signature, audience, issuer, expiry and the claim mapping channel access derives
# from (§14.2).
#
# ## What runs today, and what does not
#
# Only the `mock` leg. The `dex` and `authentik` legs were listed here long before
# anything could run them: there is no Dex configuration in this repository, and no
# provider container in this job. The matrix said three and tested zero, because the
# step it ran selected `notify-app`'s in-memory unit tests against a database that
# was never started — green, and empty.
#
# Wiring the two remaining legs is a bounded piece of work, and the suite is already
# shaped for it:
#
#   1. start the provider in a step (NOT under `services:` — those containers start
#      before checkout, so a rendered config cannot be mounted into them);
#   2. export `WNK_TEST_OIDC_ISSUER`, `WNK_TEST_OIDC_CLIENT_ID`,
#      `WNK_TEST_OIDC_PASSWORD` and, for a confidential client,
#      `WNK_TEST_OIDC_CLIENT_SECRET`;
#   3. for Dex: a `staticClients` + `enablePasswordDB` config with alice, and no
#      groups mapping — that absence IS the test (T29);
#   4. for Authentik: the blueprint already committed in dev/authentik/, which the
#      compose profile applies, plus a user whose password the job generates.
#
# Until then the matrix says one, and tests one. NEVER merge a change to the auth
# flow without this job green.

on:
  pull_request:
    paths:
      - "crates/notify-adapters/oidc/**"
      - "crates/notify-app/src/auth.rs"
      - "crates/notify-app/src/authz.rs"
      - "crates/notify-adapters/http-actix/src/extract.rs"
      - "crates/oidc-mock/**"
      - "dev/oidc-mock/**"
      - "dev/authentik/**"
      - ".forgejo/workflows/oidc-compat.yaml"
  schedule:
    # Nightly, so a provider's own update cannot break us silently.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: oidc-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  compat:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04

    strategy:
      # Every provider reports independently: knowing it passes on two of three is
      # far more useful than a single red cross. One entry today — see the header.
      fail-fast: false
      matrix:
        provider: [mock]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/mise
            target
          key: oidc-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.lock') }}
          restore-keys: oidc-${{ runner.os }}-

      - name: Install pinned tools
        run: mise install --yes

      - name: Run the auth suite against ${{ matrix.provider }}
        env:
          WNK_TEST_OIDC_PROVIDER: ${{ matrix.provider }}
        # The fixture selects the issuer, the credentials and the expected claims.
        # That is what makes "it behaves the same everywhere" a fact rather than a
        # hope — and why naming a provider it cannot reach fails the job.
        run: mise exec -- task test:oidc-compat
