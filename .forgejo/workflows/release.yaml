name: release

# Pushing the tag is the only human action (design §3.2bis).
#
# `task release` runs `cog bump --auto`: the version comes from the conventional
# commits, the changelog is generated, and every version in the product is
# synchronised. Pushing the resulting tag triggers everything below with no further
# intervention.
#
# Two invariants:
#   * A tag NEVER moves. A failed release means a fix and a new tag, never a re-tag.
#   * Every job is idempotent. Re-running a failed run resumes without duplicating
#     or corrupting what was already published.
#
# SCOPE: this file implements the gate, both images, their signatures and the
# release object. The full artefact matrix — desktop packages, CLI archives, the
# signed updater manifest, the Android APK — lands with milestone M5, when there is
# something to package. Until then a release carries the two images, their digests
# and their SBOMs, which is the set a deployment actually consumes.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # Where the images go. A variable rather than a literal because the mirror
  # arrangement of §3.2 means this repository lives in two forges, and whoever
  # deploys it may publish to neither of them.
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/batleforc/weebo-notify

jobs:
  gate:
    # A tag never exempts anything from the gates a pull request had to pass.
    name: Replay the pull-request gates
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the toolchain
        # A pinned, checksum-verified binary rather than `curl https://mise.run | sh`.
        # That pipeline fetched an unpinned script over the network and ran it as
        # shell — in jobs that also hold the registry token and the signing identity,
        # which makes whoever controls that host a publisher of this project's
        # images. The version moves when Renovate proposes it, as a reviewable diff.
        env:
          MISE_VERSION: "v2026.8.3"
          MISE_SHA256: "66585ac496c10bf6fbf13272e3e550c1813aed0e1cb780b9bb73c1751de49289"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64" \
            -o "$HOME/.local/bin/mise"
          echo "${MISE_SHA256}  $HOME/.local/bin/mise" | sha256sum -c -
          chmod +x "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install pinned tools
        run: mise install --yes

      - name: Lint
        run: mise exec -- task lint:check

      - name: Contract
        run: |
          mise exec -- task recu
          git diff --exit-code

      - name: Critical suite
        run: mise exec -- task test:critical

  publish:
    name: Build and publish
    needs: gate
    runs-on: docker
    permissions:
      contents: write
      packages: write
      # What cosign keyless signs with (§3.2bis). Without it the signing step fails
      # with an OIDC error that reads like a registry problem — the same trap §5.3
      # documents for the other direction of this token.
      id-token: write
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
      # The image build needs an engine, and this job did not ask for one while it
      # only echoed a warning.
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine the release kind
        id: kind
        # A SemVer pre-release tag (v1.2.3-rc.1) gets the same pipeline, the same
        # artefacts and the same signatures — an RC is a complete product, which is
        # what makes promoting it possible without re-validating. It is marked as a
        # pre-release and `latest` does not move.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the toolchain
        # The `gate` job installs it too, and this is not duplication to factor out:
        # jobs do not share a filesystem, and the scan step below runs `task`.
        # A pinned, checksum-verified binary rather than `curl https://mise.run | sh`.
        # That pipeline fetched an unpinned script over the network and ran it as
        # shell — in jobs that also hold the registry token and the signing identity,
        # which makes whoever controls that host a publisher of this project's
        # images. The version moves when Renovate proposes it, as a reviewable diff.
        env:
          MISE_VERSION: "v2026.8.3"
          MISE_SHA256: "66585ac496c10bf6fbf13272e3e550c1813aed0e1cb780b9bb73c1751de49289"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64" \
            -o "$HOME/.local/bin/mise"
          echo "${MISE_SHA256}  $HOME/.local/bin/mise" | sha256sum -c -
          chmod +x "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install pinned tools
        run: mise install --yes

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Set up buildx
        # Needed for the multi-arch build below: the stock builder emits one
        # architecture, and §3.2bis asks for amd64 and arm64 from the same tag.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up QEMU
        # arm64 on an amd64 runner. Slow, and the alternative is a second runner
        # nobody has yet — worth naming so the day one exists, this step goes away
        # rather than being cargo-culted forward.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push the server image
        # THIS HAS NEVER RUN. The Containerfile it builds was written in a workspace
        # with no container engine (§12.4), so the first execution of this step is
        # its first test — the same state D7 and D12 are open for, and named here
        # rather than discovered by whoever pushes the first tag.
        id: server_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.kind.outputs.tag }}
            ${{ steps.kind.outputs.prerelease == 'false' && format('{0}:latest', env.IMAGE_NAME) || '' }}

      - name: Build and push the web image
        # No build args since ADR-0021 superseded ADR-0019: one image now serves
        # every deployment, and the API origin, the issuer and the client id are
        # read at container boot instead (`web/nginx/docker-entrypoint.d/`).
        id: web_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./web
          file: ./web/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}-web:${{ steps.kind.outputs.tag }}
            ${{ steps.kind.outputs.prerelease == 'false' && format('{0}-web:latest', env.IMAGE_NAME) || '' }}

      - name: Scan the published images
        # After the push and not before it: what is scanned has to be what was
        # published, and a scan of a locally-tagged image proves something about a
        # layer stack that may not be the one that left the runner.
        run: |
          mise exec -- task audit:image \
            IMAGE_REPO="${{ env.IMAGE_NAME }}" \
            IMAGE_TAG="${{ steps.kind.outputs.tag }}"

      - name: Sign the images
        # cosign keyless: the identity is the workflow itself, and the signature
        # lands in Rekor (§3.2bis). No private key to keep, which is the only key
        # custody story that cannot leak — §15 lists the ones that can.
        #
        # BY DIGEST, NOT BY TAG. `cosign sign repo:v1.2.3` re-resolves the tag at
        # signing time, which is a second lookup of a mutable reference: what gets
        # signed is whatever the tag points at *now*, not necessarily what the step
        # above pushed. It also signs the wrong object for a multi-arch build — the
        # consumer that matters is an admission controller, and it verifies the
        # digest it is about to run. `build-push-action` reports that digest as an
        # output; using it closes the window and makes the signature refer to the
        # exact bytes.
        env:
          COSIGN_EXPERIMENTAL: "1"
          SERVER_DIGEST: ${{ steps.server_image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web_image.outputs.digest }}
        run: |
          set -euo pipefail
          # A build that somehow reported no digest must stop the release rather
          # than sign `image@` and produce a signature nothing can verify.
          test -n "$SERVER_DIGEST" && test -n "$WEB_DIGEST"
          cosign sign --yes "${{ env.IMAGE_NAME }}@${SERVER_DIGEST}"
          cosign sign --yes "${{ env.IMAGE_NAME }}-web@${WEB_DIGEST}"

      - name: Publish the release
        # Created as a draft, filled with artefacts and the changelog notes, then
        # published in one move — never a half-empty release visible to anyone.
        #
        # The digests are the point of the body rather than decoration: they are what
        # `cosign verify` above signed, and the only way somebody pulling `:0.1.0`
        # six months from now can check that the tag still resolves to the artefact
        # this run produced. `--verify-tag` refuses to publish against a tag that is
        # not the one this workflow was triggered by.
        #
        # NOT VERIFIED, same terms as the image build above: this step has never
        # run. The forge-targeting in particular is the part to watch on the first
        # tag — Forgejo is the primary forge here and GitHub is a mirror, so `gh`
        # is told its host and repository explicitly rather than inferring them
        # from the checkout's remote. Forgejo implements the release API
        # compatibly; if `gh` proves fussy against it, the fallback is a `curl` to
        # `${{ github.api_url }}/repos/${{ github.repository }}/releases`, and the
        # asset upload is the one call whose shape differs between the two.
        env:
          # The token the runner already has for this repository on this forge.
          # Deliberately not REGISTRY_TOKEN: pushing an image and editing a release
          # are different authorities and should not share one credential (§10 A3).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.kind.outputs.tag }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
          SERVER_DIGEST: ${{ steps.server_image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web_image.outputs.digest }}
        run: |
          set -euo pipefail
          # `github.server_url` is a URL and GH_HOST wants a bare host.
          GH_HOST="${GH_HOST#https://}"
          GH_HOST="${GH_HOST#http://}"
          export GH_HOST

          # cog wrote the changelog at bump time; this extracts the section for the
          # tag being released rather than shipping the whole file.
          notes="$(mise exec -- cog changelog --at "$TAG" 2>/dev/null || true)"
          if [ -z "$notes" ]; then
            echo "::warning::no changelog section for $TAG — publishing with digests only"
          fi

          {
            printf '%s\n\n' "$notes"
            printf '## Images\n\n'
            printf 'Verify before you run them:\n\n'
            printf '```\n'
            printf 'cosign verify %s@%s \\\n' "${{ env.IMAGE_NAME }}" "$SERVER_DIGEST"
            printf '  --certificate-identity-regexp "^https://github.com/batleforc/weebo-notify-v2/" \\\n'
            printf '  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n'
            printf '```\n\n'
            printf '| Image | Digest |\n| --- | --- |\n'
            printf '| `%s:%s` | `%s` |\n' "${{ env.IMAGE_NAME }}" "$TAG" "$SERVER_DIGEST"
            printf '| `%s-web:%s` | `%s` |\n' "${{ env.IMAGE_NAME }}" "$TAG" "$WEB_DIGEST"
          } > release-notes.md

          # The SBOM buildx attached to each image, pulled back out so it is
          # downloadable without a registry client.
          cosign download sbom "${{ env.IMAGE_NAME }}@${SERVER_DIGEST}" \
            > "weebo-notify-${TAG}-server.sbom.json" 2>/dev/null || \
            echo "::warning::no SBOM attached to the server image"
          cosign download sbom "${{ env.IMAGE_NAME }}-web@${WEB_DIGEST}" \
            > "weebo-notify-${TAG}-web.sbom.json" 2>/dev/null || \
            echo "::warning::no SBOM attached to the web image"

          # Idempotent, because every job in this file has to be: a re-run of a
          # failed release edits the draft it already made rather than failing on a
          # release that exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md --draft=false \
              --prerelease="$PRERELEASE" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md \
              --prerelease="$PRERELEASE" --verify-tag --draft
            gh release edit "$TAG" --draft=false
          fi

          for asset in "weebo-notify-${TAG}-server.sbom.json" "weebo-notify-${TAG}-web.sbom.json"; do
            [ -s "$asset" ] && gh release upload "$TAG" "$asset" --clobber
          done
