name: e2e

# End-to-end tests against the real binary, with real dependencies: Postgres and
# RustFS from testcontainers, and the identity provider in-process — it is a crate
# in this workspace (ADR-0014), so there is no image to pull and no registry that
# can be down when the suite runs.
#
# Includes the `critical` suite (design §3.4) — blocking, never skipped, and growing
# by one regression scenario with every bug fix.
#
# Heavier than `check`, so it runs on pull requests targeting main rather than on
# every push to a topic branch.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  e2e:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
      # testcontainers drives the host's container engine from inside the job.
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    services:
      # The persistence and event-bus suites talk to a plain database rather than a
      # testcontainer: they are adapter conformance tests, and giving each of them
      # its own container would spend more time starting Postgres than testing it.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: weebo
          POSTGRES_PASSWORD: weebo
          POSTGRES_DB: weebo_notify
        options: >-
          --health-cmd "pg_isready -U weebo -d weebo_notify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/mise
            target
          key: e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.lock') }}
          restore-keys: e2e-${{ runner.os }}-

      - name: Install pinned tools
        run: mise install --yes

      - name: Pre-pull the service images
        # Pulling inside the test would count against the container start timeout
        # and turn a slow registry into a flaky test.
        run: |
          docker pull postgres:17-alpine
          docker pull rustfs/rustfs:latest

      - name: Critical suite
        # Runs first and separately: if a critical scenario is broken, that is the
        # headline, not something to find inside a long log.
        env:
          WNK_TEST_DATABASE_URL: postgres://weebo:weebo@postgres:5432/weebo_notify
        run: mise exec -- task test:critical

      - name: End-to-end suite
        env:
          WNK_TEST_DATABASE_URL: postgres://weebo:weebo@postgres:5432/weebo_notify
        run: mise exec -- task test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: target/nextest/**/junit*.xml
          retention-days: 14
