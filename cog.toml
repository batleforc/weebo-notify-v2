from_latest_tag = true
ignore_merge_commits = false
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
post_bump_hooks = []
post_package_bump_hooks = []
tag_prefix = "v"

# One version for the whole product (design §3.2bis): the sync script propagates the
# computed version to the cargo workspace, both JS projects and — from M5 — the Tauri
# configuration, so the bump commit already contains them all.
#
# The gates run here too: a tag never exempts anything from what a pull request had
# to pass, and catching it before the tag exists is far cheaper than after.
pre_bump_hooks = [
    "task lint:check",
    "task recu",
    "git diff --exit-code",
    "task test:critical",
    ".hooks/sync-version.sh {{version}}",
]


[git_hooks]

[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file "$1"
"""

[git_hooks.pre-commit]
script = """#!/bin/sh
set -e
# Re-stage only what the author staged: `git add -u` would sweep every unstaged
# edit into the commit. Files regenerated by recu/lint that were not staged stay
# unstaged — the author sees them in `git status`.
staged=$(git -c core.quotePath=false diff --name-only --cached --diff-filter=ACMR)
restage() { echo "$staged" | while IFS= read -r f; do [ -n "$f" ] && git add -- "$f"; done; true; }
task recu
restage
task lint
restage
.hooks/end-of-line.sh
.hooks/whitespace-fixer.sh
gitleaks git --pre-commit --redact --staged --verbose
"""

[commit_types]
release = { changelog_title = "Releases" }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "weebo-notify-v2"
owner = "batleforc"

[bump_profiles]
