version: "3"

tasks:
  default:
    desc: "Check every dependency and the container image for known CVEs."
    cmds:
      - task: cargo
      - task: suppressions
      - task: web
      - task: container
      - task: helm

  cargo:
    desc: "Check Rust dependencies against RustSec (cargo-audit) and the licence/ban policy (cargo-deny)."
    # `web/src-tauri` is its own workspace with its own `Cargo.lock`; audit it too (no toolchain needed).
    cmds:
      - cargo audit
      - cargo deny check
      # From its own directory, so it reads web/src-tauri/.cargo/audit.toml.
      - cmd: cd web/src-tauri && cargo audit
      - cargo deny --manifest-path web/src-tauri/Cargo.toml check licenses sources

  suppressions:
    desc: "Check whether the advisories this repository ignores are still ignorable."
    # Asks whether each `.cargo/audit.toml` ignore has become removable. Advisory, never a gate.
    cmds:
      - cmd: |
          set -eu
          echo "==> suppressed advisories"

          # RUSTSEC-2026-0370..0372 (deny.toml): zbus 5 through notify-rust and secret-service.
          # Removable once neither pulls `zvariant`; the network check only says when to try.
          if ! grep -q '^name = "zvariant"$' Cargo.lock; then
            echo "    zvariant is no longer in Cargo.lock — the three zbus ignores in deny.toml can go"
          else
            for crate in notify-rust secret-service; do
              req="$(curl -fsS -A weebo-notify-audit "https://crates.io/api/v1/crates/$crate" 2>/dev/null \
                | jq -r '.crate.max_stable_version' 2>/dev/null \
                | xargs -I{} curl -fsS -A weebo-notify-audit "https://crates.io/api/v1/crates/$crate/{}/dependencies" 2>/dev/null \
                | jq -r '.dependencies[] | select(.crate_id == "zbus") | .req' 2>/dev/null || true)"
              case "${req:-unknown}" in
                ^5*|5*|=5*) echo "    $crate latest still on zbus ${req} — the zbus ignores still apply" ;;
                unknown) echo "    $crate: crates.io not reachable — check its zbus requirement by hand" ;;
                *)       echo "    $crate latest is on zbus ${req} — REVISIT: bump it, then drop the zbus ignores" ;;
              esac
            done
          fi

          # GHSA-wrw7-89jp-8q8g: pinned by Tauri's GTK3 stack, not by us.
          gtk="$(grep -A1 'name = "gtk"' web/src-tauri/Cargo.lock 2>/dev/null | grep version | head -1 | tr -d ' "' | cut -d= -f2 || true)"
          case "${gtk:-none}" in
            0.18*) echo "    gtk ${gtk} — Tauri still on GTK3; the glib ignore in .trivyignore.yaml still applies" ;;
            none)  echo "    gtk not found in web/src-tauri/Cargo.lock — check the .trivyignore.yaml glib entry" ;;
            *)     echo "    gtk ${gtk} — REVISIT: Tauri moved off GTK3, so the glib ignore may be removable" ;;
          esac

  web:
    desc: "Audit the JS/TS dependencies of web/ and docs/ (pnpm audit)."
    # A missing project is skipped explicitly; findings in an existing one fail the task.
    cmds:
      - cmd: |
          set -eu
          for project in web docs; do
            if [ -f "$project/package.json" ]; then
              echo "==> $project"
              pnpm -C "$project" audit --audit-level moderate
            else
              echo "==> $project not bootstrapped yet — skipping"
            fi
          done

  container:
    desc: "Scan the repository and Containerfiles for CVEs, misconfigurations and secrets (trivy)."
    # Reads the Containerfiles, not the images (that's `audit:image`, which Che can't run).
    # `charts/` is skipped: its `required` values break trivy's render; `audit:helm` covers it.
    # `target/` is build output (never committed): `task cover`'s HTML report quotes test tokens.
    # `perf/results/` likewise (gitignored): k6 saves its `setup()` data, the oidc-mock tokens.
    cmds:
      - trivy fs --scanners vuln,misconfig,secret --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --ignorefile .trivyignore.yaml --skip-dirs charts --skip-dirs '**/target' --skip-dirs perf/results .

  helm:
    desc: "Scan charts/weebo-notify for Kubernetes misconfigurations and secrets (trivy config)."
    # Placeholders satisfy the chart's `required` values. `--ignorefile` is explicit because trivy
    # only auto-discovers it when run from that directory.
    cmds:
      - >-
        trivy config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL
        --ignorefile charts/weebo-notify/.trivyignore.yaml
        --helm-set web.env.apiBaseUrl=https://notify.example.invalid
        --helm-set web.env.oidcIssuer=https://auth.example.invalid
        charts/weebo-notify

  dast:
    desc: "Scan a running instance with OWASP ZAP: baseline on the real web image, API scan from the OpenAPI spec — needs Postgres (task dev:core) and a container engine; reports in target/dast/"
    # Not in `audit:default`: it boots a stack. The web side is the nginx image, not
    # `vite preview`, because its CSP and headers are what gets deployed. The API is
    # scanned twice: without a token (every route must refuse, and how it refuses is
    # what ZAP judges), then as alice, a platform admin from the oidc mock, so the
    # active scan reaches every route, /admin included. That pass writes and deletes,
    # hence its own database, recreated each run and never the dev one. Fails on a ZAP
    # FAIL; warnings are reported, and accepted ones live in .zap/rules.tsv with a reason.
    vars:
      ENGINE:
        sh: if [ -n "${ENGINE:-}" ]; then echo "$ENGINE"; elif command -v docker >/dev/null 2>&1; then echo docker; else echo podman; fi
      # Digest-pinned like every image this repository runs; zaproxy:stable of 2026-10-16.
      ZAP: ghcr.io/zaproxy/zaproxy@sha256:241fd55e438fce3b6b092fdb68348581c28e391b094644ef506c1e3be4a31a78
      WEB_IMAGE: '{{.WEB_IMAGE | default "ghcr.io/batleforc/weebo-notify-v2-web:dev"}}'
      # Same pinned image as the e2e job's service, used here only as a psql client.
      POSTGRES: docker.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      PG_ADMIN_URL: '{{.PG_ADMIN_URL | default "postgres://weebo:weebo@localhost:5432/postgres"}}'
      DAST_DB_URL: '{{.DAST_DB_URL | default "postgres://weebo:weebo@localhost:5432/weebo_dast"}}'
    cmds:
      - cmd: |
          bash -euo pipefail <<'SH'
          set -m
          trap 'for p in $(jobs -p); do kill -- "-$p" 2>/dev/null || true; done; {{.ENGINE}} rm -f wnk-dast-web >/dev/null 2>&1 || true' EXIT
          mkdir -p target/dast && chmod 777 target/dast
          cp docs/content/docs/api/openapi.json target/dast/openapi.json
          cp .zap/rules.tsv target/dast/rules.tsv
          psql() { {{.ENGINE}} run --rm --network host {{.POSTGRES}} psql "$@"; }
          psql "{{.PG_ADMIN_URL}}" -qc "DROP DATABASE IF EXISTS weebo_dast WITH (FORCE)" -c "CREATE DATABASE weebo_dast"
          ./target/debug/oidc-mock --identities dev/oidc-mock/identities.toml &
          WNK_DATABASE__URL="{{.DAST_DB_URL}}" ./target/debug/notify-server --config config/e2e.toml &
          {{.ENGINE}} run -d --rm --name wnk-dast-web -p 127.0.0.1:5173:8080 \
            -e WNK_API_BASE_URL=http://localhost:8080 -e WNK_OIDC_ISSUER=http://localhost:9110 \
            -e WNK_OIDC_CLIENT_ID=weebo-notify -e WNK_ATTACHMENT_ORIGIN=http://localhost:8080 \
            {{.WEB_IMAGE}} >/dev/null
          for url in http://localhost:9110/.well-known/openid-configuration http://localhost:8080/readyz http://localhost:5173/healthz; do
            timeout 120 sh -c "until curl -fsS -o /dev/null $url; do sleep 1; done"
          done
          zap() { {{.ENGINE}} run --rm --network host -v "$PWD/target/dast:/zap/wrk:rw,Z" {{.ZAP}} "$@"; }
          # 0 clean, 2 warnings only: both pass. 1 is a FAIL, 3 a scan that did not run.
          status=0
          zap zap-baseline.py -t http://localhost:5173 -c rules.tsv -r web.html -J web.json -I || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ] || { echo "ZAP baseline (web) exited $status"; exit 1; }
          status=0
          zap zap-api-scan.py -t /zap/wrk/openapi.json -f openapi -O http://localhost:8080 -c rules.tsv -r api.html -J api.json -I || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ] || { echo "ZAP API scan exited $status"; exit 1; }

          # alice's access token, through the mock's real code + PKCE flow (15 min, enough for one pass).
          verifier=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          challenge=$(python3 -c 'import base64, hashlib, sys; print(base64.urlsafe_b64encode(hashlib.sha256(sys.argv[1].encode()).digest()).rstrip(b"=").decode())' "$verifier")
          redirect=http://localhost:5173/auth/callback
          request=$(curl -fsS -G http://localhost:9110/authorize --data-urlencode response_type=code \
              --data-urlencode client_id=weebo-notify --data-urlencode redirect_uri=$redirect \
              --data-urlencode "scope=openid profile email groups" --data-urlencode state=dast \
              --data-urlencode code_challenge="$challenge" --data-urlencode code_challenge_method=S256 \
            | sed -n 's/.*name="request" value="\([^"]*\)".*/\1/p' | head -1)
          location=$(curl -fsS -o /dev/null -w '%{redirect_url}' -X POST http://localhost:9110/authorize \
            --data-urlencode request="$request" --data-urlencode username=alice --data-urlencode password=weebo-dev)
          code=$(python3 -c 'import sys, urllib.parse as u; print(u.parse_qs(u.urlsplit(sys.argv[1]).query)["code"][0])' "$location")
          token=$(curl -fsS -X POST http://localhost:9110/token --data-urlencode grant_type=authorization_code \
              --data-urlencode code="$code" --data-urlencode redirect_uri=$redirect \
              --data-urlencode client_id=weebo-notify --data-urlencode code_verifier="$verifier" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          # The first request makes the user, the way a browser sign-in would.
          curl -fsS -o /dev/null -H "Authorization: Bearer $token" http://localhost:8080/api/v1/me
          # A replacer rule sets the header on every request; quoted for zap_common's
          # shlex split (ZAP_AUTH_HEADER_VALUE is not read by these packaged scans).
          replace="-config replacer.full_list(0)"
          auth="$replace.description=auth $replace.enabled=true $replace.matchtype=REQ_HEADER"
          auth="$auth $replace.matchstr=Authorization $replace.regex=false"
          auth="$auth -config 'replacer.full_list(0).replacement=Bearer $token'"
          status=0
          zap zap-api-scan.py -t /zap/wrk/openapi.json -f openapi -O http://localhost:8080 \
            -c rules.tsv -r api-auth.html -J api-auth.json -I -z "$auth" || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ] || { echo "ZAP authenticated API scan exited $status"; exit 1; }
          echo "Reports: target/dast/web.html, target/dast/api.html, target/dast/api-auth.html"
          SH

  image:
    desc: "Scan the built server and web images for CVEs (trivy) — needs them built and a container engine, or SERVER_REF/WEB_REF pointing at a registry"
    # Not in `audit:default`: it needs built images; the release workflow runs it. SERVER_REF/WEB_REF
    # take a full `repo@sha256:…` (CI scans the digest before tagging it); given one, every platform
    # in PLATFORMS is scanned, since `trivy image` on an index only scans the host's.
    vars:
      PLATFORMS: '{{.PLATFORMS | default (and (or .SERVER_REF .WEB_REF) "linux/amd64 linux/arm64")}}'
      IMAGE_REPO: '{{.IMAGE_REPO | default "ghcr.io/batleforc/weebo-notify-v2"}}'
      IMAGE_TAG: '{{.IMAGE_TAG | default "dev"}}'
      SERVER_REF: '{{.SERVER_REF | default (print .IMAGE_REPO ":" .IMAGE_TAG)}}'
      WEB_REF: '{{.WEB_REF | default (print .IMAGE_REPO "-web:" .IMAGE_TAG)}}'
    cmds:
      - cmd: |
          set -eu
          for ref in "{{.SERVER_REF}}" "{{.WEB_REF}}"; do
            if [ -z "{{.PLATFORMS}}" ]; then
              echo "==> $ref"
              trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$ref"
              continue
            fi
            for platform in {{.PLATFORMS}}; do
              echo "==> $ref ($platform)"
              trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --platform "$platform" "$ref"
            done
          done
