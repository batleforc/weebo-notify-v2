version: "3"

tasks:
  default:
    desc: "Check every dependency and the container image for known CVEs"
    cmds:
      - task: cargo
      - task: suppressions
      - task: web
      - task: container
      - task: helm

  cargo:
    desc: "Rust dependencies: RustSec advisories (cargo-audit) + licence/ban policy (cargo-deny)"
    # `web/src-tauri` declares its own empty `[workspace]` on purpose (it links GTK
    # and WebKit, which no gate on this repository can install), so it has a second,
    # separate `Cargo.lock` that the two commands below would never have looked at.
    # It was outside every Rust gate until this was added: `trivy fs` reads that
    # lockfile, but `audit:container` filters to HIGH,CRITICAL, so anything below
    # that was invisible — which is exactly where its one finding sat.
    #
    # Auditing a lockfile needs no toolchain and no GTK, so this costs nothing the
    # unbuildable-ness of that crate would otherwise excuse.
    cmds:
      - cargo audit
      - cargo deny check
      - cargo audit --file web/src-tauri/Cargo.lock
      - cargo deny --manifest-path web/src-tauri/Cargo.toml check licenses sources

  suppressions:
    desc: "Check whether the advisories this repository ignores are still ignorable"
    # An ignore is a claim with an expiry nobody sets a reminder for. Each entry in
    # `.cargo/audit.toml` names a condition that would take it back out; this asks
    # the machine the one question it can answer — is the fixed version reachable
    # now? — so the answer arrives from the nightly audit run rather than from
    # somebody remembering.
    #
    # Advisory, never a gate: a suppression that has become removable is good news
    # and must not turn the build red.
    cmds:
      - cmd: |
          set -eu
          echo "==> suppressed advisories"

          # RUSTSEC-2026-0194/0195: reachable only through rust-s3, which pins
          # quick-xml ^0.38. The ignore goes when rust-s3 releases against >= 0.41.
          quick_xml="$(grep -A1 'name = "quick-xml"' Cargo.lock | grep version | head -1 | tr -d ' "' | cut -d= -f2)"
          case "$quick_xml" in
            0.3*) echo "    quick-xml $quick_xml — still <0.41; RUSTSEC-2026-0194/0195 ignores still needed" ;;
            *)    echo "    quick-xml $quick_xml — REVISIT: >=0.41 is in the tree, so the two quick-xml ignores can go" ;;
          esac

          # RUSTSEC-2023-0071: no fixed release of `rsa` exists. If one appears,
          # this stops being an argument about reachability.
          rsa="$(grep -A1 'name = "rsa"' Cargo.lock | grep version | head -1 | tr -d ' "' | cut -d= -f2 || true)"
          if [ -n "${rsa:-}" ]; then
            echo "    rsa $rsa — check https://rustsec.org/advisories/RUSTSEC-2023-0071 for a patched release"
          else
            echo "    rsa is no longer in the tree — RUSTSEC-2023-0071 ignore can go"
          fi

          # GHSA-wrw7-89jp-8q8g: pinned by Tauri's GTK3 stack, not by us.
          gtk="$(grep -A1 'name = "gtk"' web/src-tauri/Cargo.lock 2>/dev/null | grep version | head -1 | tr -d ' "' | cut -d= -f2 || true)"
          case "${gtk:-none}" in
            0.18*) echo "    gtk ${gtk} — Tauri still on GTK3; the glib ignore in .trivyignore still applies" ;;
            none)  echo "    gtk not found in web/src-tauri/Cargo.lock — check the .trivyignore glib entry" ;;
            *)     echo "    gtk ${gtk} — REVISIT: Tauri moved off GTK3, so the glib ignore may be removable" ;;
          esac

  web:
    desc: "JS/TS dependencies of web/ and docs/ (pnpm audit)"
    # The `|| true` this used to carry existed so the task would not fail before
    # web/ was bootstrapped — and it swallowed real findings the day it was. A
    # missing project is skipped explicitly now; a project that IS there and has an
    # advisory fails the task, which is the only reason to run it.
    cmds:
      - cmd: |
          set -eu
          for project in web docs; do
            if [ -f "$project/package.json" ]; then
              echo "==> $project"
              pnpm -C "$project" audit --audit-level moderate
            else
              echo "==> $project not bootstrapped yet — skipping"
            fi
          done

  container:
    desc: "Scan the repository and the Containerfiles for CVEs, misconfigurations and secrets (trivy)"
    # This reads the Containerfiles rather than the images: trivy's dockerfile
    # scanner recognises the `Containerfile` name, so both are covered here with no
    # engine and no build. What it CANNOT see is the base images' package lists —
    # that is `audit:image` below, and the two are separate because only one of them
    # can run in an Eclipse Che workspace (§12.4).
    #
    # `charts/` is skipped here, not silently: trivy's own Helm rendering hits
    # `web.env.apiBaseUrl`/`oidcIssuer` `required` guards with no values file to
    # satisfy them, which fails the whole scan rather than just that chart —
    # `audit:helm` below scans it instead, with the placeholders it needs.
    cmds:
      - trivy fs --scanners vuln,misconfig,secret --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --skip-dirs charts .

  helm:
    desc: "Scan charts/weebo-notify for Kubernetes misconfigurations and secrets (trivy config)"
    # The two `required` values below exist so a real `helm install` on an
    # incomplete release fails at render time rather than as a confusing runtime
    # 400 — trivy renders the same template, so it needs the same two, as
    # placeholders rather than a real deployment's values.
    #
    # `--ignorefile` is explicit rather than relying on trivy's own discovery:
    # that only finds `charts/weebo-notify/.trivyignore` automatically when the
    # scan runs *from* that directory, not when it is passed as a path from the
    # repository root, which is how this task and CI both invoke it.
    cmds:
      - >-
        trivy config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL
        --ignorefile charts/weebo-notify/.trivyignore
        --helm-set web.env.apiBaseUrl=https://notify.example.invalid
        --helm-set web.env.oidcIssuer=https://auth.example.invalid
        charts/weebo-notify

  image:
    desc: "Scan the built server and web images for CVEs (trivy) — needs them built and a container engine"
    # Not in `audit:default`, deliberately. It needs images that exist, so putting it
    # there would make `task audit` fail on every machine that has not just run
    # `task build:image` — and a gate that fails for the wrong reason is a gate
    # people learn to ignore. The release workflow runs it where the images are.
    vars:
      IMAGE_REPO: '{{.IMAGE_REPO | default "ghcr.io/batleforc/weebo-notify"}}'
      IMAGE_TAG: '{{.IMAGE_TAG | default "dev"}}'
    cmds:
      - trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed {{.IMAGE_REPO}}:{{.IMAGE_TAG}}
      - trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed {{.IMAGE_REPO}}-web:{{.IMAGE_TAG}}
