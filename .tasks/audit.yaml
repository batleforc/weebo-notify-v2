version: "3"

tasks:
  default:
    desc: "Check every dependency and the container image for known CVEs."
    cmds:
      - task: cargo
      - task: suppressions
      - task: web
      - task: container
      - task: helm

  cargo:
    desc: "Check Rust dependencies against RustSec (cargo-audit) and the licence/ban policy (cargo-deny)."
    # `web/src-tauri` is its own workspace with its own `Cargo.lock`; audit it too (no toolchain needed).
    cmds:
      - cargo audit
      - cargo deny check
      # From its own directory, so it reads web/src-tauri/.cargo/audit.toml.
      - cmd: cd web/src-tauri && cargo audit
      - cargo deny --manifest-path web/src-tauri/Cargo.toml check licenses sources

  suppressions:
    desc: "Check whether the advisories this repository ignores are still ignorable."
    # Asks whether each `.cargo/audit.toml` ignore has become removable. Advisory, never a gate.
    cmds:
      - cmd: |
          set -eu
          echo "==> suppressed advisories"

          # RUSTSEC-2026-0370..0372 (deny.toml): zbus 5 through notify-rust and secret-service.
          # Removable once neither pulls `zvariant`; the network check only says when to try.
          if ! grep -q '^name = "zvariant"$' Cargo.lock; then
            echo "    zvariant is no longer in Cargo.lock — the three zbus ignores in deny.toml can go"
          else
            for crate in notify-rust secret-service; do
              req="$(curl -fsS -A weebo-notify-audit "https://crates.io/api/v1/crates/$crate" 2>/dev/null \
                | jq -r '.crate.max_stable_version' 2>/dev/null \
                | xargs -I{} curl -fsS -A weebo-notify-audit "https://crates.io/api/v1/crates/$crate/{}/dependencies" 2>/dev/null \
                | jq -r '.dependencies[] | select(.crate_id == "zbus") | .req' 2>/dev/null || true)"
              case "${req:-unknown}" in
                ^5*|5*|=5*) echo "    $crate latest still on zbus ${req} — the zbus ignores still apply" ;;
                unknown) echo "    $crate: crates.io not reachable — check its zbus requirement by hand" ;;
                *)       echo "    $crate latest is on zbus ${req} — REVISIT: bump it, then drop the zbus ignores" ;;
              esac
            done
          fi

          # RUSTSEC-2026-0367..0369 (web/src-tauri/.cargo/audit.toml): zip 4 under the updater.
          zip="$(grep -A1 '^name = "zip"$' web/src-tauri/Cargo.lock | grep version | head -1 | tr -d ' "' | cut -d= -f2 || true)"
          case "${zip:-none}" in
            none)      echo "    zip is no longer in web/src-tauri/Cargo.lock — the zip ignores can go" ;;
            [0-8].*)   echo "    zip ${zip} — still under tauri-plugin-updater; the zip ignores still apply" ;;
            *)         echo "    zip ${zip} — REVISIT: past the fix, so the zip ignores can go" ;;
          esac

          # GHSA-wrw7-89jp-8q8g: pinned by Tauri's GTK3 stack, not by us.
          gtk="$(grep -A1 'name = "gtk"' web/src-tauri/Cargo.lock 2>/dev/null | grep version | head -1 | tr -d ' "' | cut -d= -f2 || true)"
          case "${gtk:-none}" in
            0.18*) echo "    gtk ${gtk} — Tauri still on GTK3; the glib ignore in .trivyignore.yaml still applies" ;;
            none)  echo "    gtk not found in web/src-tauri/Cargo.lock — check the .trivyignore.yaml glib entry" ;;
            *)     echo "    gtk ${gtk} — REVISIT: Tauri moved off GTK3, so the glib ignore may be removable" ;;
          esac

  web:
    desc: "Audit the JS/TS dependencies of web/ and docs/ (pnpm audit)."
    # A missing project is skipped explicitly; findings in an existing one fail the task.
    cmds:
      - cmd: |
          set -eu
          for project in web docs; do
            if [ -f "$project/package.json" ]; then
              echo "==> $project"
              pnpm -C "$project" audit --audit-level moderate
            else
              echo "==> $project not bootstrapped yet — skipping"
            fi
          done

  container:
    desc: "Scan the repository and Containerfiles for CVEs, misconfigurations and secrets (trivy)."
    # Reads the Containerfiles, not the images (that's `audit:image`, which Che can't run).
    # `charts/` is skipped: its `required` values break trivy's render; `audit:helm` covers it.
    # `target/` is build output (never committed): `task cover`'s HTML report quotes test tokens.
    # `perf/results/` likewise (gitignored): k6 saves its `setup()` data, the oidc-mock tokens.
    cmds:
      - trivy fs --scanners vuln,misconfig,secret --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --ignorefile .trivyignore.yaml --skip-dirs charts --skip-dirs '**/target' --skip-dirs perf/results .

  helm:
    desc: "Scan charts/weebo-notify for Kubernetes misconfigurations and secrets (trivy config)."
    # Placeholders satisfy the chart's `required` values. `--ignorefile` is explicit because trivy
    # only auto-discovers it when run from that directory.
    cmds:
      - >-
        trivy config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL
        --ignorefile charts/weebo-notify/.trivyignore.yaml
        --helm-set web.env.apiBaseUrl=https://notify.example.invalid
        --helm-set web.env.oidcIssuer=https://auth.example.invalid
        charts/weebo-notify

  image:
    desc: "Scan the built server and web images for CVEs (trivy) — needs them built and a container engine, or SERVER_REF/WEB_REF pointing at a registry"
    # Not in `audit:default`: it needs built images; the release workflow runs it. SERVER_REF/WEB_REF
    # take a full `repo@sha256:…` (CI scans the digest before tagging it); given one, every platform
    # in PLATFORMS is scanned, since `trivy image` on an index only scans the host's.
    vars:
      PLATFORMS: '{{.PLATFORMS | default (and (or .SERVER_REF .WEB_REF) "linux/amd64 linux/arm64")}}'
      IMAGE_REPO: '{{.IMAGE_REPO | default "ghcr.io/batleforc/weebo-notify-v2"}}'
      IMAGE_TAG: '{{.IMAGE_TAG | default "dev"}}'
      SERVER_REF: '{{.SERVER_REF | default (print .IMAGE_REPO ":" .IMAGE_TAG)}}'
      WEB_REF: '{{.WEB_REF | default (print .IMAGE_REPO "-web:" .IMAGE_TAG)}}'
    cmds:
      - cmd: |
          set -eu
          for ref in "{{.SERVER_REF}}" "{{.WEB_REF}}"; do
            if [ -z "{{.PLATFORMS}}" ]; then
              echo "==> $ref"
              trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$ref"
              continue
            fi
            for platform in {{.PLATFORMS}}; do
              echo "==> $ref ($platform)"
              trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --platform "$platform" "$ref"
            done
          done
