version: "3"

vars:
  PROFILES: '{{.PROFILES | default "base design"}}'
  SCOPE: '{{.SCOPE | default "project"}}'

tasks:
  install:
    desc: "Link the skills of the given wska profiles, installers included (usage: task skills:install [PROFILES='base design'] [SCOPE=project|user])"
    preconditions:
      - sh: "command -v wska >/dev/null"
        msg: "wska is required, run 'task mise:install'"
    cmds:
      - wska install {{range splitList " " .PROFILES}}--profile {{.}} {{end}}--scope {{.SCOPE}} --run-installers
      - echo "Restart Claude Code to load the freshly linked skills"

  status:
    desc: "Show what wska linked in the target"
    cmds:
      - wska status --scope {{.SCOPE}}

  doctor:
    desc: "Check every skill has the tools it needs on this machine"
    cmds:
      - wska doctor

  list:
    desc: "List the available wska profiles"
    cmds:
      - wska list --profiles

  update:
    desc: "Pull the latest skills into the wska clone (links are live, nothing to reinstall)"
    cmds:
      - git -C "${XDG_DATA_HOME:-$HOME/.local/share}/wska/weebo-skillsagent" pull --ff-only
