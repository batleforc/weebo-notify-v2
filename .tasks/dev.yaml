version: "3"

# Task echoes multi-line scripts verbatim; the scripts below print what matters themselves.
silent: true

# Local development environment (design §12).
#
# Parity rule: compose and the Eclipse Che devfile expose THE SAME services, on the
# SAME ports, with the SAME credentials — so a single config/dev.toml works in both
# worlds and no `if env == che` ever reaches the code. In Che the sidecars are
# started by the devfile itself, so the compose tasks below detect $DEVWORKSPACE_ID
# and no-op cleanly instead of failing on a missing container engine.

vars:
  # Detected, not hardcoded. `docker compose` was spelled out here, and on a machine
  # with podman and no docker — a Fedora Silverblue workstation, say, where the
  # engine is the one the base image ships — every compose task failed on `docker:
  # command not found` before it ever read dev/compose.yaml. Podman's `compose`
  # subcommand delegates to the same external provider docker uses, so the only
  # thing that differs is the word in front. `ENGINE=… task dev:up` still wins, for
  # a machine that has both and a preference; the same variable name and the same
  # precedence as build.yaml, which had the override and not the detection.
  ENGINE:
    sh: |
      if [ -n "${ENGINE:-}" ]; then echo "$ENGINE"
      elif command -v docker >/dev/null 2>&1; then echo docker
      else echo podman
      fi
  COMPOSE: '{{.ENGINE}} compose -f dev/compose.yaml --env-file dev/.env --env-file dev/.env.local'
  CHE_GUARD: |
    if [ -n "$DEVWORKSPACE_ID" ]; then
      echo "Eclipse Che workspace detected — the sidecars come from devfile.yaml, nothing to do."
      exit 0
    fi
  # The inverse of CHE_GUARD: the `:public` tasks below wire a process to the
  # workspace's public route with the `url` CLI the base image ships (design
  # §12.1), which reads DEVWORKSPACE_NAMESPACE/DEVWORKSPACE_NAME and fails on an
  # unbound variable outside Che. Checked up front for a message that says why,
  # rather than that shell error.
  REQUIRE_CHE: |
    if [ -z "${DEVWORKSPACE_ID:-}" ]; then
      echo "Not an Eclipse Che workspace — \`url\` has nothing to resolve. Use the non-\`:public\` task instead." >&2
      exit 1
    fi

tasks:
  setup:
    desc: "Create everything a fresh clone needs before the stack runs: Authentik credentials, VAPID and federation keys"
    # The single entry point, and every task that needs any of it depends on this
    # one rather than on a piece of it. Each step below is idempotent and guarded
    # by its own `status:`, so running it on every `dev:up` costs nothing and
    # removes the failure mode this exists for: a secret that has to be created by
    # hand is one somebody will not create, and the symptom lands somewhere else.
    cmds:
      - task: env
      - task: vapid
      - task: federation-key

  env:
    desc: "Create dev/.env.local with freshly generated Authentik bootstrap credentials (gitignored)"
    status:
      - test -f dev/.env.local
    cmds:
      - cmd: |
          set -eu
          gen() { LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom 2>/dev/null | head -c "$1" || true; }
          pw=$(gen 32)
          tok=$(gen 60)
          cat > dev/.env.local <<EOF
          # Generated by \`task dev:env\` — NEVER commit this file (design §12.5).
          # Authentik bootstrap credentials; the throwaway alice/bob accounts stay in dev/.env.
          AUTHENTIK_BOOTSTRAP_PASSWORD=$pw
          AUTHENTIK_BOOTSTRAP_TOKEN=$tok
          EOF
          echo "dev/.env.local created."
          echo "  Authentik admin : akadmin / $pw"
          echo "  Bootstrap token : $tok"
          echo "This is the only time these are printed."

  vapid:
    desc: "Mint the P-256 VAPID key that [push.webpush] reads, into dev/secrets/ (gitignored)"
    # Rust rather than `openssl genpkey`: nothing here assumes a tool the Che image
    # may not ship, and the generator prints the `applicationServerKey` that a
    # browser subscribes with — which openssl cannot do in one command (§12.5).
    status:
      - test -f dev/secrets/vapid.pem
    cmds:
      - cargo run --quiet -p xtask -- vapid-key --output dev/secrets/vapid.pem

  federation-key:
    desc: "Mint the Ed25519 key that [federation] signs CI tokens with, into dev/secrets/ (gitignored)"
    # Same reasoning as `vapid`, and one more: this key cannot be generated at boot
    # because a replica would sign what its neighbour cannot verify (§11 `[ha]`), so
    # it has to exist on disk before the server starts.
    status:
      - test -f dev/secrets/federation.pem
    cmds:
      - cargo run --quiet -p xtask -- federation-key --output dev/secrets/federation.pem

  up:
    desc: "Start the everyday dev stack: Postgres + RustFS (~20s, no Authentik)"
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} up -d --wait
          echo
          echo "Containers are up. The identity provider is a process, not a container:"
          echo "  task dev:oidc    # in another terminal, on :9110"

  core:
    desc: "Start Postgres + RustFS only — for domain work with the in-memory TokenVerifier (no OIDC)"
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} up -d --wait postgres rustfs

  oidc:
    desc: "Run the development identity provider on :9110 — alice/bob/carol, password weebo-dev"
    # A binary in this workspace rather than a container (ADR-0014): one provider
    # for compose, Che and CI, with no image to pull and nothing to keep in sync.
    # In Che, export WNK_OIDC_MOCK_ISSUER (and WNK_OIDC__ISSUER for the server) to
    # the workspace's public route first — browser redirects cannot reach the pod's
    # localhost (§12.1).
    cmds:
      - cargo run -p notify-oidc-mock -- --identities dev/oidc-mock/identities.toml

  oidc:public:
    desc: "Run the identity provider issuing tokens as this Che workspace's public route, instead of localhost (§12.1)"
    cmds:
      - cmd: |
          {{.REQUIRE_CHE}}
          issuer=$(url oidc); issuer=${issuer%/}
          web=$(url web); web=${web%/}
          echo "issuer: $issuer"
          echo "extra redirect_uri: $web/auth/callback"
          WNK_OIDC_MOCK_ISSUER="$issuer" \
          WNK_OIDC_MOCK_EXTRA_REDIRECT_URI="$web/auth/callback" \
          WNK_OIDC_MOCK_EXTRA_POST_LOGOUT_REDIRECT_URI="$web/" \
          cargo run -p notify-oidc-mock -- --identities dev/oidc-mock/identities.toml

  auth:
    desc: "Add real Authentik on top (profile `authentik`) — for work touching the OIDC flow itself"
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile authentik up -d --wait
          echo
          echo "Authentik is up. Point the server at it with:"
          echo "  WNK_OIDC__ISSUER=http://localhost:9100/application/o/weebo-notify/ task dev:run"

  sinks:
    desc: "Add Mailpit (profile `sinks`) to exercise the email sink — UI on http://localhost:8025"
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile sinks up -d --wait

  dex:
    desc: "Add Dex (profile `dex`) — the no-groups leg of the identity matrix (T29), on :5556"
    # Here so a red `oidc-compat` run can be reproduced by hand, which is the only
    # moment anybody wants Dex. The config is rendered first because its password is
    # generated per run and never committed (§3.2); the rendered file is gitignored.
    cmds:
      - cmd: |
          set -eu
          # The guard is NOT at the top here, unlike its neighbours. Those no-op
          # under Che because the devfile starts their sidecar with everything it
          # needs; this config does not exist until the line below writes it, so the
          # rendering is the half that has to happen in both worlds. Only the
          # bringing-up differs, and that is what the branch says.
          dev/dex/render.sh dev/dex/config.local.yaml > dev/dex/env.local
          if [ -n "${DEVWORKSPACE_ID:-}" ]; then
            echo "Config rendered. The sidecar is already scheduled, so start the"
            echo "process in it rather than a container here (devfile.yaml):"
            echo "  run-dex          # from the Che command palette, or:"
            echo "  kubectl exec -c dex \$HOSTNAME -- dex serve \$PWD/dev/dex/config.local.yaml"
            echo
            echo "If that stops on a permission error, the rendered file is 0600 and"
            echo "the sidecar runs as another user:  chmod 644 dev/dex/config.local.yaml"
          else
            {{.COMPOSE}} --profile dex up -d --wait
            echo
            echo "Dex is up."
          fi
          echo
          echo "Run the compatibility leg against it with:"
          echo "  set -a; . dev/dex/env.local; set +a; task test:oidc-compat"

  seed:
    desc: "Seed the environment (idempotent): sqlx migrations, RustFS bucket, Authentik blueprint"
    cmds:
      - dev/seed/seed.sh

  argocd-key:
    desc: "Mint the bot-argocd API key once, into dev/secrets/ (gitignored) — needs `task dev:oidc` and `task dev:run` already running"
    # Same idempotency shape as `vapid`/`federation-key` above, but this one cannot
    # be a dependency of `setup`/`seed`: minting a key means calling the running
    # server, which those two do not assume. Run by hand once `dev:oidc`/`dev:run`
    # are both up.
    #
    # Without this, `config/dev.toml`'s `[[service_accounts]]` reconciliation
    # (§5.2bis) keeps the *account* stable across restarts, but its API key is a
    # secret shown exactly once (§5.2) with nowhere durable to land — so every
    # restart where nobody has last time's secret handy mints a fresh one via the
    # API/UI, and the old key is left behind. From outside that reads as "the
    # account gets recreated". It never did; only the key kept multiplying.
    status:
      - test -f dev/secrets/bot-argocd.key
    cmds:
      - cmd: |
          set -eu
          user="${WNK_TUI_USER:-alice}"
          verifier=$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 64)
          challenge=$(printf '%s' "$verifier" | openssl dgst -sha256 -binary | base64 | tr '+/' '-_' | tr -d '=')

          request=$(curl -sS "http://localhost:9110/authorize?response_type=code&client_id=weebo-notify&redirect_uri=http://localhost:5173/auth/callback&scope=openid&code_challenge=$challenge&code_challenge_method=S256" \
            | grep -oP 'name="request" value="\K[^"]+') || {
            echo "Could not reach the oidc mock on :9110 — is \`task dev:oidc\` running?" >&2
            exit 1
          }
          code=$(curl -sS -i -d "request=$request&username=$user&password=weebo-dev" http://localhost:9110/authorize \
            | grep -ioP 'location:.*code=\K[^&"'"'"'\r\n ]+')
          token=$(curl -sS -d "grant_type=authorization_code&code=$code&code_verifier=$verifier&redirect_uri=http://localhost:5173/auth/callback&client_id=weebo-notify" \
            http://localhost:9110/token | grep -oP '"access_token":\s*"\K[^"]+')

          # $user must hold `manage` on ci-infra to mint a service-account key there
          # (design §5.2) — alice (infra-admins) does, per config/dev.toml.
          secret=$(curl -sS -X POST http://localhost:8080/api/v1/apikeys \
            -H "authorization: Bearer $token" \
            -H "content-type: application/json" \
            -d '{"owner":{"owner":"service_account","id":"bot-argocd"},"channels":["ci-infra"],"scopes":["publish","subscribe"]}') || {
            echo "Could not reach the server on :8080 — is \`task dev:run\` running?" >&2
            exit 1
          }
          printf '%s' "$secret" | grep -oP '"secret":\s*"\K[^"]+' > dev/secrets/bot-argocd.key || {
            echo "Unexpected response from POST /apikeys:" >&2
            echo "$secret" >&2
            exit 1
          }
          echo "dev/secrets/bot-argocd.key created — this is the only time that secret is shown."

  run:
    desc: "Run the weebo-notify server against config/dev.toml (outside any container)"
    # The one task that genuinely cannot start without the key: `config/dev.toml`
    # declares `[push.webpush]`, and the composition root refuses a key it cannot
    # read rather than starting mute (M3.5).
    deps: [setup]
    cmds:
      - cargo run -p notify-server -- --config config/dev.toml

  run:public:
    desc: "Run the server wired to this Che workspace's public routes: OIDC issuer + the public web origin in CORS (§12.1)"
    deps: [setup]
    cmds:
      - cmd: |
          {{.REQUIRE_CHE}}
          issuer=$(url oidc); issuer=${issuer%/}
          web=$(url web); web=${web%/}
          echo "oidc issuer : $issuer"
          echo "cors origin : $web"
          WNK_OIDC__ISSUER="$issuer" \
          # The whole list, not just `$web`: this variable replaces
          # `config/dev.toml`'s rather than adding to it, so anything left out here
          # is an origin the server stops accepting for as long as this task runs —
          # including the desktop shell's `tauri://localhost` (see that file).
          WNK_SERVER__CORS_ORIGINS="[\"http://localhost:5173\",\"http://localhost:8080\",\"tauri://localhost\",\"http://tauri.localhost\",\"$web\"]" \
          cargo run -p notify-server -- --config config/dev.toml

  web:
    desc: "Run the Vite dev server for the web frontend (http://localhost:5173)"
    # `web:env` first, always: the backend this page talks to is a file Vite serves,
    # not something it computes, so starting without rendering it means serving
    # whatever the last run left — see that task for why it is one task and not two.
    deps: [web:env]
    cmds:
      - pnpm -C web dev

  cli:
    desc: "Open the terminal UI (`notify watch`) against the local dev server — mints a throwaway token from the oidc mock unless WNK_TOKEN is already set (needs `task dev:oidc` and `task dev:run` running)"
    # `notify-client-core::Profile` already defaults to http://localhost:8080 (§9.1),
    # so the one thing missing for a second terminal to `notify watch` alongside a
    # browser tab is a credential. WNK_TUI_USER picks which of the throwaway
    # identities (dev/oidc-mock/identities.toml) to mint one for; a real deployment
    # has no such flow; the PKCE dance below is the same one a browser runs.
    cmds:
      - cmd: |
          set -eu
          if [ -n "${WNK_TOKEN:-}" ]; then
            cargo run -p notify-cli -- watch
            exit 0
          fi

          user="${WNK_TUI_USER:-alice}"
          verifier=$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 64)
          challenge=$(printf '%s' "$verifier" | openssl dgst -sha256 -binary | base64 | tr '+/' '-_' | tr -d '=')

          request=$(curl -sS "http://localhost:9110/authorize?response_type=code&client_id=weebo-notify&redirect_uri=http://localhost:5173/auth/callback&scope=openid&code_challenge=$challenge&code_challenge_method=S256" \
            | grep -oP 'name="request" value="\K[^"]+') || {
            echo "Could not reach the oidc mock on :9110 — is \`task dev:oidc\` running?" >&2
            exit 1
          }
          code=$(curl -sS -i -d "request=$request&username=$user&password=weebo-dev" http://localhost:9110/authorize \
            | grep -ioP 'location:.*code=\K[^&"'"'"'\r\n ]+')
          token=$(curl -sS -d "grant_type=authorization_code&code=$code&code_verifier=$verifier&redirect_uri=http://localhost:5173/auth/callback&client_id=weebo-notify" \
            http://localhost:9110/token | grep -oP '"access_token":\s*"\K[^"]+')

          echo "watching as $user"
          WNK_TOKEN="$token" cargo run -p notify-cli -- watch

  # `web/public/env.js` is a static file the Vite dev server just serves — nothing
  # templates it per request — so it has to say the right thing *before* `web`
  # above starts, which is why that task depends on this one.
  #
  # One task and not the `:local`/`:public` pair this replaced. That pair asked the
  # developer to know which world they were in and to remember to say so, and the
  # cost of forgetting was not an error: it was a dev server that came up pointing
  # at the other world's backend and failed later, in the browser, as CORS or a
  # refused token. The machine already knows the answer — DEVWORKSPACE_ID is set in
  # a Che workspace and unset everywhere else, which is the same test CHE_GUARD
  # makes at the top of this file — so it answers instead of asking.
  #
  # In Che the routes come from `url`, never from a pattern guessed here: the
  # hostname template belongs to the Che installation, not to this repository, and
  # a convention this file assumed would break silently the day it changed.
  #
  # On a plain machine the values written are the ones committed, so `task dev:web`
  # leaves a clean tree. In Che it does not, and cannot: `git checkout --
  # web/public/env.js` puts it back.
  web:env:
    desc: "Render web/public/env.js for wherever this runs — the Che routes via `url`, the compose defaults otherwise"
    cmds:
      - cmd: |
          set -eu
          if [ -n "${DEVWORKSPACE_ID:-}" ]; then
            api=$(url server); api=${api%/}
            issuer=$(url oidc); issuer=${issuer%/}
            where="Eclipse Che"
          else
            api="http://localhost:8080"
            issuer="http://localhost:9110"
            where="localhost"
          fi
          cat > web/public/env.js <<JS
          // Read by \`src/config.ts\` at startup, before the app bundle runs (design §11,
          // ADR-0021). WRITTEN BY \`task dev:web:env\`, which \`task dev:web\` depends on —
          // so edits here last until the next \`task dev:web\` and no longer. Committed
          // with the values the local dev stack serves, which is what that task writes on
          // any machine that is not an Eclipse Che workspace (§12.1).
          //
          // A real deployment does not edit this file: its image renders one just like it,
          // at container boot, from WNK_API_BASE_URL/WNK_OIDC_ISSUER/WNK_OIDC_CLIENT_ID/
          // WNK_ATTACHMENT_ORIGIN (\`web/nginx/docker-entrypoint.d/05-runtime-config.sh\`).
          // This one only ever ships inside a \`pnpm dev\`/\`pnpm build && pnpm preview\` run.
          //
          // There is no secret in this file, by construction: the OIDC client is public and
          // uses Authorization Code + PKCE (§5.1).
          window.__ENV__ = {
            apiBaseUrl: "$api",
            oidcIssuer: "$issuer",
            oidcClientId: "weebo-notify",
          };
          JS
          echo "web/public/env.js -> $api / $issuer  ($where)"

  docs:
    desc: "Run the Fumadocs documentation site in dev mode (http://localhost:3000)"
    cmds:
      - pnpm -C docs dev

  logs:
    desc: "Follow the logs of every dev service"
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} logs -f

  logs:tail:
    desc: "Print the last N lines (TAIL, default 50) of every dev service and exit"
    # `logs` above follows, which is right at a terminal and wrong everywhere else:
    # CI wants the tail of a stack that has already failed, and `-f` there is a job
    # that hangs until the timeout. Split rather than parameterised because "follow"
    # and "dump and exit" are different intents, and a flag would make the common
    # one longer to type.
    #
    # It also keeps the compose invocation in this file. The one place that spelled
    # `docker compose -f dev/compose.yaml …` out by hand — the Authentik leg of
    # oidc-compat — dropped both `--env-file` flags and failed on the first run it
    # ever had.
    vars:
      TAIL: '{{.TAIL | default "50"}}'
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile authentik --profile dex --profile sinks logs --tail {{.TAIL}}

  down:
    desc: "Stop every dev service, keeping the volumes"
    # `env` and not `setup`: compose needs the env file to resolve, and tearing a
    # stack down has no use for a push key.
    deps: [env]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile "*" down

  reset:
    desc: "Stop every dev service AND wipe the volumes — next `dev:up` starts from a blank slate"
    deps: [env]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile "*" down -v
