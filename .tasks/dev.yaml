version: "3"

# Task echoes multi-line scripts verbatim; the scripts below print what matters themselves.
silent: true

# Local development environment (design §12).
#
# Parity rule: compose and the Eclipse Che devfile expose THE SAME services, on the
# SAME ports, with the SAME credentials — so a single config/dev.toml works in both
# worlds and no `if env == che` ever reaches the code. In Che the sidecars are
# started by the devfile itself, so the compose tasks below detect $DEVWORKSPACE_ID
# and no-op cleanly instead of failing on a missing container engine.

vars:
  COMPOSE: docker compose -f dev/compose.yaml --env-file dev/.env --env-file dev/.env.local
  CHE_GUARD: |
    if [ -n "$DEVWORKSPACE_ID" ]; then
      echo "Eclipse Che workspace detected — the sidecars come from devfile.yaml, nothing to do."
      exit 0
    fi

tasks:
  setup:
    desc: "Create everything a fresh clone needs before the stack runs: Authentik credentials, VAPID and federation keys"
    # The single entry point, and every task that needs any of it depends on this
    # one rather than on a piece of it. Each step below is idempotent and guarded
    # by its own `status:`, so running it on every `dev:up` costs nothing and
    # removes the failure mode this exists for: a secret that has to be created by
    # hand is one somebody will not create, and the symptom lands somewhere else.
    cmds:
      - task: env
      - task: vapid
      - task: federation-key

  env:
    desc: "Create dev/.env.local with freshly generated Authentik bootstrap credentials (gitignored)"
    status:
      - test -f dev/.env.local
    cmds:
      - cmd: |
          set -eu
          gen() { LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom 2>/dev/null | head -c "$1" || true; }
          pw=$(gen 32)
          tok=$(gen 60)
          cat > dev/.env.local <<EOF
          # Generated by \`task dev:env\` — NEVER commit this file (design §12.5).
          # Authentik bootstrap credentials; the throwaway alice/bob accounts stay in dev/.env.
          AUTHENTIK_BOOTSTRAP_PASSWORD=$pw
          AUTHENTIK_BOOTSTRAP_TOKEN=$tok
          EOF
          echo "dev/.env.local created."
          echo "  Authentik admin : akadmin / $pw"
          echo "  Bootstrap token : $tok"
          echo "This is the only time these are printed."

  vapid:
    desc: "Mint the P-256 VAPID key that [push.webpush] reads, into dev/secrets/ (gitignored)"
    # Rust rather than `openssl genpkey`: nothing here assumes a tool the Che image
    # may not ship, and the generator prints the `applicationServerKey` that a
    # browser subscribes with — which openssl cannot do in one command (§12.5).
    status:
      - test -f dev/secrets/vapid.pem
    cmds:
      - cargo run --quiet -p xtask -- vapid-key --output dev/secrets/vapid.pem

  federation-key:
    desc: "Mint the Ed25519 key that [federation] signs CI tokens with, into dev/secrets/ (gitignored)"
    # Same reasoning as `vapid`, and one more: this key cannot be generated at boot
    # because a replica would sign what its neighbour cannot verify (§11 `[ha]`), so
    # it has to exist on disk before the server starts.
    status:
      - test -f dev/secrets/federation.pem
    cmds:
      - cargo run --quiet -p xtask -- federation-key --output dev/secrets/federation.pem

  up:
    desc: "Start the everyday dev stack: Postgres + RustFS (~20s, no Authentik)"
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} up -d --wait
          echo
          echo "Containers are up. The identity provider is a process, not a container:"
          echo "  task dev:oidc    # in another terminal, on :9110"

  core:
    desc: "Start Postgres + RustFS only — for domain work with the in-memory TokenVerifier (no OIDC)"
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} up -d --wait postgres rustfs

  oidc:
    desc: "Run the development identity provider on :9110 — alice/bob/carol, password weebo-dev"
    # A binary in this workspace rather than a container (ADR-0014): one provider
    # for compose, Che and CI, with no image to pull and nothing to keep in sync.
    # In Che, export WNK_OIDC_MOCK_ISSUER (and WNK_OIDC__ISSUER for the server) to
    # the workspace's public route first — browser redirects cannot reach the pod's
    # localhost (§12.1).
    cmds:
      - cargo run -p notify-oidc-mock -- --identities dev/oidc-mock/identities.toml

  auth:
    desc: "Add real Authentik on top (profile `authentik`) — for work touching the OIDC flow itself"
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile authentik up -d --wait
          echo
          echo "Authentik is up. Point the server at it with:"
          echo "  WNK_OIDC__ISSUER=http://localhost:9100/application/o/weebo-notify/ task dev:run"

  sinks:
    desc: "Add Mailpit (profile `sinks`) to exercise the email sink — UI on http://localhost:8025"
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile sinks up -d --wait

  dex:
    desc: "Add Dex (profile `dex`) — the no-groups leg of the identity matrix (T29), on :5556"
    # Here so a red `oidc-compat` run can be reproduced by hand, which is the only
    # moment anybody wants Dex. The config is rendered first because its password is
    # generated per run and never committed (§3.2); the rendered file is gitignored.
    cmds:
      - cmd: |
          set -eu
          # The guard is NOT at the top here, unlike its neighbours. Those no-op
          # under Che because the devfile starts their sidecar with everything it
          # needs; this config does not exist until the line below writes it, so the
          # rendering is the half that has to happen in both worlds. Only the
          # bringing-up differs, and that is what the branch says.
          dev/dex/render.sh dev/dex/config.local.yaml > dev/dex/env.local
          if [ -n "${DEVWORKSPACE_ID:-}" ]; then
            echo "Config rendered. The sidecar is already scheduled, so start the"
            echo "process in it rather than a container here (devfile.yaml):"
            echo "  run-dex          # from the Che command palette, or:"
            echo "  kubectl exec -c dex \$HOSTNAME -- dex serve \$PWD/dev/dex/config.local.yaml"
            echo
            echo "If that stops on a permission error, the rendered file is 0600 and"
            echo "the sidecar runs as another user:  chmod 644 dev/dex/config.local.yaml"
          else
            {{.COMPOSE}} --profile dex up -d --wait
            echo
            echo "Dex is up."
          fi
          echo
          echo "Run the compatibility leg against it with:"
          echo "  set -a; . dev/dex/env.local; set +a; task test:oidc-compat"

  seed:
    desc: "Seed the environment (idempotent): sqlx migrations, RustFS bucket, Authentik blueprint"
    cmds:
      - dev/seed/seed.sh

  run:
    desc: "Run the weebo-notify server against config/dev.toml (outside any container)"
    # The one task that genuinely cannot start without the key: `config/dev.toml`
    # declares `[push.webpush]`, and the composition root refuses a key it cannot
    # read rather than starting mute (M3.5).
    deps: [setup]
    cmds:
      - cargo run -p notify-server -- --config config/dev.toml

  web:
    desc: "Run the Vite dev server for the web frontend (http://localhost:5173)"
    cmds:
      - pnpm -C web dev

  docs:
    desc: "Run the Fumadocs documentation site in dev mode (http://localhost:3000)"
    cmds:
      - pnpm -C docs dev

  logs:
    desc: "Follow the logs of every dev service"
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} logs -f

  down:
    desc: "Stop every dev service, keeping the volumes"
    # `env` and not `setup`: compose needs the env file to resolve, and tearing a
    # stack down has no use for a push key.
    deps: [env]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile "*" down

  reset:
    desc: "Stop every dev service AND wipe the volumes — next `dev:up` starts from a blank slate"
    deps: [env]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile "*" down -v
