version: "3"

# Task echoes multi-line scripts verbatim; the scripts below print what matters themselves.
silent: true

# Local development environment (§12). Compose and the Che devfile expose the same services,
# ports and credentials, so one config/dev.toml works in both; compose tasks no-op in Che.

vars:
  # `ENGINE=` wins; otherwise docker if present, else podman (same as build.yaml).
  ENGINE:
    sh: |
      if [ -n "${ENGINE:-}" ]; then echo "$ENGINE"
      elif command -v docker >/dev/null 2>&1; then echo docker
      else echo podman
      fi
  COMPOSE: '{{.ENGINE}} compose -f dev/compose.yaml --env-file dev/.env --env-file dev/.env.local'
  CHE_GUARD: |
    if [ -n "$DEVWORKSPACE_ID" ]; then
      echo "Eclipse Che workspace detected — the sidecars come from devfile.yaml, nothing to do."
      exit 0
    fi
  # The inverse of CHE_GUARD: the `:public` tasks need the Che `url` CLI and its env vars (§12.1).
  REQUIRE_CHE: |
    if [ -z "${DEVWORKSPACE_ID:-}" ]; then
      echo "Not an Eclipse Che workspace — \`url\` has nothing to resolve. Use the non-\`:public\` task instead." >&2
      exit 1
    fi

tasks:
  setup:
    desc: "Create what a fresh clone needs before the stack runs: Authentik credentials, VAPID and federation keys."
    # The single entry point; each step is idempotent and guarded by its own `status:`.
    cmds:
      - task: env
      - task: vapid
      - task: federation-key

  env:
    desc: "Create dev/.env.local with freshly generated Authentik bootstrap credentials (gitignored)"
    status:
      - test -f dev/.env.local
    cmds:
      - cmd: |
          set -eu
          gen() { LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom 2>/dev/null | head -c "$1" || true; }
          pw=$(gen 32)
          tok=$(gen 60)
          cat > dev/.env.local <<EOF
          # Generated by \`task dev:env\` — NEVER commit this file (design §12.5).
          # Authentik bootstrap credentials; the throwaway alice/bob accounts stay in dev/.env.
          AUTHENTIK_BOOTSTRAP_PASSWORD=$pw
          AUTHENTIK_BOOTSTRAP_TOKEN=$tok
          EOF
          echo "dev/.env.local created."
          echo "  Authentik admin : akadmin / $pw"
          echo "  Bootstrap token : $tok"
          echo "This is the only time these are printed."

  vapid:
    desc: "Mint the P-256 VAPID key that [push.webpush] reads, into dev/secrets/ (gitignored)"
    # Rust rather than openssl: no assumed tool, and it prints the browser's applicationServerKey (§12.5).
    status:
      - test -f dev/secrets/vapid.pem
    cmds:
      - cargo run --quiet -p xtask -- vapid-key --output dev/secrets/vapid.pem

  federation-key:
    desc: "Mint the Ed25519 key that [federation] signs CI tokens with, into dev/secrets/ (gitignored)"
    # Must exist before boot: replicas must verify each other's signatures (§11 `[ha]`).
    status:
      - test -f dev/secrets/federation.pem
    cmds:
      - cargo run --quiet -p xtask -- federation-key --output dev/secrets/federation.pem

  up:
    desc: "Start the everyday dev stack: Postgres + RustFS (~20s, no Authentik)"
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} up -d --wait
          echo
          echo "Containers are up. The identity provider is a process, not a container:"
          echo "  task dev:oidc    # in another terminal, on :9110"

  core:
    desc: "Start only Postgres and RustFS, for domain work with the in-memory TokenVerifier."
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} up -d --wait postgres rustfs

  oidc:
    desc: "Run the development identity provider on :9110 (alice/bob/carol, password weebo-dev)."
    # A workspace binary, not a container (ADR-0014). In Che, use `dev:oidc:public` instead (§12.1).
    cmds:
      - cargo run -p notify-oidc-mock -- --identities dev/oidc-mock/identities.toml

  oidc:public:
    desc: "Run the identity provider issuing tokens as this Che workspace's public route, instead of localhost (§12.1)"
    cmds:
      - cmd: |
          {{.REQUIRE_CHE}}
          issuer=$(url oidc); issuer=${issuer%/}
          web=$(url web); web=${web%/}
          echo "issuer: $issuer"
          echo "extra redirect_uri: $web/auth/callback"
          WNK_OIDC_MOCK_ISSUER="$issuer" \
          WNK_OIDC_MOCK_EXTRA_REDIRECT_URI="$web/auth/callback" \
          WNK_OIDC_MOCK_EXTRA_POST_LOGOUT_REDIRECT_URI="$web/" \
          cargo run -p notify-oidc-mock -- --identities dev/oidc-mock/identities.toml

  auth:
    desc: "Add real Authentik (profile `authentik`) for work on the OIDC flow itself."
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile authentik up -d --wait
          echo
          echo "Authentik is up. Point the server at it with:"
          echo "  WNK_OIDC__ISSUER=http://localhost:9100/application/o/weebo-notify/ task dev:run"

  sinks:
    desc: "Add Mailpit (profile `sinks`) to exercise the email sink, UI on http://localhost:8025."
    deps: [setup]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile sinks up -d --wait

  dex:
    desc: "Add Dex (profile `dex`), the no-groups leg of the identity matrix (T29), on :5556."
    # For reproducing a red `oidc-compat` run; the config's password is generated per run (§3.2).
    cmds:
      - cmd: |
          set -eu
          # No guard at the top: the config must be rendered in both worlds; only bringing it up differs.
          dev/dex/render.sh dev/dex/config.local.yaml > dev/dex/env.local
          if [ -n "${DEVWORKSPACE_ID:-}" ]; then
            echo "Config rendered. The sidecar is already scheduled, so start the"
            echo "process in it rather than a container here (devfile.yaml):"
            echo "  run-dex          # from the Che command palette, or:"
            echo "  kubectl exec -c dex \$HOSTNAME -- dex serve \$PWD/dev/dex/config.local.yaml"
            echo
            echo "If that stops on a permission error, the rendered file is 0600 and"
            echo "the sidecar runs as another user:  chmod 644 dev/dex/config.local.yaml"
          else
            {{.COMPOSE}} --profile dex up -d --wait
            echo
            echo "Dex is up."
          fi
          echo
          echo "Run the compatibility leg against it with:"
          echo "  set -a; . dev/dex/env.local; set +a; task test:oidc-compat"

  seed:
    desc: "Seed the environment (idempotent): sqlx migrations, RustFS bucket, Authentik blueprint"
    cmds:
      - dev/seed/seed.sh

  argocd-key:
    desc: "Mint the bot-argocd API key once into dev/secrets/ (needs `task dev:oidc` and `task dev:run` running)."
    # Not a `setup` dependency: it calls the running server. Persisting the once-shown key stops
    # every restart minting a fresh one for the reconciled service account (§5.2, §5.2bis).
    status:
      - test -f dev/secrets/bot-argocd.key
    cmds:
      - cmd: |
          set -eu
          user="${WNK_TUI_USER:-alice}"
          verifier=$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 64)
          challenge=$(printf '%s' "$verifier" | openssl dgst -sha256 -binary | base64 | tr '+/' '-_' | tr -d '=')

          request=$(curl -sS "http://localhost:9110/authorize?response_type=code&client_id=weebo-notify&redirect_uri=http://localhost:5173/auth/callback&scope=openid&code_challenge=$challenge&code_challenge_method=S256" \
            | grep -oP 'name="request" value="\K[^"]+') || {
            echo "Could not reach the oidc mock on :9110 — is \`task dev:oidc\` running?" >&2
            exit 1
          }
          code=$(curl -sS -i -d "request=$request&username=$user&password=weebo-dev" http://localhost:9110/authorize \
            | grep -ioP 'location:.*code=\K[^&"'"'"'\r\n ]+')
          token=$(curl -sS -d "grant_type=authorization_code&code=$code&code_verifier=$verifier&redirect_uri=http://localhost:5173/auth/callback&client_id=weebo-notify" \
            http://localhost:9110/token | grep -oP '"access_token":\s*"\K[^"]+')

          # $user must hold `manage` on ci-infra (§5.2): alice does, per config/dev.toml.
          secret=$(curl -sS -X POST http://localhost:8080/api/v1/apikeys \
            -H "authorization: Bearer $token" \
            -H "content-type: application/json" \
            -d '{"owner":{"owner":"service_account","id":"bot-argocd"},"channels":["ci-infra"],"scopes":["publish","subscribe"]}') || {
            echo "Could not reach the server on :8080 — is \`task dev:run\` running?" >&2
            exit 1
          }
          printf '%s' "$secret" | grep -oP '"secret":\s*"\K[^"]+' > dev/secrets/bot-argocd.key || {
            echo "Unexpected response from POST /apikeys:" >&2
            echo "$secret" >&2
            exit 1
          }
          echo "dev/secrets/bot-argocd.key created — this is the only time that secret is shown."

  run:
    desc: "Run the weebo-notify server against config/dev.toml (outside any container)"
    # `config/dev.toml` declares `[push.webpush]`, and the server refuses an unreadable key.
    deps: [setup]
    cmds:
      - cargo run -p notify-server -- --config config/dev.toml

  run:public:
    desc: "Run the server wired to this Che workspace's public OIDC issuer and web origin (§12.1)."
    deps: [setup]
    cmds:
      - cmd: |
          {{.REQUIRE_CHE}}
          issuer=$(url oidc); issuer=${issuer%/}
          web=$(url web); web=${web%/}
          echo "oidc issuer : $issuer"
          echo "cors origin : $web"
          WNK_OIDC__ISSUER="$issuer" \
          # The whole list: this replaces `config/dev.toml`'s origins (including `tauri://localhost`).
          WNK_SERVER__CORS_ORIGINS="[\"http://localhost:5173\",\"http://localhost:8080\",\"tauri://localhost\",\"http://tauri.localhost\",\"$web\"]" \
          cargo run -p notify-server -- --config config/dev.toml

  web:
    desc: "Run the Vite dev server for the web frontend (http://localhost:5173)"
    # `web:env` first: Vite serves `web/public/env.js` as-is.
    deps: [web:env]
    cmds:
      - pnpm -C web dev

  cli:
    desc: "Open the TUI against the local dev server, minting a throwaway token unless WNK_TOKEN is set."
    # The profile defaults to localhost:8080 (§9.1); this mints a token for WNK_TUI_USER from the
    # dev identities via the same PKCE flow a browser runs.
    cmds:
      - cmd: |
          set -eu
          if [ -n "${WNK_TOKEN:-}" ]; then
            cargo run -p notify-cli -- watch
            exit 0
          fi

          user="${WNK_TUI_USER:-alice}"
          verifier=$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 64)
          challenge=$(printf '%s' "$verifier" | openssl dgst -sha256 -binary | base64 | tr '+/' '-_' | tr -d '=')

          request=$(curl -sS "http://localhost:9110/authorize?response_type=code&client_id=weebo-notify&redirect_uri=http://localhost:5173/auth/callback&scope=openid&code_challenge=$challenge&code_challenge_method=S256" \
            | grep -oP 'name="request" value="\K[^"]+') || {
            echo "Could not reach the oidc mock on :9110 — is \`task dev:oidc\` running?" >&2
            exit 1
          }
          code=$(curl -sS -i -d "request=$request&username=$user&password=weebo-dev" http://localhost:9110/authorize \
            | grep -ioP 'location:.*code=\K[^&"'"'"'\r\n ]+')
          token=$(curl -sS -d "grant_type=authorization_code&code=$code&code_verifier=$verifier&redirect_uri=http://localhost:5173/auth/callback&client_id=weebo-notify" \
            http://localhost:9110/token | grep -oP '"access_token":\s*"\K[^"]+')

          echo "watching as $user"
          WNK_TOKEN="$token" cargo run -p notify-cli -- watch

  # `web/public/env.js` is served as-is, so render it before `web` starts. Che is detected via
  # DEVWORKSPACE_ID and its routes come from `url`; elsewhere the committed values are written.
  # In Che this dirties the tree: `git checkout -- web/public/env.js` restores it.
  web:env:
    desc: "Render web/public/env.js for wherever this runs (Che routes or compose defaults)."
    cmds:
      - cmd: |
          set -eu
          if [ -n "${DEVWORKSPACE_ID:-}" ]; then
            api=$(url server); api=${api%/}
            issuer=$(url oidc); issuer=${issuer%/}
            where="Eclipse Che"
          else
            api="http://localhost:8080"
            issuer="http://localhost:9110"
            where="localhost"
          fi
          cat > web/public/env.js <<JS
          // Read by \`src/config.ts\` at startup, before the app bundle runs (design §11,
          // ADR-0021). WRITTEN BY \`task dev:web:env\`, which \`task dev:web\` depends on —
          // so edits here last until the next \`task dev:web\` and no longer. Committed
          // with the values the local dev stack serves, which is what that task writes on
          // any machine that is not an Eclipse Che workspace (§12.1).
          //
          // A real deployment does not edit this file: its image renders one just like it,
          // at container boot, from WNK_API_BASE_URL/WNK_OIDC_ISSUER/WNK_OIDC_CLIENT_ID/
          // WNK_ATTACHMENT_ORIGIN (\`web/nginx/docker-entrypoint.d/05-runtime-config.sh\`).
          // This one only ever ships inside a \`pnpm dev\`/\`pnpm build && pnpm preview\` run.
          //
          // There is no secret in this file, by construction: the OIDC client is public and
          // uses Authorization Code + PKCE (§5.1).
          window.__ENV__ = {
            apiBaseUrl: "$api",
            oidcIssuer: "$issuer",
            oidcClientId: "weebo-notify",
          };
          JS
          echo "web/public/env.js -> $api / $issuer  ($where)"

  docs:
    desc: "Run the Fumadocs documentation site in dev mode (http://localhost:3000)"
    cmds:
      - pnpm -C docs dev

  logs:
    desc: "Follow the logs of every dev service"
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} logs -f

  logs:tail:
    desc: "Print the last N lines (TAIL, default 50) of every dev service and exit"
    # The non-following variant for CI, which wants the tail of a failed stack without hanging.
    vars:
      TAIL: '{{.TAIL | default "50"}}'
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile authentik --profile dex --profile sinks logs --tail {{.TAIL}}

  down:
    desc: "Stop every dev service, keeping the volumes"
    # `env`, not `setup`: compose needs the env file; teardown needs no keys.
    deps: [env]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile "*" down

  reset:
    desc: "Stop every dev service and wipe the volumes for a blank-slate `dev:up`."
    deps: [env]
    cmds:
      - cmd: |
          {{.CHE_GUARD}}
          {{.COMPOSE}} --profile "*" down -v
