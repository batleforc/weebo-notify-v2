version: "3"

# Shipped artefacts: the web bundle and the two images (image tasks need a container engine,
# which Che lacks; CI and podman users run the same commands).

vars:
  # Overridable: the release workflow passes its own.
  IMAGE_REPO: '{{.IMAGE_REPO | default "ghcr.io/batleforc/weebo-notify"}}'
  IMAGE_TAG: '{{.IMAGE_TAG | default "dev"}}'
  # An explicit `ENGINE=` wins; otherwise docker if present, else podman.
  ENGINE:
    sh: |
      if [ -n "${ENGINE:-}" ]; then echo "$ENGINE"
      elif command -v docker >/dev/null 2>&1; then echo docker
      else echo podman
      fi

tasks:
  web:
    desc: "Build the deployable web bundle, identical for every deployment (ADR-0021)."
    # `vite build` also checks the inline-script hash and emits `csp-template.txt`.
    cmds:
      - pnpm -C web build

  image:
    desc: "Build the server image (override IMAGE_REPO/IMAGE_TAG/ENGINE; needs a container engine)."
    # No `--build-arg`: configuration is read at runtime (§11).
    cmds:
      - "{{.ENGINE}} build -f Containerfile -t {{.IMAGE_REPO}}:{{.IMAGE_TAG}} ."

  web:image:
    desc: "Build the web bundle image (override IMAGE_REPO/IMAGE_TAG/ENGINE; needs a container engine)."
    # No `--build-arg`: origin, issuer and client id are read at boot (ADR-0021).
    cmds:
      - "{{.ENGINE}} build -f web/Containerfile -t {{.IMAGE_REPO}}-web:{{.IMAGE_TAG}} web"
