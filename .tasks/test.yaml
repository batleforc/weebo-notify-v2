version: "3"

vars:
  # Honest coverage scope (design §3.2): generated code is excluded from the
  # measurement — it is not ours to test, and counting it would inflate the number
  # in exactly the direction that hides gaps in the code we do write.
  COVERAGE_EXCLUDE: 'crates/notify-client-api/src/generated\.rs'

tasks:
  default:
    desc: "Run the fast test suite: domain/app unit tests (no containers) + web unit tests"
    cmds:
      - task: unit
      - task: web

  unit:
    desc: "Rust unit tests — pure domain and use cases, no I/O, sub-second (scenarios T1-T6)"
    cmds:
      - cargo nextest run --workspace -E 'not test(/^e2e::/)'

  critical:
    desc: "The `critical` suite (design §3.4) — blocking on PR and in the release gate, never skipped"
    cmds:
      - cargo nextest run --workspace -P critical

  e2e:
    desc: "End-to-end and adapter tests: needs WNK_TEST_DATABASE_URL (or DATABASE_URL) for Postgres"
    # The adapter suites skip cleanly with no database rather than failing, so this
    # is green on a laptop that has not started the stack — and the `e2e` CI job
    # always sets the variable, so nothing is silently skipped where it matters.
    cmds:
      - cargo nextest run --workspace -E 'test(/^e2e::/)' --no-fail-fast

  oidc-compat:
    desc: "The identity-provider compatibility suite (§3.2, T29) — set WNK_TEST_OIDC_PROVIDER to pick one"
    # The one independent reading of OIDC this project gets (§15). Defaults to the
    # in-process mock, which is what makes it runnable on a laptop; naming an
    # external provider without an issuer FAILS rather than skips, on purpose — a
    # green tick meaning "no provider was reachable" is the failure mode this suite
    # exists to prevent.
    cmds:
      - cargo nextest run -p notify-oidc --test oidc_compat --no-fail-fast

  web:
    desc: "Web unit tests (vitest) — skipped while web/ does not exist yet"
    cmds:
      - cmd: |
          if [ ! -f web/package.json ]; then
            echo "web/ not bootstrapped yet — skipping"
            exit 0
          fi
          pnpm -C web test:run

  cover:
    desc: "Full suite with coverage; emits Rust + web LCOV and a merged HTML report in target/coverage"
    cmds:
      - mkdir -p target/coverage
      # One single run of the suite produces both the test results and the coverage (design §3.2).
      - cargo llvm-cov nextest --workspace --ignore-filename-regex '{{.COVERAGE_EXCLUDE}}' --lcov --output-path target/coverage/rust.lcov
      - cmd: |
          if [ -f web/package.json ]; then
            pnpm -C web test:coverage
            cp web/coverage/lcov.info target/coverage/web.lcov
          fi
      - cargo llvm-cov report --ignore-filename-regex '{{.COVERAGE_EXCLUDE}}' --html --output-dir target/coverage/html

  cover:gate:
    desc: "Enforce the coverage gates on an existing LCOV report — usage: task test:cover:gate -- origin/main"
    cmds:
      - cargo run --quiet -p xtask -- coverage-gate --lcov target/coverage/rust.lcov {{if .CLI_ARGS}}--base {{.CLI_ARGS}}{{end}}

  cover:domain:
    desc: "Coverage of notify-domain + notify-app only — the scope the CI gate actually enforces (>=90%)"
    cmds:
      - cargo llvm-cov nextest -p notify-domain -p notify-app --summary-only
