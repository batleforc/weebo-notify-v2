version: "3"

vars:
  # Generated code is excluded from coverage (§3.2): it isn't ours to test.
  COVERAGE_EXCLUDE: 'crates/notify-client-api/src/generated\.rs'

tasks:
  default:
    desc: "Run the fast suite: domain/app unit tests and web unit tests, no containers."
    cmds:
      - task: unit
      - task: web

  unit:
    desc: "Run the pure domain and use-case Rust unit tests (T1-T6), no I/O."
    cmds:
      - cargo nextest run --workspace -E 'not test(/^e2e::/)'

  critical:
    desc: "Run the `critical` suite (§3.4) that blocks PRs and releases."
    cmds:
      - cargo nextest run --workspace -P critical

  e2e:
    desc: "Run end-to-end and adapter tests against Postgres (WNK_TEST_DATABASE_URL or DATABASE_URL)."
    # Adapter suites skip without a database; the `e2e` CI job always sets it.
    cmds:
      - cargo nextest run --workspace -E 'test(/^e2e::/)' --no-fail-fast

  browser:
    desc: "Run the browser E2E suite against a running stack; WNK_E2E_* point it at a deployed release."
    cmds:
      - pnpm -C web exec playwright test

  browser:ci:
    desc: "Boot the self-contained E2E stack (config/e2e.toml: server, oidc-mock, built web) and run the browser suite."
    cmds:
      - cmd: |
          set -euo pipefail
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          cargo build -p notify-server -p notify-oidc-mock
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
          [ -n "${WNK_E2E_CHROMIUM:-}" ] || pnpm -C web exec playwright install --with-deps chromium
          ./target/debug/oidc-mock --identities dev/oidc-mock/identities.toml &
          ./target/debug/notify-server --config config/e2e.toml &
          pnpm -C web exec vite preview --port 5173 --strictPort &
          for url in http://localhost:9110/.well-known/openid-configuration http://localhost:8080/readyz http://localhost:5173/; do
            timeout 120 sh -c "until curl -fsS -o /dev/null $url; do sleep 1; done"
          done
          pnpm -C web exec playwright test

  oidc-compat:
    desc: "Run the identity-provider compatibility suite (§3.2, T29); WNK_TEST_OIDC_PROVIDER picks one."
    # Defaults to the in-process mock; an external provider without an issuer fails rather than skips.
    cmds:
      - cargo nextest run -p notify-oidc --test oidc_compat --no-fail-fast

  web:
    desc: "Run the web unit tests (vitest)."
    cmds:
      - cmd: |
          if [ ! -f web/package.json ]; then
            echo "web/ not bootstrapped yet — skipping"
            exit 0
          fi
          pnpm -C web test:run

  cover:
    desc: "Full suite with coverage; emits Rust + web LCOV and a merged HTML report in target/coverage"
    cmds:
      - mkdir -p target/coverage
      # One single run of the suite produces both the test results and the coverage (design §3.2).
      - cargo llvm-cov nextest --workspace --ignore-filename-regex '{{.COVERAGE_EXCLUDE}}' --lcov --output-path target/coverage/rust.lcov
      - cmd: |
          if [ -f web/package.json ]; then
            pnpm -C web test:coverage
            cp web/coverage/lcov.info target/coverage/web.lcov
          fi
      - cargo llvm-cov report --ignore-filename-regex '{{.COVERAGE_EXCLUDE}}' --html --output-dir target/coverage/html

  cover:gate:
    desc: "Enforce the coverage gates on an existing LCOV report (task test:cover:gate -- origin/main)."
    cmds:
      - cargo run --quiet -p xtask -- coverage-gate --lcov target/coverage/rust.lcov {{if .CLI_ARGS}}--base {{.CLI_ARGS}}{{end}}

  cover:domain:
    desc: "Print the domain+app coverage figure exactly as the CI gate (>=90%) measures it."
    # Runs the real gate: line coverage over a workspace run, not `-p` region coverage.
    cmds:
      - mkdir -p target/coverage
      - cargo llvm-cov nextest --workspace --ignore-filename-regex '{{.COVERAGE_EXCLUDE}}' --lcov --output-path target/coverage/rust.lcov
      - cargo run --quiet -p xtask -- coverage-gate --lcov target/coverage/rust.lcov
