version: "3"

silent: true

# Driving the Chrome sidecar the devfile schedules (§12.4) over CDP (`dev/browser/cdp.mjs`,
# no dependency). Humans can look through the Che `novnc` route; outside Che these no-op.

vars:
  CDP: curl -sf -o /dev/null http://127.0.0.1:9222/json/version
  # `sidecar-app` exists only in that image, hence `kubectl exec`. Top-level vars must be
  # unique across `.tasks/`: Task resolves duplicates across includes nondeterministically.
  BROWSER_APP: kubectl exec "$HOSTNAME" -c browser -- sidecar-app

  # Chrome is parked at boot (NO_START); tasks that need it wake it. `check` doesn't: a status
  # command must not change what it reports.
  NEED_BROWSER: |
    if ! {{.CDP}}; then
      if [ -z "${DEVWORKSPACE_ID:-}" ]; then
        echo "No browser on 127.0.0.1:9222, and this is not an Eclipse Che workspace —"
        echo "use your own browser (§12.4)."
        exit 0
      fi
      echo "Chrome is parked (NO_START) — starting it."
      {{.BROWSER_APP}} start >/dev/null || exit 1
      for _ in $(seq 1 60); do
        {{.CDP}} && break
        sleep 0.5
      done
      if ! {{.CDP}}; then
        echo "Chrome did not answer on 9222 within 30s. \`kubectl logs $HOSTNAME -c browser\` says why."
        exit 1
      fi
    fi

tasks:
  check:
    desc: "Report whether the browser sidecar is reachable and which page it shows, without starting it."
    cmds:
      - cmd: |
          if [ -z "${DEVWORKSPACE_ID:-}" ]; then
            echo "Not in an Eclipse Che workspace — use your own browser (§12.4)."
            exit 0
          fi
          echo "sidecar: $({{.BROWSER_APP}} status 2>&1)"
          if ! {{.CDP}}; then
            echo "No browser on 127.0.0.1:9222 — \`task browser:start\` wakes it."
            exit 0
          fi
          curl -s http://127.0.0.1:9222/json/version | grep -o '"Browser": *"[^"]*"'
          node dev/browser/cdp.mjs where

  start:
    desc: "Wake the parked Chrome, wait for CDP, and print its noVNC route."
    cmds:
      - cmd: |
          {{.NEED_BROWSER}}
          curl -s http://127.0.0.1:9222/json/version | grep -o '"Browser": *"[^"]*"'
          echo "noVNC: $(url novnc)"
          echo "password: $(cat /projects/.sidecar/vnc-password-browser.txt 2>/dev/null || echo '/projects/.sidecar/vnc-password-browser.txt')"

  pwd:
    desc: "Print the noVNC route and password for looking through this browser."
    # The plaintext password is dropped on the shared `/projects/.sidecar/` (`/tmp/vnc.pass` is hashed).
    cmds:
      - cmd: |
          if [ -z "${DEVWORKSPACE_ID:-}" ]; then
            echo "Not in an Eclipse Che workspace — no sidecar, no route, no password."
            exit 0
          fi
          echo "noVNC:    $(url novnc)"
          echo "password: $(cat /projects/.sidecar/vnc-password-browser.txt)"

  stop:
    desc: "Park Chrome again, keeping the VNC stack and route up (§12.4)."
    cmds:
      - cmd: |
          if [ -z "${DEVWORKSPACE_ID:-}" ]; then
            echo "Not in an Eclipse Che workspace — nothing to park."
            exit 0
          fi
          {{.BROWSER_APP}} stop

  open:
    desc: "Point the browser at a URL (task browser:open URL=http://localhost:5173/)."
    cmds:
      - cmd: |
          {{.NEED_BROWSER}}
          node dev/browser/cdp.mjs open "{{.URL}}"
    requires:
      vars: [URL]

  shot:
    desc: "Screenshot the current page (task browser:shot OUT=/tmp/inbox.png)."
    # Separate from `open`: a Vue app mounts after load, so shoot again if it caught a skeleton.
    cmds:
      - cmd: |
          {{.NEED_BROWSER}}
          node dev/browser/cdp.mjs shot "{{.OUT}}"
    requires:
      vars: [OUT]

  eval:
    desc: "Evaluate JavaScript in the page (task browser:eval JS='location.href')."
    cmds:
      - cmd: |
          {{.NEED_BROWSER}}
          node dev/browser/cdp.mjs eval "{{.JS}}"
    requires:
      vars: [JS]

  logs:
    desc: "Drain the page's console and errors for a second (where CSP refusals show up)."
    cmds:
      - cmd: |
          {{.NEED_BROWSER}}
          node dev/browser/cdp.mjs logs
