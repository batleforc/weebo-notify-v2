version: "3"

# Plain targets apply fixes (pre-commit hook); `:check` targets only report (CI).

tasks:
  default:
    desc: "Lint and format Rust, web and docs, applying fixes (pre-commit hook)."
    cmds:
      - task: rust
      - task: web
      - task: docs

  check:
    desc: "Lint Rust, web and docs read-only, failing instead of fixing (CI)."
    cmds:
      - task: rust:check
      - task: web:check
      - task: docs:check

  rust:
    desc: "Format and lint the cargo workspace (fmt applies, clippy denies warnings)"
    cmds:
      - cargo fmt --all
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust:check:
    desc: "Read-only Rust lint: fails on unformatted code or any clippy warning"
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  web:
    desc: "Lint and format the web frontend, applying fixes"
    cmds:
      - cmd: |
          if [ ! -f web/package.json ]; then echo "web/ not bootstrapped yet — skipping"; exit 0; fi
          pnpm -C web format

  web:check:
    desc: "Read-only lint of the web frontend"
    cmds:
      - cmd: |
          if [ ! -f web/package.json ]; then echo "web/ not bootstrapped yet — skipping"; exit 0; fi
          pnpm -C web lint
          pnpm -C web types:check

  docs:
    desc: "Lint and format the Fumadocs site, applying fixes"
    cmds:
      - pnpm -C docs format

  docs:check:
    desc: "Read-only lint and type-check of the Fumadocs site"
    cmds:
      - pnpm -C docs lint
      - pnpm -C docs types:check
