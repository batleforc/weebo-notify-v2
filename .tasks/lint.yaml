version: "3"

# Plain targets apply fixes (pre-commit hook); `:check` targets only report (CI).

tasks:
  default:
    desc: "Lint and format Rust, web and docs, applying fixes (pre-commit hook)."
    cmds:
      - task: rust
      - task: web
      - task: docs

  check:
    desc: "Lint Rust, web and docs read-only, failing instead of fixing (CI)."
    cmds:
      - task: rust:check
      - task: web:check
      - task: docs:check
      - task: migrations
      - task: ignore-files

  migrations:
    desc: "Fail on a destructive migration (DROP/RENAME/ALTER TYPE) that lacks an `-- allow-destructive: <why>` marker (expand/contract rule)"
    # During a rolling update — and before it, with the Helm migration Job — the
    # PREVIOUS version runs against the NEW schema (runbooks.mdx, expand/contract).
    # A column dropped or renamed in the same release that stops using it breaks
    # those old pods mid-rollout, and makes rolling the image back impossible.
    # Destructive steps belong in a later release, once no running version reads
    # the object; the marker is where that later release says why it is safe.
    # Comments are stripped first, so prose about a rename never trips it.
    cmds:
      - cmd: |
          set -eu
          bad=0
          for f in crates/notify-adapters/*/migrations/*.sql; do
            [ -f "$f" ] || continue
            grep -q -- '-- allow-destructive:' "$f" && continue
            if sed 's/--.*$//' "$f" | grep -qiE 'drop[[:space:]]+(column|table)|(^|[^a-z_])rename([^a-z_]|$)|alter[[:space:]]+column[^;]*[[:space:]]type[[:space:]]'; then
              echo "destructive statement without '-- allow-destructive: <reason>': $f" >&2
              bad=1
            fi
          done
          [ "$bad" = 0 ] && echo "migrations: expand-only (or explicitly allowed)"
          exit "$bad"

  ignore-files:
    desc: "Fail when .dockerignore drifts from .containerignore (root and web/) — BuildKit reads only the former"
    cmds:
      - cmp .containerignore .dockerignore
      - cmp web/.containerignore web/.dockerignore

  rust:
    desc: "Format and lint the cargo workspace (fmt applies, clippy denies warnings)"
    cmds:
      - cargo fmt --all
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      # fuzz/ is its own workspace, invisible to clippy: this keeps its targets compiling.
      - task: :fuzz:check

  rust:check:
    desc: "Read-only Rust lint: fails on unformatted code or any clippy warning"
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      # fuzz/ is its own workspace, invisible to clippy: this keeps its targets compiling.
      - task: :fuzz:check

  web:
    desc: "Lint and format the web frontend, applying fixes"
    cmds:
      - cmd: |
          if [ ! -f web/package.json ]; then echo "web/ not bootstrapped yet — skipping"; exit 0; fi
          pnpm -C web format

  web:check:
    desc: "Read-only lint of the web frontend"
    cmds:
      - cmd: |
          if [ ! -f web/package.json ]; then echo "web/ not bootstrapped yet — skipping"; exit 0; fi
          pnpm -C web lint
          pnpm -C web types:check

  docs:
    desc: "Lint and format the Fumadocs site, applying fixes"
    cmds:
      - pnpm -C docs format

  docs:check:
    desc: "Read-only lint and type-check of the Fumadocs site"
    cmds:
      - pnpm -C docs lint
      - pnpm -C docs types:check
