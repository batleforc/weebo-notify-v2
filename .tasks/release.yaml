version: "3"

# Release (§3.2bis): `cog bump` versions, changelogs and syncs; pushing the v* tag runs the
# whole pipeline. A tag never moves: a failed release gets a fix and a new tag.

tasks:
  default:
    desc: "Cut a release with cog bump --auto, then push the tag yourself."
    cmds:
      - task: check
      - cog bump --auto
      - cmd: |
          echo
          echo "Tag created locally. Push it to trigger the release pipeline:"
          echo "  git push --follow-tags"

  pre:
    desc: 'Cut a pre-release (task release:pre -- rc) without touching `latest`.'
    cmds:
      - task: check
      - cog bump --auto --pre {{.CLI_ARGS | default "rc"}}
      - cmd: |
          echo
          echo "Pre-release tag created. Push it with:"
          echo "  git push --follow-tags"

  check:
    desc: "Run the release pipeline's gates before creating any tag."
    cmds:
      - task: :lint
      - task: :recu
      - git diff --exit-code
      - task: :test:critical
