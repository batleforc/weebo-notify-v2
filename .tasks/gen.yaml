version: "3"

# Deterministic, committed output (§3.2): CI runs `task recu` then `git diff --exit-code`.

vars:
  OPENAPI: docs/content/docs/api/openapi.json

tasks:
  default:
    desc: "Regenerate the OpenAPI spec, the Rust and TS clients, and the desktop icons."
    cmds:
      - task: openapi
      - task: client:rust
      - task: client:ts
      - task: icons

  openapi:
    desc: "Export the OpenAPI spec from the utoipa annotations (no server boot required)"
    cmds:
      - mkdir -p $(dirname {{.OPENAPI}})
      - cargo run --quiet -p notify-server -- dump-openapi --output {{.OPENAPI}}

  client:rust:
    desc: "Regenerate the Rust client crate notify-client-api from the OpenAPI spec (progenitor, ADR-0009)"
    cmds:
      # xtask lowers utoipa's OpenAPI 3.1 to the 3.0 subset progenitor parses; the spec stays 3.1.
      - cargo run --quiet -p xtask -- client-rust --spec {{.OPENAPI}}

  client:ts:
    desc: "Regenerate the TypeScript client consumed by the web frontend (HeyApi + axios, ADR-0009)"
    cmds:
      - cmd: |
          if [ ! -f web/package.json ]; then
            echo "web/ not bootstrapped yet — skipping"
            exit 0
          fi
          pnpm -C web run generate:client

  # No `sqlx prepare` step: persistence-pg doesn't use `query!`; its SQL is covered by the
  # Postgres conformance tests (`task test:e2e`).

  icons:
    desc: "Rasterise the desktop icons from their SVG sources (§10bis.3ter)."
    # Derived and committed like the clients: SVG sources stay reviewable, Tauri loads the PNGs.
    cmds:
      - cargo run --quiet -p xtask -- icons
