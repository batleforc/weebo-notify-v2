version: "3"

# The Tauri desktop shell (design §10bis.3, milestone M5).
#
# `doctor` answers, in one command and before anybody spends an afternoon on a link
# error, whether *this machine* can build the shell at all — because on Linux Tauri
# v2 links against a GTK/WebKit stack that is neither vendored nor installable by
# `mise`.
#
# `build` and `dev` exist since M5 was started ahead of that stack: the shell is
# written in `web/src-tauri`, outside the cargo workspace, and **has never been
# compiled by anything**. Both tasks run the doctor first, so the answer on a machine
# without the libraries is a paragraph rather than a wall of `pkg-config` output.
#
# What *is* built and tested everywhere is the half that does not need a webview:
# `notify_client_core::tray` (§10bis.3ter) and `::deeplink` (§10bis.3quater) are
# ordinary library code under `task test`.

vars:
  # Reported by `doctor`, reused as a gate by the two below. Duplicating the library
  # list would be two lists to keep in step, so this asks the task instead.
  NEED_STACK: |
    if ! pkg-config --exists webkit2gtk-4.1 2>/dev/null; then
      task tauri:doctor
      echo
      echo "Nothing was built. See design §14.1 (M5) and §14.4 (D13)."
      exit 0
    fi

tasks:
  doctor:
    desc: "Say whether this machine can build the Tauri shell, and what is missing (§10bis.3)"
    # Why this exists as a task rather than as a paragraph in a README: the answer
    # differs per machine and changes when an image is rebuilt, so a sentence in a
    # document is out of date the moment somebody fixes their environment. A check
    # that runs is never out of date.
    #
    # It reports rather than fails: `task tauri:doctor` on a machine that cannot
    # build is answering its question correctly, and an exit code of 1 would make
    # it unusable from a shell with `set -e`.
    silent: true
    cmds:
      - cmd: |
          echo "Tauri v2 · Linux build prerequisites"
          echo

          missing=0
          for lib in webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 gtk+-3.0; do
            if pkg-config --exists "$lib" 2>/dev/null; then
              printf '  %-24s ok\n' "$lib"
            else
              printf '  %-24s MISSING\n' "$lib"
              missing=$((missing + 1))
            fi
          done

          echo
          if [ "$missing" -eq 0 ]; then
            echo "Everything the shell links against is here."
            exit 0
          fi

          cat <<'EOF'
          This machine cannot build the desktop shell.

          These are system libraries: `mise` does not carry them (it ships tools,
          not C libraries), and installing them needs root — which a Che workspace
          does not give you, by design.

          The fix therefore belongs in the dev *image*, not in this repository, and
          the image is built in batleforc/WeeboDevImage. For a Debian or Ubuntu
          base, the packages are:

              libwebkit2gtk-4.1-dev
              libjavascriptcoregtk-4.1-dev
              libsoup-3.0-dev
              libgtk-3-dev
              libayatana-appindicator3-dev   # the tray (§10bis.3ter)
              librsvg2-dev                   # icon rendering
              patchelf                       # what the AppImage bundler calls

          Once the image ships them, `devfile.yaml` needs no change: the `tools`
          container inherits from the parent, so a rebuilt tag is the whole fix.

          See design §12.4 and §14.1 (M5).
          EOF

  build:
    desc: "Build the desktop shell — needs the GTK/WebKit stack (§10bis.3, M5)"
    cmds:
      - cmd: |
          {{.NEED_STACK}}
          # `--no-default-features` is not used: the shell wants the tray, and a
          # build that quietly dropped it would produce an app that runs and has no
          # way to live in the background (§10bis.3ter).
          cd web/src-tauri && cargo build --release

  bundle:
    desc: "Package the desktop shell as a .deb and an AppImage (§10bis.3, M5)"
    # Distinct from `build` above, which compiles and stops. That is the fast loop —
    # it answers "does it still build" without spending minutes on packaging. This is
    # the one that produces something somebody can install, and it is `cargo tauri
    # build` rather than `cargo build` because the bundlers live in the Tauri CLI.
    #
    # The targets come from `tauri.conf.json` (`bundle.targets`: deb, appimage), not
    # from a list here — two lists would disagree, and the config is what the
    # release path will read too.
    #
    # Unsigned, and on Linux that is the normal state rather than a gap: `.deb` and
    # AppImage carry no OS-enforced signature the way an APK or a notarised `.dmg`
    # does. What §3.2bis signs for these is the *updater* manifest (minisign) and
    # their provenance (cosign) — neither is this task's job, and neither exists yet.
    cmds:
      - cmd: |
          # `set -e` is not decoration here. Without it the `echo` below is the last
          # command in the block, so its exit code is the task's: a bundler that
          # failed produced a green task and a "Bundles:" line pointing at a
          # directory holding whatever the previous run left. That is exactly how
          # this was first written, and CI would have uploaded a stale artefact.
          set -eu
          {{.NEED_STACK}}
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            echo "The Tauri CLI is missing — run \`mise install\`."
            echo
            echo "Nothing was built."
            exit 0
          fi
          cd web/src-tauri && cargo tauri build {{.CLI_ARGS}}
          echo
          echo "Bundles: web/src-tauri/target/release/bundle/"

  dev:
    desc: "Run the desktop shell against the Vite dev server (§10bis.3, M5)"
    cmds:
      - cmd: |
          {{.NEED_STACK}}
          # Single quotes: backticks inside a double-quoted string are command
          # substitution, so this line used to *run* the dev server it names.
          echo 'Start `task dev:web` in another terminal first — the shell loads :5173.'
          cd web/src-tauri && cargo run

  check:
    desc: "Type-check the desktop shell without building it — still needs the stack"
    cmds:
      - cmd: |
          {{.NEED_STACK}}
          cd web/src-tauri && cargo clippy --all-targets -- -D warnings
