version: "3"

# The Tauri desktop shell (§10bis.3), outside the cargo workspace: it links a GTK/WebKit stack
# mise can't install. `doctor` says whether this machine can build it; the others run it first.

vars:
  # Reported by `doctor`, reused as a gate below.
  NEED_STACK: |
    if ! pkg-config --exists webkit2gtk-4.1 2>/dev/null; then
      task tauri:doctor
      echo
      echo "Nothing was built. See design §14.1 (M5) and §14.4 (D13)."
      exit 0
    fi

tasks:
  doctor:
    desc: "Report whether this machine can build the Tauri shell and what is missing (§10bis.3)."
    # Reports rather than fails, so it stays usable under `set -e`.
    silent: true
    cmds:
      - cmd: |
          echo "Tauri v2 · Linux build prerequisites"
          echo

          missing=0
          for lib in webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 gtk+-3.0; do
            if pkg-config --exists "$lib" 2>/dev/null; then
              printf '  %-24s ok\n' "$lib"
            else
              printf '  %-24s MISSING\n' "$lib"
              missing=$((missing + 1))
            fi
          done

          echo
          if [ "$missing" -eq 0 ]; then
            echo "Everything the shell links against is here."
            exit 0
          fi

          cat <<'EOF'
          This machine cannot build the desktop shell.

          These are system libraries: `mise` does not carry them (it ships tools,
          not C libraries), and installing them needs root — which a Che workspace
          does not give you, by design.

          The fix therefore belongs in the dev *image*, not in this repository, and
          the image is built in batleforc/WeeboDevImage. For a Debian or Ubuntu
          base, the packages are:

              libwebkit2gtk-4.1-dev
              libjavascriptcoregtk-4.1-dev
              libsoup-3.0-dev
              libgtk-3-dev
              libayatana-appindicator3-dev   # the tray (§10bis.3ter)
              librsvg2-dev                   # icon rendering
              patchelf                       # what the AppImage bundler calls

          On Fedora — including a toolbox on an rpm-ostree host, which is how a
          Silverblue workstation builds this without layering anything:

              webkit2gtk4.1-devel
              javascriptcoregtk4.1-devel
              libsoup3-devel
              gtk3-devel
              libayatana-appindicator-gtk3-devel   # the tray (§10bis.3ter)
              librsvg2-devel                       # icon rendering
              patchelf                             # what the AppImage bundler calls

          Read that tray line twice. Fedora also ships `libappindicator-gtk3-devel`,
          which is a different library rather than an alias — the pre-Ayatana one —
          so it installs without complaint, and leaves `ayatana-appindicator3-0.1`
          exactly as missing as it was. The four names this task checks above all
          come out `ok` at that point, because none of them is the tray; the failure
          surfaces later, in the link.

          Once the image ships them, `devfile.yaml` needs no change: the `tools`
          container inherits from the parent, so a rebuilt tag is the whole fix.

          See design §12.4 and §14.1 (M5).
          EOF

  build:
    desc: "Build the desktop shell (needs the GTK/WebKit stack, §10bis.3)."
    cmds:
      - cmd: |
          {{.NEED_STACK}}
          # Keep default features (the tray). `custom-protocol` makes the binary load `web/dist` instead
          # of `build.devUrl`. `TAURI_CONFIG` pins the CSP to `web/public/env.js`'s origins;
          # `--updater` adds `plugins.updater` when WNK_UPDATER_ENDPOINT/_PUBKEY are set, and fails
          # on an endpoint with no key.
          set -eu
          csp="$(node web/scripts/tauri-csp.ts --updater)"
          cd web/src-tauri && TAURI_CONFIG="$csp" cargo build --release --features custom-protocol

  bundle:
    desc: "Package the desktop shell as a .deb and an AppImage (§10bis.3, M5)"
    # `cargo tauri build` with the bundlers; targets come from `tauri.conf.json`. Signing is env-driven
    # (README « Updates and signing »): TAURI_SIGNING_PRIVATE_KEY signs the artefacts, WNK_UPDATER_ENDPOINT
    # + WNK_UPDATER_PUBKEY compile the updater in. Without them: unsigned, never-updating bundle.
    cmds:
      - cmd: |
          # `set -e`: otherwise a failed bundler yields a green task and a stale "Bundles:" line.
          set -eu
          {{.NEED_STACK}}
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            echo "The Tauri CLI is missing — run \`mise install\`."
            echo
            echo "Nothing was built."
            exit 0
          fi
          # A bundle is installed elsewhere and talks to whatever its env.js names,
          # for good — so it must never ship `web/public/env.js`'s localhost. These
          # are written into `dist/env.js` by `vite.config.ts` (`desktopEnv`) during
          # the `pnpm build` tauri runs, and pin the CSP below to the same origins.
          : "${WNK_API_BASE_URL:?set WNK_API_BASE_URL (and WNK_OIDC_ISSUER) to the deployment this bundle talks to}"
          : "${WNK_OIDC_ISSUER:?set WNK_OIDC_ISSUER to the identity provider of the deployment}"
          export WNK_API_BASE_URL WNK_OIDC_ISSUER
          csp="$(node web/scripts/tauri-csp.ts --updater)"
          cd web/src-tauri && cargo tauri build --config "$csp" {{.CLI_ARGS}}
          echo
          echo "Bundles: web/src-tauri/target/release/bundle/"

  dev:
    desc: "Run the desktop shell against the Vite dev server (§10bis.3)."
    cmds:
      - cmd: |
          {{.NEED_STACK}}
          # Single quotes: backticks in double quotes would run the command.
          echo 'Start `task dev:web` in another terminal first — the shell loads :5173.'
          cd web/src-tauri && cargo run

  check:
    desc: "Type-check the desktop shell without building it (still needs the stack)."
    cmds:
      - cmd: |
          {{.NEED_STACK}}
          cd web/src-tauri && cargo clippy --all-targets -- -D warnings
