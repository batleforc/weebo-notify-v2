version: "3"

# The Tauri desktop shell (design §10bis.3, milestone M5).
#
# Nothing here builds anything yet. What it does is answer, in one command and
# before anybody spends an afternoon on a link error, whether *this machine* can
# build the shell at all — because on Linux Tauri v2 links against a GTK/WebKit
# stack that is neither vendored nor installable by `mise`.

tasks:
  doctor:
    desc: "Say whether this machine can build the Tauri shell, and what is missing (§10bis.3)"
    # Why this exists as a task rather than as a paragraph in a README: the answer
    # differs per machine and changes when an image is rebuilt, so a sentence in a
    # document is out of date the moment somebody fixes their environment. A check
    # that runs is never out of date.
    #
    # It reports rather than fails: `task tauri:doctor` on a machine that cannot
    # build is answering its question correctly, and an exit code of 1 would make
    # it unusable from a shell with `set -e`.
    silent: true
    cmds:
      - cmd: |
          echo "Tauri v2 · Linux build prerequisites"
          echo

          missing=0
          for lib in webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 gtk+-3.0; do
            if pkg-config --exists "$lib" 2>/dev/null; then
              printf '  %-24s ok\n' "$lib"
            else
              printf '  %-24s MISSING\n' "$lib"
              missing=$((missing + 1))
            fi
          done

          echo
          if [ "$missing" -eq 0 ]; then
            echo "Everything the shell links against is here."
            exit 0
          fi

          cat <<'EOF'
          This machine cannot build the desktop shell.

          These are system libraries: `mise` does not carry them (it ships tools,
          not C libraries), and installing them needs root — which a Che workspace
          does not give you, by design.

          The fix therefore belongs in the dev *image*, not in this repository, and
          the image is built in batleforc/WeeboDevImage. For a Debian or Ubuntu
          base, the packages are:

              libwebkit2gtk-4.1-dev
              libjavascriptcoregtk-4.1-dev
              libsoup-3.0-dev
              libgtk-3-dev
              libayatana-appindicator3-dev   # the tray (§10bis.3ter)
              librsvg2-dev                   # icon rendering
              patchelf                       # what the AppImage bundler calls

          Once the image ships them, `devfile.yaml` needs no change: the `tools`
          container inherits from the parent, so a rebuilt tag is the whole fix.

          See design §12.4 and §14.1 (M5).
          EOF
